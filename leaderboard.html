<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard Dashboard</title>

<!--
  ╔══════════════════════════════════════════════════════════════════════════════╗
  ║                  PLECTO-STYLE LEADERBOARD DASHBOARD                          ║
  ╠══════════════════════════════════════════════════════════════════════════════╣
  ║                                                                              ║
  ║  ONE-TIME SETUP                                                              ║
  ║                                                                              ║
  ║  1. Create an OAuth 2.0 Client ID in Google Cloud Console:                   ║
  ║       https://console.cloud.google.com/apis/credentials                      ║
  ║       • Application type: Web application                                    ║
  ║       • Authorized JavaScript origins:                                       ║
  ║           https://<your-user>.github.io                                      ║
  ║           http://localhost:8000   (for local testing)                        ║
  ║       • Authorized redirect URIs:    (none needed for token flow)            ║
  ║                                                                              ║
  ║  2. Enable the Google Sheets API for the same project:                       ║
  ║       https://console.cloud.google.com/apis/library/sheets.googleapis.com    ║
  ║                                                                              ║
  ║  3. Paste the Client ID into OAUTH_CLIENT_ID below, commit, push.            ║
  ║                                                                              ║
  ║  4. Open https://<your-user>.github.io/<repo>/leaderboard.html               ║
  ║       • Sign in with Google                                                  ║
  ║       • Paste the Google Sheet URL, pick the data tab                        ║
  ║       • Configure date / email / numeric columns                             ║
  ║       • Add KPI / leaderboard / goal / chart widgets                         ║
  ║                                                                              ║
  ║  Dashboard config is stored in a hidden tab '__plecto_config' inside the     ║
  ║  same Google Sheet, so every viewer sees the same widgets.                   ║
  ║                                                                              ║
  ╚══════════════════════════════════════════════════════════════════════════════╝
-->

<script>
  /* ════════════════════════════════════════════════════════════════════════
     CONFIG — edit this block
     ════════════════════════════════════════════════════════════════════════ */
  window.PLECTO_CONFIG = {
    // Paste your Google OAuth 2.0 Web Client ID here
    OAUTH_CLIENT_ID: "757517778504-p193m141rl19g42qfcppv5jeoh60eump.apps.googleusercontent.com",

    // Scopes — needs read+write because dashboard config is stored in the sheet
    SCOPES: "https://www.googleapis.com/auth/spreadsheets",

    // How often to re-pull sheet data (ms)
    REFRESH_MS: 60_000,

    // Tab name used to store dashboard config inside the sheet
    CONFIG_TAB: "__plecto_config",

    // Tab name for per-user headshots / display names
    USERS_TAB: "__plecto_users",
  };
</script>

<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a31;
    --bg-3: #1a2542;
    --card: #131c36;
    --card-2: #182347;
    --border: #243056;
    --text: #e6ecff;
    --text-dim: #93a0c8;
    --text-faint: #5d6a93;
    --accent: #38e1c2;
    --accent-2: #5b8def;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #d97706;
    --danger: #ef4444;
    --success: #22c55e;
    --warn: #f59e0b;
    --shadow: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.35);
    --radius: 14px;
  }
  [data-theme="light"] {
    --bg: #f1f5f9;
    --bg-2: #e2e8f0;
    --bg-3: #cbd5e1;
    --card: #ffffff;
    --card-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-dim: #475569;
    --text-faint: #94a3b8;
    --accent: #0d9488;
    --accent-2: #2563eb;
    --shadow: 0 1px 0 rgba(0,0,0,.02), 0 8px 24px rgba(15,23,42,.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  /* ─── Top bar ──────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .brand {
    font-weight: 700; font-size: 15px; letter-spacing: .2px;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
  }
  .topbar .spacer { flex: 1; }
  .topbar .meta { color: var(--text-dim); font-size: 12px; }
  .topbar .meta b { color: var(--text); font-weight: 600; }
  .icon-btn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.primary {
    background: var(--accent); color: #001b15; border-color: var(--accent);
    font-weight: 600;
  }
  .icon-btn.primary:hover { filter: brightness(1.1); }
  .icon-btn.danger { color: var(--danger); border-color: rgba(239,68,68,.4); }

  /* ─── Filter bar ──────────────────────────────────────────── */
  .filterbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid transparent; cursor: pointer; user-select: none;
    transition: color .15s, background .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: rgba(56,225,194,.12); color: var(--accent);
    border-color: rgba(56,225,194,.3);
  }
  .filterbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .filterbar input[type="date"] {
    background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 12px;
  }

  /* ─── Dashboard grid ──────────────────────────────────────── */
  .stage { padding: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 72px;          /* base row height; widgets span N rows */
    gap: 14px;
  }
  .widget {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .widget.resizing {
    outline: 2px dashed var(--accent); outline-offset: -2px;
    z-index: 10;
  }
  .widget .w-actions {
    position: absolute; top: 8px; right: 8px;
    display: none; gap: 4px; z-index: 2;
  }
  .widget:hover .w-actions { display: flex; }
  .w-actions button {
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .w-actions button:hover { color: var(--text); }
  .w-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .8px; font-weight: 600; margin-bottom: 10px;
    flex-shrink: 0;
  }
  .w-body {
    flex: 1; min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
  }
  /* Resize handle in bottom-right corner */
  .resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 22px; height: 22px;
    cursor: nwse-resize; opacity: 0;
    transition: opacity .15s; z-index: 3;
  }
  .widget:hover .resize-handle { opacity: 1; }
  .resize-handle::before {
    content: ''; position: absolute; bottom: 4px; right: 4px;
    width: 10px; height: 10px;
    border-right: 2px solid var(--text-faint);
    border-bottom: 2px solid var(--text-faint);
  }
  .resize-handle:hover::before { border-color: var(--accent); }
  .resize-handle::after {
    content: ''; position: absolute; bottom: 7px; right: 7px;
    width: 4px; height: 4px;
    border-right: 2px solid var(--text-faint);
    border-bottom: 2px solid var(--text-faint);
  }
  .resize-handle:hover::after { border-color: var(--accent); }
  /* live size preview while resizing */
  .resize-preview {
    position: fixed; pointer-events: none; z-index: 200;
    background: var(--accent); color: #001b15;
    font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  @media (max-width: 700px) {
    /* on phones, force every widget to full width but keep custom row heights */
    .widget { grid-column: 1 / -1 !important; }
  }

  /* KPI tile */
  .kpi-value { font-size: 44px; font-weight: 700; letter-spacing: -.5px; }
  .kpi-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .kpi-delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
  .kpi-delta.up { color: var(--success); }
  .kpi-delta.down { color: var(--danger); }

  /* Goal */
  .goal-bar {
    height: 14px; background: var(--bg-3); border-radius: 999px;
    overflow: hidden; margin: 14px 0 8px;
  }
  .goal-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .6s ease;
  }
  .goal-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-dim);
  }
  .goal-meta .goal-pct { color: var(--text); font-weight: 700; font-size: 16px; }

  /* Leaderboard */
  .w-body > div:not(.chart-wrap) { overflow-y: auto; }
  .lb-row {
    display: grid;
    grid-template-columns: 44px 44px 1fr auto;
    align-items: center; gap: 13px;
    padding: 13px 8px; border-bottom: 1px solid var(--border);
    transition: background .2s;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row:hover { background: var(--card-2); }
  .lb-rank {
    font-size: 20px; font-weight: 700; color: var(--text-dim);
    text-align: center;
  }
  .lb-row.r1 .lb-rank { color: var(--gold); }
  .lb-row.r2 .lb-rank { color: var(--silver); }
  .lb-row.r3 .lb-rank { color: var(--bronze); }
  .lb-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-3); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; overflow: hidden;
    border: 2px solid transparent;
  }
  .lb-row.r1 .lb-avatar { border-color: var(--gold); }
  .lb-row.r2 .lb-avatar { border-color: var(--silver); }
  .lb-row.r3 .lb-avatar { border-color: var(--bronze); }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-name { font-weight: 600; font-size: 18px; }
  .lb-value { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }

  /* Chart */
  .chart-wrap { position: relative; flex: 1; min-height: 120px; }

  /* ─── Empty / login screens ───────────────────────────────── */
  .center-screen {
    min-height: calc(100vh - 64px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; max-width: 480px; width: 100%;
    box-shadow: var(--shadow);
  }
  .panel h2 { margin: 0 0 6px; font-size: 20px; }
  .panel p { color: var(--text-dim); margin: 0 0 18px; }
  .panel label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; }
  .panel input, .panel select {
    width: 100%; padding: 10px 12px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .panel .row { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

  /* ─── Modal ───────────────────────────────────────────────── */
  .modal-back {
    position: fixed; inset: 0; background: rgba(2,6,23,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
    width: 100%; max-width: 640px; max-height: 88vh; overflow: auto;
    box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal .modal-sub { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; font-weight: 600; }
  .modal input, .modal select {
    width: 100%; padding: 9px 11px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
  }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .filter-row {
    display: grid; grid-template-columns: 80px 1fr 1fr 1fr 32px;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .filter-row .combinator-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: var(--text-faint); text-transform: uppercase;
  }
  .filter-row .combinator-cell select {
    width: 100%; padding: 6px 4px; text-align: center;
    background: var(--bg-3); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; font-weight: 700;
  }
  .filter-row button {
    background: transparent; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; height: 36px;
  }
  .filter-row button:hover { color: var(--danger); border-color: var(--danger); }
  .add-filter-btn {
    background: transparent; color: var(--accent); border: 1px dashed var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    margin-top: 6px;
  }
  .add-filter-btn:hover { border-color: var(--accent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; z-index: 200;
    box-shadow: var(--shadow);
    animation: toast-in .2s ease;
  }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok  { border-color: var(--success); }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty h3 { color: var(--text); margin: 0 0 6px; }

  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* App shell with sidebar */
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-body { flex: 1; display: flex; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .main .stage { flex: 1; overflow: auto; padding: 16px; }

  .sidebar {
    width: 230px; flex-shrink: 0;
    background: var(--bg-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar-hdr {
    padding: 14px 14px 8px;
    font-size: 11px; font-weight: 700; color: var(--text-faint);
    letter-spacing: .8px; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-hdr .toggle-btn {
    background: transparent; color: var(--text-faint); border: none;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .sidebar-hdr .toggle-btn:hover { color: var(--text); background: var(--bg-3); }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px; }
  .sb-item {
    padding: 9px 10px; margin: 2px 4px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; color: var(--text-dim);
    font-size: 13px; transition: background .15s, color .15s;
    user-select: none;
  }
  .sb-item:hover { background: var(--card-2); color: var(--text); }
  .sb-item.active {
    background: rgba(56,225,194,.12); color: var(--accent);
    font-weight: 600;
  }
  .sb-icon { font-size: 14px; flex-shrink: 0; }
  .sb-name {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sb-actions { display: none; flex-shrink: 0; gap: 0; }
  .sb-item:hover .sb-actions, .sb-item.active .sb-actions { display: flex; }
  .sb-actions button {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; padding: 3px 5px; font-size: 11px; border-radius: 4px;
  }
  .sb-actions button:hover { color: var(--text); background: var(--bg-3); }
  .sb-new {
    padding: 9px 12px; margin: 8px;
    background: transparent; color: var(--accent);
    border: 1px dashed var(--border); border-radius: 8px;
    cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .sb-new:hover { border-color: var(--accent); background: rgba(56,225,194,.06); }
  /* collapsed sidebar */
  .sidebar.collapsed { width: 48px; }
  .sidebar.collapsed .sidebar-hdr span { display: none; }
  .sidebar.collapsed .sb-name, .sidebar.collapsed .sb-actions, .sidebar.collapsed .sb-new { display: none; }
  .sidebar.collapsed .sb-item { justify-content: center; padding: 9px 4px; }

  @media (max-width: 700px) {
    .sidebar { width: 100%; height: auto; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
    .app-body { flex-direction: column; }
  }

  /* tiny helper */
  .row { display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--text-dim); }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* People manager */
  .people-list { max-height: 60vh; overflow-y: auto; margin: 4px -4px; }
  .people-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px; align-items: center;
    padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); margin-bottom: 8px;
    background: var(--card-2);
  }
  .people-row .pp-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--bg-3); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; overflow: hidden;
  }
  .people-row .pp-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .people-row .pp-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .people-row .pp-meta input {
    width: 100%; padding: 6px 9px; font-size: 13px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .people-row .pp-email { font-size: 11px; color: var(--text-faint); }
  .people-row .pp-actions {
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
  }
  .people-row .pp-actions button {
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 11px; cursor: pointer;
    white-space: nowrap;
  }
  .people-row .pp-actions button:hover { color: var(--text); }
  .people-row .pp-actions button.danger { color: var(--danger); border-color: rgba(239,68,68,.3); }
  .people-search {
    width: 100%; padding: 8px 11px; margin-bottom: 12px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
  }
</style>
</head>
<body data-theme="dark">

<div id="app"></div>

<!-- Google Identity Services (OAuth) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Chart.js for time-series widget -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════════════
   App state
   ════════════════════════════════════════════════════════════════════════ */
const CFG = window.PLECTO_CONFIG;
const SHEETS_API = "https://sheets.googleapis.com/v4/spreadsheets";
const LS = {
  TOKEN:    "plecto.token",
  TOKEN_EXP:"plecto.token_exp",
  SHEET_ID: "plecto.sheet_id",
  TAB:      "plecto.tab",
  THEME:    "plecto.theme",
  USER:     "plecto.user_email",
  // local mirror of dashboard config, keyed by sheet ID — survives logout & token expiry
  CONFIG_CACHE: (sheetId) => `plecto.config.${sheetId}`,
  // which dashboard the current user last had open (per sheet, per browser)
  ACTIVE_DASH: (sheetId) => `plecto.activeDashboard.${sheetId}`,
  // sidebar collapsed state
  SIDEBAR: "plecto.sidebarCollapsed",
};

const state = {
  token: null,
  tokenExp: 0,
  tokenClient: null,
  user: null,        // { email }
  sheetId: null,
  sheetTitle: null,

function migrateConfig(cfg) {
  if (!cfg) return cfg;
  // legacy single-dashboard shape: { dataTab, columns, widgets } → wrap into a dashboards array
  if (Array.isArray(cfg.widgets) && !Array.isArray(cfg.dashboards)) {
    cfg.dashboards = [{ id: uid(), name: "Main Dashboard", icon: "📊", widgets: cfg.widgets }];
    delete cfg.widgets;
  }
  if (!Array.isArray(cfg.dashboards) || !cfg.dashboards.length) {
    cfg.dashboards = [{ id: uid(), name: "Main Dashboard", icon: "📊", widgets: [] }];
  }
  // ensure every dashboard has the required fields
  for (const d of cfg.dashboards) {
    if (!d.id) d.id = uid();
    if (!d.name) d.name = "Untitled";
    if (!d.icon) d.icon = "📊";
    if (!Array.isArray(d.widgets)) d.widgets = [];
  }
  return cfg;
}
function currentDashboard() {

  const id = state.activeDashboardId;
  return state.config.dashboards.find(d => d.id === id) || state.config.dashboards[0];
}
function setActiveDashboard(id) {
  state.activeDashboardId = id;

}

/* ════════════════════════════════════════════════════════════════════════
   Auth (Google Identity Services)
   ════════════════════════════════════════════════════════════════════════ */
function initTokenClient() {
  if (state.tokenClient) return;
  if (!window.google?.accounts?.oauth2) return;
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.OAUTH_CLIENT_ID,
    scope: CFG.SCOPES,
    callback: (resp) => {
      if (resp.error) {
        toast("Sign-in failed: " + resp.error, "err");
        return;
      }
      state.token = resp.access_token;
      state.tokenExp = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem(LS.TOKEN, state.token);
      localStorage.setItem(LS.TOKEN_EXP, String(state.tokenExp));
      // try to get email via userinfo
      fetchUserEmail().then(() => boot());
    },
  });
}
async function fetchUserEmail() {
  try {
    const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + state.token }
    });
    if (r.ok) {
      const d = await r.json();
      state.user = { email: d.email };
      localStorage.setItem(LS.USER, d.email || "");
    }
  } catch {}
}
function signIn() {
  if (CFG.OAUTH_CLIENT_ID.startsWith("PASTE_")) {
    toast("Set OAUTH_CLIENT_ID in the CONFIG block first", "err");
    return;
  }
  initTokenClient();
  if (!state.tokenClient) {
    toast("Google Identity script not loaded yet — try again in a second", "err");
    return;
  }
  state.tokenClient.requestAccessToken({ prompt: "select_account" });
}
function switchAccount() {
  // sign out locally then re-prompt with account chooser
  state.token = null; state.tokenExp = 0; state.user = null;
  localStorage.removeItem(LS.TOKEN);
  localStorage.removeItem(LS.TOKEN_EXP);
  localStorage.removeItem(LS.USER);
  signIn();
}
function signOut() {
  if (state.token && window.google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(state.token, () => {});
  }
  state.token = null; state.tokenExp = 0; state.user = null;
  localStorage.removeItem(LS.TOKEN);
  localStorage.removeItem(LS.TOKEN_EXP);
  localStorage.removeItem(LS.USER);
  clearInterval(state.refreshTimer);
  render();
}
function tokenValid() {
  return state.token && Date.now() < state.tokenExp;
}
function loadStoredAuth() {
  const tok = localStorage.getItem(LS.TOKEN);
  const exp = parseInt(localStorage.getItem(LS.TOKEN_EXP) || "0", 10);
  if (tok && Date.now() < exp) {
    state.token = tok;
    state.tokenExp = exp;
    state.user = { email: localStorage.getItem(LS.USER) || "" };
    return true;
  }
  return false;
}

/* ════════════════════════════════════════════════════════════════════════
   Sheets API
   ════════════════════════════════════════════════════════════════════════ */
async function api(path, opts={}) {
  if (!tokenValid()) {
    toast("Session expired — sign in again", "err");
    signOut();
    throw new Error("token expired");
  }
  const r = await fetch(SHEETS_API + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + state.token,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Sheets API ${r.status}: ${txt.slice(0, 200)}`);
  }
  return r.status === 204 ? null : r.json();
}
function parseSheetId(input) {
  if (!input) return null;
  const s = input.trim();
  const m = s.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}
async function fetchSheetMeta(id) {
  const meta = await api(`/${id}?fields=properties(title),sheets(properties(sheetId,title,index))`);
  return {
    title: meta.properties.title,
    tabs: meta.sheets.map(s => ({
      title: s.properties.title,
      sheetId: s.properties.sheetId,
      index: s.properties.index,
    })).sort((a,b) => a.index - b.index),
  };
}
async function fetchTabValues(sheetId, tabName) {
  const range = `'${tabName.replace(/'/g, "''")}'`;
  const data = await api(`/${sheetId}/values/${encodeURIComponent(range)}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  return data.values || [];
}
async function writeTabValues(sheetId, tabName, values) {
  const range = `'${tabName.replace(/'/g, "''")}'!A1`;
  // clear first, then write
  await api(`/${sheetId}/values/${encodeURIComponent("'" + tabName.replace(/'/g, "''") + "'")}:clear`, { method: "POST", body: "{}" });
  await api(`/${sheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
    method: "PUT",
    body: JSON.stringify({ values }),
  });
}
async function ensureConfigTab(sheetId) {
  const has = state.tabs.some(t => t.title === CFG.CONFIG_TAB);
  if (has) return;
  try {
    await api(`/${sheetId}:batchUpdate`, {
      method: "POST",
      body: JSON.stringify({
        requests: [{
          addSheet: {
            properties: {
              title: CFG.CONFIG_TAB,
              hidden: true,
              gridProperties: { rowCount: 200, columnCount: 4 },
            },
          },
        }],
      }),
    });
    const meta = await fetchSheetMeta(sheetId);
    state.tabs = meta.tabs;
  } catch (e) {
    // 403 → user has view-only access; continue, they'll just see existing dashboard
    if (String(e.message).includes("403")) { state.readOnly = true; return; }
    throw e;
  }
}

/* ════════════════════════════════════════════════════════════════════════
   Config persistence (config tab inside the sheet)
   schema: A=key, B=value(json), C=updatedAt, D=updatedBy
   ════════════════════════════════════════════════════════════════════════ */
function readCachedConfig(sheetId) {
  try {
    const raw = localStorage.getItem(LS.CONFIG_CACHE(sheetId));
    const parsed = raw ? migrateConfig(JSON.parse(raw)) : null;
    if (parsed) console.log("[plecto] loaded config from local cache:", parsed.dashboards?.length, "dashboards");
    return parsed;
  } catch { return null; }
}
function writeCachedConfig(sheetId, cfg) {
  try {
    localStorage.setItem(LS.CONFIG_CACHE(sheetId), JSON.stringify(cfg));
    console.log("[plecto] cached config locally:", cfg.widgets?.length, "widgets");
  } catch (e) { console.warn("[plecto] localStorage write failed:", e.message); }
}
function readCachedSheetTitle(sheetId) {
  return localStorage.getItem("plecto.sheetTitle." + sheetId) || null;
}
function writeCachedSheetTitle(sheetId, title) {
  try { localStorage.setItem("plecto.sheetTitle." + sheetId, title); } catch {}
}
async function loadConfig() {
  let rows;
  try {
    rows = await fetchTabValues(state.sheetId, CFG.CONFIG_TAB);
  } catch (e) {
    // fall back to local cache if the sheet read fails (network blip, transient 403, etc.)
    return readCachedConfig(state.sheetId);
  }
  if (!rows || rows.length < 2) return readCachedConfig(state.sheetId);
  const map = {};
  for (let i = 1; i < rows.length; i++) {
    const [k, v] = rows[i];
    if (!k) continue;
    try { map[k] = JSON.parse(v); } catch { map[k] = v; }
  }
  if (!map.dashboard) return readCachedConfig(state.sheetId);
  const migrated = migrateConfig(map.dashboard);
  // mirror to local cache so subsequent boots are instant + survive offline / read failures
  writeCachedConfig(state.sheetId, migrated);
  return migrated;
}
async function saveConfig(cfg) {
  // mirror locally FIRST so config survives even if the sheet write fails
  state.config = cfg;
  writeCachedConfig(state.sheetId, cfg);
  state.saveState = "saving"; state.saveError = null; renderTopbar();
  const values = [
    ["key", "value", "updatedAt", "updatedBy"],
    ["dashboard", JSON.stringify(cfg), new Date().toISOString(), state.user?.email || ""],
    ["dataTab", JSON.stringify(state.dataTab), new Date().toISOString(), state.user?.email || ""],
  ];
  try {
    await writeTabValues(state.sheetId, CFG.CONFIG_TAB, values);
    state.readOnly = false;
    state.saveState = "saved"; renderTopbar();
    setTimeout(() => { if (state.saveState === "saved") { state.saveState = "idle"; renderTopbar(); } }, 2500);
  } catch (e) {
    state.saveState = "error";
    state.saveError = e.message;
    renderTopbar();
    if (String(e.message).includes("403")) {
      state.readOnly = true;
      throw new Error("You have view-only access to this sheet — ask the owner to give you Editor access to change widgets.");
    }
    throw e;
  }
}

  }

    }
    throw e;
  }
}

/* Resize a File (image) to a square JPEG data URL of the given pixel size.
   At 96px / quality 0.82 a typical face photo becomes ~5KB base64 — small
   enough to fit comfortably in a single Sheets cell. */
function resizeImageToDataUrl(file, size = 128, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const min = Math.min(img.width, img.height);
      const sx = (img.width  - min) / 2;
      const sy = (img.height - min) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image file")); };
    img.src = url;
  });
}

async function loadData() {
  if (!state.sheetId || !state.dataTab) return;
  state.loading = true;
  renderTopbar();
  try {

/* Convert a sheet cell to a JS Date that represents the same wall-clock day
   in the user's local timezone. Sheets stores dates as serial numbers
   (days since 1899-12-30) and they should be interpreted as local time —
   not UTC — otherwise a sale on May 1 CDT looks like Apr 30 in UTC and
   falls out of MTD/Today filters. */
function toDate(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return v;
  if (typeof v === "number") {
    const dayPart = Math.floor(v);
    const timePart = v - dayPart;
    // Build the calendar date at UTC midnight, then re-anchor to the SAME
    // Y/M/D at LOCAL midnight so the date isn't shifted by the user's TZ.
    const utcMs = (dayPart - 25569) * 86400000;
    const u = new Date(utcMs);
    const d = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
    if (timePart > 0) {
      const dayMs = Math.round(timePart * 86400000);
      d.setHours(0, 0, 0, 0);
      d.setTime(d.getTime() + dayMs);
    }
    return isNaN(d) ? null : d;
  }
  if (typeof v === "string") {
    const s = v.trim();
    // Bare ISO date like "2026-05-01" — force local midnight, not UTC
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
      const [y, m, day] = s.split("-").map(Number);
      return new Date(y, m - 1, day);
    }
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  return null;
}
function toNumber(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return v;
  const cleaned = String(v).replace(/[$,\s]/g, "").replace(/[()]/g, "");
  const neg = String(v).includes("(");
  const n = parseFloat(cleaned);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

/* ════════════════════════════════════════════════════════════════════════
   Time-period filtering
   ════════════════════════════════════════════════════════════════════════ */
const TIME_LABELS = {
  TODAY: "Today", YESTERDAY: "Yesterday", WEEK: "This Week", LAST_WEEK: "Last Week",
  MTD: "MTD", QTD: "QTD", YTD: "YTD", ALL: "All Time", CUSTOM: "Custom",
};
function timeFilterLabel(kind) { return TIME_LABELS[kind] || kind; }

function timeRange(kind, custom) {
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);
  const today = startOfDay(now);
  switch (kind) {
    case "TODAY":     return [today, endOfDay(now)];
    case "YESTERDAY": { const y = new Date(today); y.setDate(y.getDate()-1); return [y, endOfDay(y)]; }
    case "WEEK": {
      const s = new Date(today); s.setDate(s.getDate() - 6);
      return [s, endOfDay(now)];
    }
    case "LAST_WEEK": {
      const s = new Date(today); s.setDate(s.getDate() - 13);
      const e = new Date(today); e.setDate(e.getDate() - 7);
      return [s, endOfDay(e)];
    }
    case "MTD":  return [new Date(now.getFullYear(), now.getMonth(), 1), endOfDay(now)];
    case "QTD": {
      const q = Math.floor(now.getMonth()/3)*3;
      return [new Date(now.getFullYear(), q, 1), endOfDay(now)];
    }
    case "YTD":  return [new Date(now.getFullYear(), 0, 1), endOfDay(now)];
    case "ALL":  return [new Date(0), endOfDay(now)];
    case "CUSTOM": {
      const s = custom?.start ? new Date(custom.start) : new Date(0);
      const e = custom?.end   ? endOfDay(new Date(custom.end)) : endOfDay(now);
      return [s, e];
    }
    default: return [new Date(0), endOfDay(now)];
  }
}

/* ════════════════════════════════════════════════════════════════════════
   Formula engine
   ────────────────────────────────────────────────────────────────────────
   filterRow:    operators on a single column
   aggregateRows: SUM | COUNT | COUNT_DISTINCT | AVG | MIN | MAX
   evalWidget:   applies time filter + widget filters + groupBy as needed
   ════════════════════════════════════════════════════════════════════════ */
const OPERATORS = ["equals","not_equals","contains","not_contains","gt","lt","gte","lte","between","is_empty","not_empty"];

function applyFilter(value, op, target, target2) {
  switch (op) {
    case "equals":       return String(value ?? "") === String(target ?? "");
    case "not_equals":   return String(value ?? "") !== String(target ?? "");
    case "contains":     return String(value ?? "").toLowerCase().includes(String(target ?? "").toLowerCase());
    case "not_contains": return !String(value ?? "").toLowerCase().includes(String(target ?? "").toLowerCase());
    case "gt":           return toNumber(value) >  toNumber(target);
    case "lt":           return toNumber(value) <  toNumber(target);
    case "gte":          return toNumber(value) >= toNumber(target);
    case "lte":          return toNumber(value) <= toNumber(target);
    case "between": {
      const n = toNumber(value);
      return n != null && n >= toNumber(target) && n <= toNumber(target2);
    }
    case "is_empty":     return value == null || String(value).trim() === "";
    case "not_empty":    return value != null && String(value).trim() !== "";
    default: return true;
  }
}
/* Evaluate filters with AND/OR. Each filter (except the first) has a
   combinator: "AND" | "OR". AND binds tighter than OR (standard logic).
     A AND B OR C AND D  =>  (A AND B) OR (C AND D)
     A OR B              =>  A OR B
     A AND B AND C       =>  all required
   First filter's combinator is ignored. Filters with no `combinator`
   field default to AND (back-compat with the old all-must-match shape). */
function rowMatchesFilters(row, filters) {
  if (!filters || !filters.length) return true;
  const groups = [[filters[0]]];
  for (let i = 1; i < filters.length; i++) {
    const f = filters[i];
    if ((f.combinator || "AND") === "OR") groups.push([f]);
    else groups[groups.length - 1].push(f);
  }
  return groups.some(g => g.every(f => applyFilter(row[f.column], f.op, f.value, f.value2)));
}
// keep old name as alias so existing call sites don't break
const rowMatchesAll = rowMatchesFilters;
function rowsInTimeRange(rows, dateCol, range) {
  if (!dateCol) return rows;
  const [start, end] = range;
  return rows.filter(r => {
    const d = toDate(r[dateCol]);
    return d && d >= start && d <= end;
  });
}
function aggregate(rows, agg, column) {
  if (agg === "COUNT") return rows.length;
  if (agg === "COUNT_DISTINCT") {
    const s = new Set();
    rows.forEach(r => { const v = r[column]; if (v != null && v !== "") s.add(String(v)); });
    return s.size;
  }
  const nums = rows.map(r => toNumber(r[column])).filter(v => v != null);
  if (!nums.length) return 0;
  switch (agg) {
    case "SUM": return nums.reduce((a,b) => a+b, 0);
    case "AVG": return nums.reduce((a,b) => a+b, 0) / nums.length;
    case "MIN": return Math.min(...nums);
    case "MAX": return Math.max(...nums);
    default:    return 0;
  }
}

function render() {
  const app = $("#app");
  app.innerHTML = "";

  if (!tokenValid()) {
    app.append(renderLogin());
    return;
  }
  const shell = el("div", { class: "app-shell" });
  app.append(shell);

  if (!state.sheetId) {
    shell.append(renderTopbar(), renderSheetPicker());
    return;
  }
  if (!state.dataTab || !state.config) {
    shell.append(renderTopbar(), renderDataTabPicker());
    return;
  }

  // ensure activeDashboardId is set (per-user)
  if (!state.activeDashboardId) {
    const stored = localStorage.getItem(LS.ACTIVE_DASH(state.sheetId));
    state.activeDashboardId = (stored && state.config.dashboards.some(d => d.id === stored))
      ? stored : state.config.dashboards[0].id;
  } else if (!state.config.dashboards.some(d => d.id === state.activeDashboardId)) {
    state.activeDashboardId = state.config.dashboards[0].id;
  }

  shell.append(renderTopbar());
  const body = el("div", { class: "app-body" });
  body.append(renderSidebar());
  const main = el("div", { class: "main" });
  main.append(renderFilterbar());
  const stage = el("div", { class: "stage", id: "stage" });

  renderDashboard();
}

      const cols = (values[0] || []).map(c => String(c ?? "").trim());
      cols.forEach(c => {

      // best-effort defaults
      const guess = (re) => cols.find(c => re.test(c));
      const gd = guess(/date|created|timestamp|time/i); if (gd) dateSel.value = gd;
      const ge = guess(/email|mail/i); if (ge) emailSel.value = ge;

    }
  }

  loadCols();

        dataTab: tabSel.value,
        columns: { date: dateSel.value, email: emailSel.value, name: nameSel.value || null },
        dashboards: existingDashboards,
      };
      if (!state.activeDashboardId) state.activeDashboardId = existingDashboards[0].id;
      try {
        await saveConfig(cfg);
        await loadData();
        startAutoRefresh();
        render();
      } catch (e) {
        toast("Failed to save config: " + e.message, "err");

    } }, "Save & build dashboard"),
  ));
  cs.append(p);
  return cs;
}

    return;
  }
  const d = state.config.dashboards.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`Delete "${d.name}"? Its widgets will be lost.`)) return;
  state.config.dashboards = state.config.dashboards.filter(x => x.id !== id);
  if (state.activeDashboardId === id) {
    state.activeDashboardId = state.config.dashboards[0].id;
    if (state.sheetId) localStorage.setItem(LS.ACTIVE_DASH(state.sheetId), state.activeDashboardId);
  }
  try {
    await saveConfig(state.config);
    render();
  } catch (e) { toast("Save failed: " + e.message, "err"); }
}

function renderDashboard() {
  // destroy old charts
  state.charts.forEach(c => c.destroy());
  state.charts.clear();

  const stage = $("#stage");
  if (!stage) return;
  stage.innerHTML = "";
  const dash = currentDashboard();
  if (!dash || !dash.widgets || !dash.widgets.length) {
    stage.append(el("div", { class: "empty" },
      el("h3", {}, "No widgets yet"),
      el("p", {}, "Click + Widget in the top bar to add your first KPI, leaderboard, goal, or chart."),
    ));
    return;
  }
  const grid = el("div", { class: "grid" });
  dash.widgets.forEach(w => grid.append(renderWidget(w)));
  stage.append(grid);
}

/* default widget dimensions (grid cols × rows of 72px) */
function defaultSpan(kind) {
  switch (kind) {
    case "leaderboard": return { cols: 6, rows: 6 };
    case "chart":       return { cols: 8, rows: 4 };
    case "goal":        return { cols: 4, rows: 3 };
    case "kpi":         return { cols: 3, rows: 2 };
    default:            return { cols: 4, rows: 3 };
  }
}
/* migration: translate legacy `size` (1..5) to new cols/rows if needed */
function widgetSpan(w) {
  if (w.cols && w.rows) return { cols: w.cols, rows: w.rows };
  if (w.size) {
    const cols = ({1:3, 2:4, 3:6, 4:8, 5:12}[w.size]) || 4;
    const def = defaultSpan(w.kind);
    return { cols, rows: def.rows };
  }
  return defaultSpan(w.kind);
}

function renderWidget(w) {
  const span = widgetSpan(w);
  const node = el("div", { class: "widget" });
  node.style.gridColumn = `span ${span.cols}`;
  node.style.gridRow = `span ${span.rows}`;

  if (!state.readOnly) {
    node.append(el("div", { class: "w-actions" },
      el("button", { onclick: () => openWidgetModal(w.id) }, "Edit"),
      el("button", { onclick: () => deleteWidget(w.id) }, "✕"),
    ));
  }

  // Resolve effective time filter:
  //   global AUTO -> use widget's own setting (default "MTD")
  //   anything else -> global overrides
  const effective = state.timeFilter.kind === "AUTO"
    ? { kind: w.timeFilter || "MTD" }
    : state.timeFilter;
  const range = timeRange(effective.kind, { start: state.timeFilter.customStart, end: state.timeFilter.customEnd });

  const titleRow = el("div", { class: "w-title", style: "display:flex;justify-content:space-between;align-items:center;gap:8px" });
  titleRow.append(el("span", { style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, w.title || w.kind));
  titleRow.append(el("span", {
    style: "font-size:10px;color:" + (state.timeFilter.kind === "AUTO" ? "var(--text-faint)" : "var(--accent)") + ";font-weight:600;letter-spacing:.4px;flex-shrink:0",
    title: state.timeFilter.kind === "AUTO" ? "This widget's saved time period" : "Overridden by global filter",
  }, timeFilterLabel(effective.kind)));
  node.append(titleRow);

  const body = el("div", { class: "w-body" });
  node.append(body);

  const dateCol = state.config.columns.date;
  const inRange = rowsInTimeRange(state.rows, dateCol, range).filter(r => rowMatchesAll(r, w.filters));

  try {
    if (w.kind === "kpi")         renderKpi(body, w, inRange);
    else if (w.kind === "goal")   renderGoal(body, w, inRange);
    else if (w.kind === "leaderboard") renderLeaderboard(body, w, inRange);
    else if (w.kind === "chart")  renderChart(body, w, inRange, range);
  } catch (e) {
    console.error(e);
    body.append(el("div", { class: "muted" }, "Error: " + e.message));
  }

  // Drag-to-resize (admins only)
  if (!state.readOnly) {
    const handle = el("div", { class: "resize-handle", title: "Drag to resize" });
    handle.addEventListener("mousedown", e => startResize(e, node, w));
    handle.addEventListener("touchstart", e => startResize(e.touches[0], node, w, true), { passive: false });
    node.append(handle);
  }
  return node;
}

let _resizeState = null;
function startResize(e, widgetNode, w, isTouch) {
  e.preventDefault?.();
  const grid = widgetNode.parentElement;
  const gridStyles = getComputedStyle(grid);
  const cols = 12;
  const gap = parseFloat(gridStyles.rowGap) || parseFloat(gridStyles.gap) || 14;
  const rowH = parseFloat(gridStyles.gridAutoRows) || 72;
  const colW = (grid.clientWidth - gap * (cols - 1)) / cols;
  const startSpan = widgetSpan(w);
  const startX = e.clientX, startY = e.clientY;
  widgetNode.classList.add("resizing");

  const preview = el("div", { class: "resize-preview" }, `${startSpan.cols}×${startSpan.rows}`);
  document.body.append(preview);
  function positionPreview(ev) {
    preview.style.left = (ev.clientX + 14) + "px";
    preview.style.top  = (ev.clientY + 14) + "px";
  }
  positionPreview(e);

  function getPoint(ev) {
    if (ev.touches?.[0]) return ev.touches[0];
    return ev;
  }
  function onMove(ev) {
    const pt = getPoint(ev);
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const newCols = Math.max(2, Math.min(12, Math.round(startSpan.cols + dx / (colW + gap))));
    const newRows = Math.max(2, Math.round(startSpan.rows + dy / (rowH + gap)));
    widgetNode.style.gridColumn = `span ${newCols}`;
    widgetNode.style.gridRow    = `span ${newRows}`;
    w.cols = newCols; w.rows = newRows;
    delete w.size; // legacy field — superseded by cols/rows
    preview.textContent = `${newCols}×${newRows}`;
    positionPreview(pt);
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
    widgetNode.classList.remove("resizing");
    preview.remove();
    saveConfig(state.config).catch(e => toast("Save failed: " + e.message, "err"));
    renderDashboard(); // re-render so chart canvases pick up the new size
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchmove", onMove, { passive: false });
  document.addEventListener("touchend", onUp);
}

function renderKpi(node, w, rows) {
  const v = aggregate(rows, w.agg, w.column);
  const pretty = w.format === "money" ? fmtMoney(v) : fmtNum(v);
  node.append(el("div", { class: "kpi-value" }, pretty));
  if (w.subtitle) node.append(el("div", { class: "kpi-sub" }, w.subtitle));
}

function renderGoal(node, w, rows) {
  const v = aggregate(rows, w.agg, w.column);
  const target = Number(w.target) || 0;
  const pct = target > 0 ? Math.min(100, (v / target) * 100) : 0;
  const meta = el("div", { class: "goal-meta" });
  meta.append(
    el("div", {}, el("div", { class: "goal-pct" }, pct.toFixed(0) + "%")),
    el("div", {}, (w.format === "money" ? fmtMoney(v) : fmtNum(v)) + " / " + (w.format === "money" ? fmtMoney(target) : fmtNum(target))),
  );
  node.append(meta);
  const bar = el("div", { class: "goal-bar" });
  const fill = el("div"); fill.style.width = pct + "%";
  bar.append(fill);
  node.append(bar);
}

async function renderLeaderboard(node, w, rows) {
  const groupCol = w.groupBy || state.config.columns.email;
  const nameCol  = state.config.columns.name;
  const groups = new Map();
  for (const r of rows) {
    const key = r[groupCol]; if (key == null || key === "") continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const list = Array.from(groups.entries()).map(([key, grows]) => {
    const email = state.config.columns.email ? grows[0][state.config.columns.email] : null;
    const fallbackName = nameCol ? (grows[0][nameCol] || key) : key;
    return {
      key,
      name: userDisplayName(email, fallbackName),
      email,
      value: aggregate(grows, w.agg, w.column),
    };
  }).sort((a,b) => (b.value||0) - (a.value||0));
  const top = list.slice(0, w.limit || 10);
  const wrap = el("div");
  if (!top.length) {
    // diagnostic empty state — help the user figure out what's filtered out
    const totalRows = state.rows.length;
    const groupColLabel = groupCol || "(unset — set 'Email column' in Settings)";
    const dateCol = state.config.columns.date;
    const datesInRange = dateCol ? rowsInTimeRange(state.rows, dateCol, timeRange(state.timeFilter.kind, { start: state.timeFilter.customStart, end: state.timeFilter.customEnd })).length : totalRows;
    wrap.append(
      el("div", { class: "muted", style: "font-size:12px;line-height:1.7" },
        el("div", {}, `No matching rows.`),
        el("div", {}, `Sheet rows total: ${totalRows}`),
        el("div", {}, `Rows in time range: ${datesInRange} (date column: ${dateCol || "(unset)"})`),
        el("div", {}, `Group-by column: ${groupColLabel}`),
        totalRows > 0 && datesInRange === 0
          ? el("div", { style: "color:var(--warn);margin-top:6px" }, "→ All rows fell outside the time range. Check that the Date column in Settings points to the actual date column.")
          : null,
      ),
    );
    node.append(wrap); return;
  }
  for (let i = 0; i < top.length; i++) {
    const it = top[i];
    const row = el("div", { class: "lb-row" + (i<3 ? " r"+(i+1) : "") });
    const av = el("div", { class: "lb-avatar" }, initials(it.name || it.email));
    // priority: custom uploaded photo → Gravatar → initials
    const customPhoto = userPhotoUrl(it.email);
    if (customPhoto) {
      const im = new Image(); im.src = customPhoto;
      im.onload = () => { av.innerHTML = ""; av.append(im); };
    } else if (it.email) {
      gravatar(it.email).then(url => {
        if (!url) return;
        const im = new Image(); im.src = url;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      });
    }
    const valLabel = w.format === "money" ? fmtMoney(it.value) : fmtNum(it.value);
    row.append(
      el("div", { class: "lb-rank" }, "#" + (i+1)),
      av,
      el("div", { class: "lb-name" }, it.name),
      el("div", { class: "lb-value" }, valLabel),
    );
    wrap.append(row);
  }
  node.append(wrap);
}

function renderChart(node, w, rows, range) {
  const wrap = el("div", { class: "chart-wrap" });
  const cv = el("canvas");
  wrap.append(cv); node.append(wrap);
  const dateCol = state.config.columns.date;
  if (!dateCol) { node.append(el("div", { class: "muted" }, "No date column configured.")); return; }
  // bucket by day (or by month if range > 90 days)
  const days = (range[1] - range[0]) / 86400000;
  const bucketKind = days > 90 ? "month" : "day";
  const buckets = new Map();
  for (const r of rows) {
    const d = toDate(r[dateCol]); if (!d) continue;
    const key = bucketKind === "month"
      ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`
      : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(r);
  }
  const labels = Array.from(buckets.keys()).sort();
  const data = labels.map(k => aggregate(buckets.get(k), w.agg, w.column));
  const css = getComputedStyle(document.body);
  const accent = css.getPropertyValue("--accent").trim() || "#38e1c2";
  const txt = css.getPropertyValue("--text-dim").trim() || "#93a0c8";
  const grid = css.getPropertyValue("--border").trim() || "#243056";
  const ch = new Chart(cv, {
    type: w.chartType === "bar" ? "bar" : "line",
    data: { labels, datasets: [{
      label: w.title, data, borderColor: accent, backgroundColor: accent + "33",
      tension: 0.35, fill: true, pointRadius: 2, borderWidth: 2,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: txt }, grid: { color: grid } },
        y: { ticks: { color: txt }, grid: { color: grid }, beginAtZero: true },
      },
    },
  });
  state.charts.set(w.id, ch);
}

/* ════════════════════════════════════════════════════════════════════════
   Widget editor modal

function openWidgetModal(widgetId) {
  const dash = currentDashboard();
  if (!dash) return;
  const isNew = !widgetId;
  const w = isNew
    ? { id: uid(), kind: "kpi", title: "New KPI", ...defaultSpan("kpi"), agg: "COUNT", column: "", filters: [] }
    : JSON.parse(JSON.stringify(dash.widgets.find(x => x.id === widgetId)));

  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const m = el("div", { class: "modal" });
  m.append(
    el("h3", {}, isNew ? "Add widget" : "Edit widget"),
    el("div", { class: "modal-sub" }, "Pick a widget type, then choose what to measure and how to filter it."),
  );

  // type
  m.append(el("label", {}, "Widget type"));
  const kindSel = el("select");
  [["kpi","KPI tile"],["goal","Goal / progress"],["leaderboard","Leaderboard"],["chart","Trend chart"]].forEach(([v,l]) => {
    kindSel.append(el("option", { value: v, selected: w.kind === v ? "selected" : null }, l));
  });
  m.append(kindSel);

  // body container — re-render when kind changes
  const body = el("div");
  m.append(body);

  function renderBody() {
    body.innerHTML = "";
    body.append((() => {
      const w1 = el("div");
      w1.append(el("label", {}, "Title"));
      const t = el("input", { type: "text", value: w.title || "" });
      t.addEventListener("input", () => w.title = t.value);
      w1.append(t);
      w1.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
        "💡 Drag the bottom-right corner of any widget to resize it after saving."));
      return w1;
    })());

    // Per-widget time period
    body.append(el("label", {}, "Time period"));
    const timeSel = el("select");
    [
      ["TODAY","Today"],["YESTERDAY","Yesterday"],
      ["WEEK","This Week"],["LAST_WEEK","Last Week"],
      ["MTD","MTD"],["QTD","QTD"],["YTD","YTD"],
      ["ALL","All Time"],
    ].forEach(([v,l]) => {
      timeSel.append(el("option", { value: v, selected: (w.timeFilter || "MTD") === v ? "selected" : null }, l));
    });
    timeSel.addEventListener("change", () => w.timeFilter = timeSel.value);
    body.append(timeSel);
    body.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
      "💡 This applies when the top filter is set to 'Auto (per widget)'. Selecting Today/MTD/etc. up there overrides every widget."));

    // aggregation + column
    body.append(el("div", { class: "row2" },
      (() => { const c = el("div");
        c.append(el("label", {}, "Aggregation"));
        const a = el("select");
        ["COUNT","COUNT_DISTINCT","SUM","AVG","MIN","MAX"].forEach(v => {
          a.append(el("option", { value: v, selected: w.agg === v ? "selected" : null }, v.replace("_"," ")));
        });
        a.addEventListener("change", () => w.agg = a.value);
        c.append(a); return c;
      })(),
      (() => { const c = el("div");
        c.append(el("label", {}, "Column" + (w.kind === "leaderboard" || w.kind === "kpi" || w.kind==="goal" || w.kind==="chart" ? " (numeric for SUM/AVG/MIN/MAX)" : "")));
        const a = el("select");
        a.append(el("option", { value: "" }, "(none)"));
        state.columns.forEach(c2 => a.append(el("option", { value: c2, selected: w.column === c2 ? "selected" : null }, c2)));
        a.addEventListener("change", () => w.column = a.value);
        c.append(a); return c;
      })(),
    ));

    // format
    body.append(el("label", {}, "Number format"));
    const fmt = el("select");
    [["number","Number"],["money","Currency ($)"]].forEach(([v,l]) => {
      fmt.append(el("option", { value: v, selected: (w.format||"number")===v ? "selected" : null }, l));
    });
    fmt.addEventListener("change", () => w.format = fmt.value);
    body.append(fmt);

    // kind-specific
    if (w.kind === "goal") {
      body.append(el("label", {}, "Target value"));
      const t = el("input", { type: "number", value: w.target ?? "" });
      t.addEventListener("input", () => w.target = parseFloat(t.value));
      body.append(t);
    }
    if (w.kind === "leaderboard") {
      body.append(el("div", { class: "row2" },
        (() => { const c = el("div");
          c.append(el("label", {}, "Group by (default = email)"));
          const a = el("select");
          a.append(el("option", { value: "" }, "(default: email column)"));
          state.columns.forEach(c2 => a.append(el("option", { value: c2, selected: w.groupBy===c2 ? "selected" : null }, c2)));
          a.addEventListener("change", () => w.groupBy = a.value);
          c.append(a); return c;
        })(),
        (() => { const c = el("div");
          c.append(el("label", {}, "Show top N"));
          const i = el("input", { type: "number", value: w.limit || 10, min: "1", max: "100" });
          i.addEventListener("input", () => w.limit = parseInt(i.value,10) || 10);
          c.append(i); return c;
        })(),
      ));
    }
    if (w.kind === "chart") {
      body.append(el("label", {}, "Chart type"));
      const a = el("select");
      [["line","Line"],["bar","Bar"]].forEach(([v,l]) => {
        a.append(el("option", { value: v, selected: (w.chartType||"line")===v ? "selected" : null }, l));
      });
      a.addEventListener("change", () => w.chartType = a.value);
      body.append(a);
    }

    // filters
    body.append(el("label", {}, "Filters (mix AND/OR — AND binds tighter than OR)"));
    const fwrap = el("div");
    body.append(fwrap);
    function renderFilters() {
      fwrap.innerHTML = "";
      (w.filters || []).forEach((f, idx) => {
        const row = el("div", { class: "filter-row" });

        // first row: "WHERE" label; subsequent rows: AND/OR selector
        const combo = el("div", { class: "combinator-cell" });
        if (idx === 0) {
          combo.append(el("span", {}, "WHERE"));
        } else {
          const sel = el("select");
          sel.append(el("option", { value: "AND", selected: (f.combinator || "AND") === "AND" ? "selected" : null }, "AND"));
          sel.append(el("option", { value: "OR",  selected: f.combinator === "OR"  ? "selected" : null }, "OR"));
          sel.addEventListener("change", () => { f.combinator = sel.value; });
          combo.append(sel);
        }

        const cs = el("select");
        cs.append(el("option", { value: "" }, "(column)"));
        state.columns.forEach(c2 => cs.append(el("option", { value: c2, selected: f.column === c2 ? "selected" : null }, c2)));
        cs.addEventListener("change", () => { f.column = cs.value; });
        const os = el("select");
        OPERATORS.forEach(o => os.append(el("option", { value: o, selected: f.op === o ? "selected" : null }, o.replace(/_/g," "))));
        os.addEventListener("change", () => { f.op = os.value; renderFilters(); });
        const vs = el("input", { type: "text", placeholder: "value", value: f.value ?? "" });
        vs.addEventListener("input", () => f.value = vs.value);
        if (["is_empty","not_empty"].includes(f.op)) vs.style.visibility = "hidden";
        const rm = el("button", { onclick: () => { w.filters.splice(idx,1); renderFilters(); } }, "✕");
        row.append(combo, cs, os, vs, rm);
        fwrap.append(row);
      });
      const add = el("button", { class: "add-filter-btn", onclick: () => {
        w.filters = w.filters || [];
        w.filters.push({ combinator: "AND", column: "", op: "equals", value: "" });
        renderFilters();
      } }, "+ Add filter");
      fwrap.append(add);
    }
    renderFilters();
  }
  kindSel.addEventListener("change", () => { w.kind = kindSel.value; renderBody(); });
  renderBody();

  m.append(el("div", { class: "actions" },
    isNew ? null : el("button", { class: "icon-btn danger", onclick: () => { deleteWidget(w.id); back.remove(); } }, "Delete"),
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async () => {
      const d = currentDashboard();
      if (isNew) d.widgets.push(w);
      else {
        const idx = d.widgets.findIndex(x => x.id === w.id);
        d.widgets[idx] = w;
      }
      try {
        await saveConfig(state.config);
        toast("Saved", "ok");
        renderDashboard();
        back.remove();
      } catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "Save"),
  ));
  back.append(m);
  document.body.append(back);
}

async function deleteWidget(id) {
  if (!confirm("Delete this widget?")) return;
  const d = currentDashboard();
  if (!d) return;
  d.widgets = d.widgets.filter(w => w.id !== id);
  try {
    await saveConfig(state.config);
    renderDashboard();
  } catch (e) { toast("Delete failed: " + e.message, "err"); }
}

function detectEmailsInRows() {
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const seen = new Map(); // lowercased email -> { email, name }
  const emailCol = state.config?.columns?.email;
  const nameCol  = state.config?.columns?.name;

  // 1. Configured email column — primary source
  if (emailCol) {
    for (const r of state.rows) {
      const e = r[emailCol]; if (!e) continue;
      const s = String(e).trim();
      if (!EMAIL_RE.test(s)) continue;
      const k = s.toLowerCase();
      if (!seen.has(k)) seen.set(k, { email: s, name: nameCol ? (r[nameCol] || "") : "" });
    }
  }
  // 2. Fallback — scan EVERY cell of EVERY row for anything that looks like an email.
  //    Catches cases where the email column was never configured in Settings.
  if (!seen.size) {
    for (const r of state.rows) {
      for (const col of state.columns) {
        const v = r[col]; if (!v) continue;
        const s = String(v).trim();
        if (!EMAIL_RE.test(s)) continue;
        const k = s.toLowerCase();
        if (!seen.has(k)) seen.set(k, { email: s, name: nameCol ? (r[nameCol] || "") : "" });
      }
    }
  }
  return seen;
}

    el("h3", {}, "👤 People"),
    el("div", { class: "modal-sub" }, "Upload a headshot or paste an image URL for each person. Display name overrides the name shown in the leaderboard. Stored in a hidden __plecto_users tab in the sheet so all viewers see the same photos."),
  );

  // Add-person inline form (always available, even if detection fails)
  const addBox = el("div", { style: "background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px" });
  addBox.append(el("div", { style: "font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px" }, "Add a person"));
  const emailIn = el("input", { type: "email", placeholder: "alton@temmeninsurance.com", style: "width:100%;padding:7px 10px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:6px" });
  const nameIn  = el("input", { type: "text",  placeholder: "Display name (optional)",  style: "width:100%;padding:7px 10px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:6px" });
  const addBtn = el("button", { class: "icon-btn primary", style: "padding:7px 14px", onclick: () => {
    const e = (emailIn.value || "").trim().toLowerCase();
    if (!e || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { toast("Enter a valid email address", "err"); return; }
    state.users[e] = state.users[e] || { photoUrl: "", displayName: "" };
    if (nameIn.value.trim()) state.users[e].displayName = nameIn.value.trim();
    emailIn.value = ""; nameIn.value = "";
    refreshList();
    toast("Added — set a headshot below, then click Save", "ok");
  } }, "+ Add");
  addBox.append(emailIn, nameIn, addBtn);
  m.append(addBox);

  const search = el("input", { class: "people-search", type: "text", placeholder: "Search by name or email…" });
  m.append(search);

  const listWrap = el("div", { class: "people-list" });
  m.append(listWrap);

  // detected from data + already-saved profiles
  let people = [];
  function rebuildPeople() {
    const seen = detectEmailsInRows();
    for (const k of Object.keys(state.users)) {
      if (!seen.has(k)) seen.set(k, { email: k, name: state.users[k].displayName || "" });
    }
    people = Array.from(seen.values()).sort((a,b) => (a.name||a.email).localeCompare(b.name||b.email));
  }
  rebuildPeople();

  function makeRow(p) {
    const k = p.email.toLowerCase();
    const profile = state.users[k] || { photoUrl: "", displayName: "" };
    const row = el("div", { class: "people-row" });

    const av = el("div", { class: "pp-avatar" }, initials(profile.displayName || p.name || p.email));
    if (profile.photoUrl) {
      const im = new Image(); im.src = profile.photoUrl;
      im.onload = () => { av.innerHTML = ""; av.append(im); };
    } else if (p.email) {
      gravatar(p.email).then(url => {
        if (!url) return;
        const im = new Image(); im.src = url;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      });
    }

    const meta = el("div", { class: "pp-meta" });
    const nameInput = el("input", { type: "text", value: profile.displayName || p.name || "", placeholder: "Display name" });
    nameInput.addEventListener("input", () => {
      state.users[k] = state.users[k] || { photoUrl: "", displayName: "" };
      state.users[k].displayName = nameInput.value;
    });
    meta.append(nameInput, el("div", { class: "pp-email" }, p.email));

    const actions = el("div", { class: "pp-actions" });

    const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
    fileInput.addEventListener("change", async () => {
      const f = fileInput.files?.[0]; if (!f) return;
      try {
        const dataUrl = await resizeImageToDataUrl(f, 128, 0.82);
        state.users[k] = state.users[k] || { displayName: "" };
        state.users[k].photoUrl = dataUrl;
        // refresh avatar
        const im = new Image(); im.src = dataUrl;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      } catch (e) { toast("Couldn't read image: " + e.message, "err"); }
    });
    const uploadBtn = el("button", { onclick: () => fileInput.click() }, "📤 Upload");
    const urlBtn = el("button", { onclick: () => {
      const url = prompt("Paste an image URL (must allow hotlinking):", profile.photoUrl || "");
      if (url == null) return;
      state.users[k] = state.users[k] || { displayName: "" };
      state.users[k].photoUrl = url.trim();
      if (url.trim()) {
        const im = new Image(); im.src = url.trim();
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      } else {
        av.innerHTML = ""; av.textContent = initials(profile.displayName || p.name || p.email);
      }
    } }, "🔗 URL");
    const clearBtn = el("button", { class: "danger", onclick: () => {
      if (state.users[k]) {
        state.users[k].photoUrl = "";
        av.innerHTML = ""; av.textContent = initials(profile.displayName || p.name || p.email);
        // re-try Gravatar
        gravatar(p.email).then(url => {
          if (!url) return;
          const im = new Image(); im.src = url;
          im.onload = () => { av.innerHTML = ""; av.append(im); };
        });
      }
    } }, "Clear");
    actions.append(uploadBtn, urlBtn, clearBtn, fileInput);

    row.append(av, meta, actions);
    return row;
  }

  function refreshList() {
    rebuildPeople();
    listWrap.innerHTML = "";
    const q = search.value.toLowerCase().trim();
    const filtered = q ? people.filter(p => (p.email + " " + p.name + " " + (state.users[p.email.toLowerCase()]?.displayName || "")).toLowerCase().includes(q)) : people;
    if (!filtered.length) {
      const msg = people.length
        ? "No matches."
        : (state.rows.length
            ? `No emails detected in your sheet's data (scanned ${state.rows.length} rows). Use the "Add a person" box above to add people manually, or check that your Email column is set in Settings → Email column.`
            : "Sheet data hasn't loaded yet. Use the Add a person box above to add people manually.");
      listWrap.append(el("div", { class: "muted", style: "padding:20px;text-align:center;line-height:1.6" }, msg));
      return;
    }
    filtered.forEach(p => listWrap.append(makeRow(p)));
  }
  search.addEventListener("input", refreshList);
  refreshList();

  m.append(el("div", { class: "actions" },
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async () => {
      try {
        await ensureUsersTab(state.sheetId);
        await saveUsers();
        toast("People saved", "ok");
        renderDashboard();
        back.remove();
      } catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "Save"),
  ));

  back.append(m);
  document.body.append(back);
}

function openSettingsModal() {
  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const m = el("div", { class: "modal" });
  m.append(
    el("h3", {}, "Dashboard settings"),
    el("div", { class: "modal-sub" }, "Sheet, data tab, and column mappings."),
  );

  m.append(el("label", {}, "Data tab"));
  const tabSel = el("select");
  state.tabs.filter(t => t.title !== CFG.CONFIG_TAB).forEach(t =>
    tabSel.append(el("option", { value: t.title, selected: state.dataTab === t.title ? "selected" : null }, t.title)));
  m.append(tabSel);

  const cols = state.columns;
  m.append(el("label", {}, "Date column"));
  const dateSel = el("select");
  cols.forEach(c => dateSel.append(el("option", { value: c, selected: state.config.columns.date === c ? "selected" : null }, c)));
  m.append(dateSel);

  m.append(el("label", {}, "Email column"));
  const emailSel = el("select");
  cols.forEach(c => emailSel.append(el("option", { value: c, selected: state.config.columns.email === c ? "selected" : null }, c)));
  m.append(emailSel);

  m.append(el("label", {}, "Name column (optional)"));
  const nameSel = el("select");
  nameSel.append(el("option", { value: "" }, "(none)"));
  cols.forEach(c => nameSel.append(el("option", { value: c, selected: state.config.columns.name === c ? "selected" : null }, c)));
  m.append(nameSel);

  m.append(el("div", { class: "actions" },
    el("button", { class: "icon-btn", onclick: () => { back.remove(); state.sheetId = null; localStorage.removeItem(LS.SHEET_ID); render(); } }, "Switch sheet"),
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async () => {
      const tabChanged = tabSel.value !== state.dataTab;
      state.dataTab = tabSel.value;
      state.config.dataTab = tabSel.value;
      state.config.columns = { date: dateSel.value, email: emailSel.value, name: nameSel.value || null };
      try {
        await saveConfig(state.config);
        if (tabChanged) await loadData(); else renderDashboard();
        toast("Saved", "ok");
        back.remove();
      } catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "Save"),
  ));
  back.append(m);
  document.body.append(back);
}

/* ════════════════════════════════════════════════════════════════════════
   Share link
   ════════════════════════════════════════════════════════════════════════ */
function copyShareLink() {
  if (!state.sheetId) return;
  let url = `${location.origin}${location.pathname}?sheet=${state.sheetId}`;
  if (state.activeDashboardId) url += `&dashboard=${state.activeDashboardId}`;
  navigator.clipboard.writeText(url).then(() => {
    toast("Share link copied — opens this exact dashboard for anyone with Sheet access", "ok");
  }).catch(() => {
    prompt("Copy this URL:", url);
  });
}

/* ════════════════════════════════════════════════════════════════════════
   Theme
   ════════════════════════════════════════════════════════════════════════ */
function currentTheme() { return document.body.getAttribute("data-theme") || "dark"; }
function setTheme(t) {
  document.body.setAttribute("data-theme", t);
  localStorage.setItem(LS.THEME, t);
}
function toggleTheme() {
  setTheme(currentTheme() === "dark" ? "light" : "dark");
  renderDashboard(); // re-render charts so they pick up new colors
  renderTopbar();
}

/* ════════════════════════════════════════════════════════════════════════
   Boot / refresh loop
   ════════════════════════════════════════════════════════════════════════ */
function startAutoRefresh() {
  clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(() => {
    if (tokenValid() && state.sheetId && state.dataTab) loadData();
  }, CFG.REFRESH_MS);
}

async function boot() {
  setTheme(localStorage.getItem(LS.THEME) || "dark");
  state.sidebarCollapsed = localStorage.getItem(LS.SIDEBAR) === "1";

  // ?sheet=<id>&dashboard=<id> URL params
  const params = new URLSearchParams(location.search);
  const urlDashId = params.get("dashboard");
  const urlSheetId = parseSheetId(params.get("sheet") || "");
  const savedSheetId = urlSheetId || localStorage.getItem(LS.SHEET_ID);
  if (urlSheetId) localStorage.setItem(LS.SHEET_ID, urlSheetId);

  // STEP 1 — restore from cache IMMEDIATELY (no network) so the dashboard appears instantly
  // even before sign-in. We only need a token to fetch fresh data, not to show the layout.
  if (savedSheetId) {
    state.sheetId = savedSheetId;
    state.sheetTitle = readCachedSheetTitle(savedSheetId);
    const cached = readCachedConfig(savedSheetId);
    if (cached) {
      state.config = cached;
      state.dataTab = cached.dataTab;
    }
    // active dashboard preference: URL param > localStorage > first
    const stored = localStorage.getItem(LS.ACTIVE_DASH(savedSheetId));
    state.activeDashboardId = urlDashId || stored || null;
  }

  // STEP 2 — if not signed in, show login (cached dashboard will be re-rendered after sign-in)
  if (!loadStoredAuth()) { render(); return; }
  if (!state.user?.email) await fetchUserEmail();

  // Render the cached dashboard NOW so the user sees something while we fetch live data
  render();

  // STEP 3 — sync with the sheet in the background (won't blow away cached state on errors)
  if (savedSheetId) {
    try {
      const meta = await fetchSheetMeta(savedSheetId);
      state.sheetTitle = meta.title;
      state.tabs = meta.tabs;
      writeCachedSheetTitle(savedSheetId, meta.title);
      await ensureConfigTab(savedSheetId);
      const cfg = await loadConfig();
      if (cfg) {
        state.config = cfg;
        state.dataTab = cfg.dataTab;
      }
      // Load user profiles in parallel with data — non-fatal if it fails
      loadUsers().catch(e => console.warn("[plecto] loadUsers:", e.message));
      if (state.dataTab) {
        await loadData();
        startAutoRefresh();
      }
      render();
    } catch (e) {
      console.warn("[plecto] background sync failed:", e.message);
      // 401 → token expired during refresh. Don't sign out / wipe state.
      // Just clear the token so the user can sign in again, KEEPING cached config visible.
      if (String(e.message).includes("401")) {
        state.token = null; state.tokenExp = 0;
        localStorage.removeItem(LS.TOKEN);
        localStorage.removeItem(LS.TOKEN_EXP);
        toast("Session expired — sign in again to refresh data", "err");
        renderTopbar();
      }
    }
  }
}

window.addEventListener("DOMContentLoaded", boot);
// Re-init token client once GIS script has loaded
const gsiPoll = setInterval(() => {
  if (window.google?.accounts?.oauth2) { clearInterval(gsiPoll); initTokenClient(); }
}, 200);
</script>
