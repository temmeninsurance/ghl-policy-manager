<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard Dashboard</title>

<!--
  ╔══════════════════════════════════════════════════════════════════════════════╗
  ║                  PLECTO-STYLE LEADERBOARD DASHBOARD                          ║
  ╠══════════════════════════════════════════════════════════════════════════════╣
  ║                                                                              ║
  ║  ONE-TIME SETUP                                                              ║
  ║                                                                              ║
  ║  1. Create an OAuth 2.0 Client ID in Google Cloud Console:                   ║
  ║       https://console.cloud.google.com/apis/credentials                      ║
  ║       • Application type: Web application                                    ║
  ║       • Authorized JavaScript origins:                                       ║
  ║           https://<your-user>.github.io                                      ║
  ║           http://localhost:8000   (for local testing)                        ║
  ║       • Authorized redirect URIs:    (none needed for token flow)            ║
  ║                                                                              ║
  ║  2. Enable the Google Sheets API for the same project:                       ║
  ║       https://console.cloud.google.com/apis/library/sheets.googleapis.com    ║
  ║                                                                              ║
  ║  3. Paste the Client ID into OAUTH_CLIENT_ID below, commit, push.            ║
  ║                                                                              ║
  ║  4. Open https://<your-user>.github.io/<repo>/leaderboard.html               ║
  ║       • Sign in with Google                                                  ║
  ║       • Paste the Google Sheet URL, pick the data tab                        ║
  ║       • Configure date / email / numeric columns                             ║
  ║       • Add KPI / leaderboard / goal / chart widgets                         ║
  ║                                                                              ║
  ║  Dashboard config is stored in a hidden tab '__plecto_config' inside the     ║
  ║  same Google Sheet, so every viewer sees the same widgets.                   ║
  ║                                                                              ║
  ╚══════════════════════════════════════════════════════════════════════════════╝
-->

<script>
  /* ════════════════════════════════════════════════════════════════════════
     CONFIG — edit this block
     ════════════════════════════════════════════════════════════════════════ */
  window.PLECTO_CONFIG = {
    // Paste your Google OAuth 2.0 Web Client ID here
    OAUTH_CLIENT_ID: "757517778504-p193m141rl19g42qfcppv5jeoh60eump.apps.googleusercontent.com",

    // Scopes — needs read+write because dashboard config is stored in the sheet
    SCOPES: "https://www.googleapis.com/auth/spreadsheets",

    // How often to re-pull sheet data (ms)
    REFRESH_MS: 60_000,

    // How often to do a full page reload — protects against stale JS state,
    // expired tokens, memory leaks, silent code updates. Skipped while a
    // modal / drag / save is in flight.
    PAGE_RELOAD_MS: 5 * 60_000,

    // Tab name used to store dashboard config inside the sheet
    CONFIG_TAB: "__plecto_config",

    // Tab name for per-user headshots / display names
    USERS_TAB: "__plecto_users",
  };
</script>

<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a31;
    --bg-3: #1a2542;
    --card: #131c36;
    --card-2: #182347;
    --border: #243056;
    --text: #e6ecff;
    --text-dim: #93a0c8;
    --text-faint: #5d6a93;
    --accent: #38e1c2;
    --accent-2: #5b8def;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #d97706;
    --danger: #ef4444;
    --success: #22c55e;
    --warn: #f59e0b;
    --shadow: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.35);
    --radius: 14px;
  }
  [data-theme="light"] {
    --bg: #f1f5f9;
    --bg-2: #e2e8f0;
    --bg-3: #cbd5e1;
    --card: #ffffff;
    --card-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-dim: #475569;
    --text-faint: #94a3b8;
    --accent: #0d9488;
    --accent-2: #2563eb;
    --shadow: 0 1px 0 rgba(0,0,0,.02), 0 8px 24px rgba(15,23,42,.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  /* ─── Top bar ──────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .brand {
    font-weight: 700; font-size: 15px; letter-spacing: .2px;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
  }
  .topbar .spacer { flex: 1; }
  .topbar .meta { color: var(--text-dim); font-size: 12px; }
  .topbar .meta b { color: var(--text); font-weight: 600; }
  .icon-btn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.primary {
    background: var(--accent); color: #001b15; border-color: var(--accent);
    font-weight: 600;
  }
  .icon-btn.primary:hover { filter: brightness(1.1); }
  .icon-btn.danger { color: var(--danger); border-color: rgba(239,68,68,.4); }

  /* ─── Filter bar ──────────────────────────────────────────── */
  .filterbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid transparent; cursor: pointer; user-select: none;
    transition: color .15s, background .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: rgba(56,225,194,.12); color: var(--accent);
    border-color: rgba(56,225,194,.3);
  }
  .filterbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .filterbar input[type="date"] {
    background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 12px;
  }

  /* ─── Dashboard grid ──────────────────────────────────────── */
  .stage { padding: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 72px;          /* base row height; widgets span N rows */
    grid-auto-flow: dense;          /* unplaced widgets backfill gaps */
    gap: 14px;
  }
  .widget {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    cursor: grab;
  }
  .widget:active { cursor: grabbing; }
  .widget.dragging {
    opacity: .35; cursor: grabbing;
    transform: scale(.98); transition: transform .12s, opacity .12s;
  }
  .drop-preview {
    background: rgba(56,225,194,.10);
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    pointer-events: none;
    transition: grid-row .08s, grid-column .08s;
  }
  .widget button, .widget input, .widget select, .widget a { cursor: pointer; }
  .widget .resize-handle { cursor: nwse-resize; }
  .widget.resizing {
    outline: 2px dashed var(--accent); outline-offset: -2px;
    z-index: 10;
  }
  .widget .w-actions {
    position: absolute; top: 8px; right: 8px;
    display: none; gap: 4px; z-index: 2;
  }
  .widget:hover .w-actions { display: flex; }
  .w-actions button {
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .w-actions button:hover { color: var(--text); }
  .w-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .8px; font-weight: 600; margin-bottom: 10px;
    flex-shrink: 0;
  }
  .w-body {
    flex: 1; min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
  }
  /* Resize handle in bottom-right corner */
  .resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 22px; height: 22px;
    cursor: nwse-resize; opacity: 0;
    transition: opacity .15s; z-index: 3;
  }
  .widget:hover .resize-handle { opacity: 1; }
  .resize-handle::before {
    content: ''; position: absolute; bottom: 4px; right: 4px;
    width: 10px; height: 10px;
    border-right: 2px solid var(--text-faint);
    border-bottom: 2px solid var(--text-faint);
  }
  .resize-handle:hover::before { border-color: var(--accent); }
  .resize-handle::after {
    content: ''; position: absolute; bottom: 7px; right: 7px;
    width: 4px; height: 4px;
    border-right: 2px solid var(--text-faint);
    border-bottom: 2px solid var(--text-faint);
  }
  .resize-handle:hover::after { border-color: var(--accent); }
  /* live size preview while resizing */
  .resize-preview {
    position: fixed; pointer-events: none; z-index: 200;
    background: var(--accent); color: #001b15;
    font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  @media (max-width: 700px) {
    /* Phones — every widget full-width, auto-height so tall configs don't cram */
    .stage { padding: 10px; }
    .grid { grid-auto-rows: auto; gap: 10px; }
    .widget {
      grid-column: 1 / -1 !important;
      grid-row: auto !important;
      min-height: 180px;
    }
    .widget.kind-leaderboard { min-height: 320px; }
  }

  /* KPI tile */
  .kpi-value { font-size: 44px; font-weight: 700; letter-spacing: -.5px; line-height: 1.05; }
  .kpi-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  /* Center & auto-scale content for KPI / pacing / goal tiles so they
     look right at any widget size. Container query units (cqh/cqw) let
     the value font scale with the widget bounds. */
  .widget.kind-kpi    .w-body,
  .widget.kind-pacing .w-body,
  .widget.kind-goal   .w-body {
    align-items: center;
    justify-content: center;
    text-align: center;
    container-type: size;
  }
  .widget.kind-kpi    .kpi-value,
  .widget.kind-pacing .kpi-value {
    font-size: clamp(28px, min(28cqh, 16cqw), 130px);
    width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .widget.kind-kpi    .kpi-sub,
  .widget.kind-pacing .kpi-sub {
    font-size: clamp(11px, min(5cqh, 2.4cqw), 18px);
    margin-top: 6px;
  }
  .widget.kind-goal .goal-meta { width: 100%; }
  .widget.kind-goal .goal-bar  { width: 100%; }
  .widget.kind-goal .goal-pct  { font-size: clamp(16px, min(8cqh, 5cqw), 36px); }
  /* in pacing tiles the goal-bar shows up only when target is set —
     stretch it across the full width */
  .widget.kind-pacing .goal-meta,
  .widget.kind-pacing .goal-bar { width: 100%; }

  /* Threshold-tinted widgets (value-vs-target coloring) */
  .widget.tier-green  { background: #16a34a; border-color: #15803d; }
  .widget.tier-yellow { background: #f59e0b; border-color: #d97706; }
  .widget.tier-red    { background: #dc2626; border-color: #b91c1c; }
  .widget.tier-green, .widget.tier-yellow, .widget.tier-red { color: #0a0a0a; }
  .widget.tier-green  .w-title,
  .widget.tier-yellow .w-title,
  .widget.tier-red    .w-title { color: rgba(0,0,0,.7); }
  .widget.tier-green  .kpi-value,
  .widget.tier-yellow .kpi-value,
  .widget.tier-red    .kpi-value { color: #0a0a0a; }
  .widget.tier-green  .kpi-sub,
  .widget.tier-yellow .kpi-sub,
  .widget.tier-red    .kpi-sub { color: rgba(0,0,0,.65); }
  .widget.tier-green  .goal-bar,
  .widget.tier-yellow .goal-bar,
  .widget.tier-red    .goal-bar { background: rgba(0,0,0,.18); }
  .widget.tier-green  .goal-bar > div,
  .widget.tier-yellow .goal-bar > div,
  .widget.tier-red    .goal-bar > div { background: rgba(0,0,0,.7); }
  .widget.tier-green  .goal-meta,
  .widget.tier-yellow .goal-meta,
  .widget.tier-red    .goal-meta { color: rgba(0,0,0,.65); }
  .widget.tier-green  .goal-meta .goal-pct,
  .widget.tier-yellow .goal-meta .goal-pct,
  .widget.tier-red    .goal-meta .goal-pct { color: #0a0a0a; }
  .widget.tier-green  .w-actions button,
  .widget.tier-yellow .w-actions button,
  .widget.tier-red    .w-actions button { background: rgba(0,0,0,.15); color: rgba(0,0,0,.8); border-color: rgba(0,0,0,.2); }
  .kpi-delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
  .kpi-delta.up { color: var(--success); }
  .kpi-delta.down { color: var(--danger); }

  /* Goal */
  .goal-bar {
    height: 14px; background: var(--bg-3); border-radius: 999px;
    overflow: hidden; margin: 14px 0 8px;
  }
  .goal-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .6s ease;
  }
  .goal-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-dim);
  }
  .goal-meta .goal-pct { color: var(--text); font-weight: 700; font-size: 16px; }

  /* Leaderboard */
  .w-body > div:not(.chart-wrap) { overflow-y: auto; }
  .lb-row {
    display: grid;
    grid-template-columns: 44px 44px 1fr auto;
    align-items: center; gap: 13px;
    padding: 13px 8px; border-bottom: 1px solid var(--border);
    transition: background .2s;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row:hover { background: var(--card-2); }
  .lb-rank {
    font-size: 20px; font-weight: 700; color: var(--text-dim);
    text-align: center;
  }
  .lb-row.r1 .lb-rank { color: var(--gold); }
  .lb-row.r2 .lb-rank { color: var(--silver); }
  .lb-row.r3 .lb-rank { color: var(--bronze); }
  .lb-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-3); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; overflow: hidden;
    border: 2px solid transparent;
  }
  .lb-row.r1 .lb-avatar { border-color: var(--gold); }
  .lb-row.r2 .lb-avatar { border-color: var(--silver); }
  .lb-row.r3 .lb-avatar { border-color: var(--bronze); }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-name { font-weight: 600; font-size: 18px; }
  .lb-value { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }

  /* Chart */
  .chart-wrap { position: relative; flex: 1; min-height: 120px; }

  /* ─── Empty / login screens ───────────────────────────────── */
  .center-screen {
    min-height: calc(100vh - 64px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; max-width: 480px; width: 100%;
    box-shadow: var(--shadow);
  }
  .panel h2 { margin: 0 0 6px; font-size: 20px; }
  .panel p { color: var(--text-dim); margin: 0 0 18px; }
  .panel label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; }
  .panel input, .panel select {
    width: 100%; padding: 10px 12px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .panel .row { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

  /* ─── Modal ───────────────────────────────────────────────── */
  .modal-back {
    position: fixed; inset: 0; background: rgba(2,6,23,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
    width: 100%; max-width: 640px; max-height: 88vh; overflow: auto;
    box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal .modal-sub { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; font-weight: 600; }
  .modal input, .modal select {
    width: 100%; padding: 9px 11px;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
  }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .filter-row {
    display: grid; grid-template-columns: 80px 1fr 1fr 1fr 32px;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .filter-row .combinator-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: var(--text-faint); text-transform: uppercase;
  }
  .filter-row .combinator-cell select {
    width: 100%; padding: 6px 4px; text-align: center;
    background: var(--bg-3); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; font-weight: 700;
  }
  /* Searchable value combobox inside filter rows */
  .value-combo { position: relative; }
  .value-combo input { width: 100%; }
  .value-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; max-height: 240px; overflow-y: auto;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .vd-item {
    padding: 7px 11px; font-size: 12px; cursor: pointer;
    color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .vd-item:hover, .vd-item.active {
    background: rgba(56,225,194,.12); color: var(--accent);
  }
  .vd-item .vd-hint {
    color: var(--text-faint); font-size: 10px; margin-left: 6px;
  }
  .vd-empty { padding: 10px 11px; font-size: 12px; color: var(--text-faint); }
  .filter-row button {
    background: transparent; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; height: 36px;
  }
  .filter-row button:hover { color: var(--danger); border-color: var(--danger); }
  .add-filter-btn {
    background: transparent; color: var(--accent); border: 1px dashed var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    margin-top: 6px;
  }
  .add-filter-btn:hover { border-color: var(--accent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; z-index: 200;
    box-shadow: var(--shadow);
    animation: toast-in .2s ease;
  }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok  { border-color: var(--success); }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty h3 { color: var(--text); margin: 0 0 6px; }

  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* App shell with sidebar */
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-body { flex: 1; display: flex; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .main .stage { flex: 1; overflow: auto; padding: 16px; }

  .sidebar {
    width: 230px; flex-shrink: 0;
    background: var(--bg-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar-hdr {
    padding: 14px 14px 8px;
    font-size: 11px; font-weight: 700; color: var(--text-faint);
    letter-spacing: .8px; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-hdr .toggle-btn {
    background: transparent; color: var(--text-faint); border: none;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .sidebar-hdr .toggle-btn:hover { color: var(--text); background: var(--bg-3); }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px; }
  .sb-item {
    padding: 9px 10px; margin: 2px 4px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; color: var(--text-dim);
    font-size: 13px; transition: background .15s, color .15s;
    user-select: none;
  }
  .sb-item:hover { background: var(--card-2); color: var(--text); }

  }

  .sidebar.collapsed { width: 48px; }

  .sidebar.collapsed .sb-item { justify-content: center; padding: 9px 4px; }

  /* Sidebar becomes a slide-in drawer on phones */
  .hamburger { display: none; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 768px) {
    .hamburger {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: 18px; cursor: pointer;
      line-height: 1;

      position: fixed; left: 0; top: 0; bottom: 0;
      width: 260px; max-width: 82vw; z-index: 200;
      transform: translateX(-105%);
      transition: transform .22s ease;
      box-shadow: 6px 0 32px rgba(0,0,0,.55);
    }

    .sidebar.collapsed { width: 260px; }   /* ignore desktop collapse on mobile */

      display: block; position: fixed; inset: 0; z-index: 190;
      background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }
    .app-body { flex-direction: column; }
    /* Topbar: tighter padding, allow wrap, hide secondary text */
    .topbar { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
    .topbar .meta { display: none; }
    .topbar .icon-btn { padding: 6px 9px; font-size: 11px; min-height: 34px; }
    .topbar .save-btn { padding: 6px 10px; font-size: 11px; min-height: 34px; }
    /* Filter bar: horizontal scroll instead of wrap so it stays one line */
    .filterbar {
      padding: 8px 10px; gap: 6px;
      overflow-x: auto; flex-wrap: nowrap;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .filterbar::-webkit-scrollbar { display: none; }
    .filterbar .chip { flex-shrink: 0; }

    .modal-back { padding: 0; }

/* ════════════════════════════════════════════════════════════════════════
   Auth (Google Identity Services)
   ════════════════════════════════════════════════════════════════════════ */
function initTokenClient() {
  if (state.tokenClient) return;
  if (!window.google?.accounts?.oauth2) return;
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.OAUTH_CLIENT_ID,
    scope: CFG.SCOPES,
    callback: (resp) => {
      if (resp.error) {
        toast("Sign-in failed: " + resp.error, "err");
        return;
      }
      state.token = resp.access_token;
      state.tokenExp = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem(LS.TOKEN, state.token);
      localStorage.setItem(LS.TOKEN_EXP, String(state.tokenExp));
      // try to get email via userinfo
      fetchUserEmail().then(() => boot());
    },
  });
}
async function fetchUserEmail() {
  try {
    const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + state.token }
    });
    if (r.ok) {
      const d = await r.json();
      state.user = { email: d.email };
      localStorage.setItem(LS.USER, d.email || "");
    }
  } catch {}
}
function signIn() {
  if (CFG.OAUTH_CLIENT_ID.startsWith("PASTE_")) {
    toast("Set OAUTH_CLIENT_ID in the CONFIG block first", "err");
    return;
  }
  initTokenClient();
  if (!state.tokenClient) {
    toast("Google Identity script not loaded yet — try again in a second", "err");
    return;
  }
  state.tokenClient.requestAccessToken({ prompt: "select_account" });
}
function switchAccount() {
  // sign out locally then re-prompt with account chooser
  state.token = null; state.tokenExp = 0; state.user = null;
  localStorage.removeItem(LS.TOKEN);
  localStorage.removeItem(LS.TOKEN_EXP);
  localStorage.removeItem(LS.USER);
  signIn();
}
function signOut() {
  if (state.token && window.google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(state.token, () => {});
  }
  state.token = null; state.tokenExp = 0; state.user = null;
  localStorage.removeItem(LS.TOKEN);
  localStorage.removeItem(LS.TOKEN_EXP);
  localStorage.removeItem(LS.USER);
  clearInterval(state.refreshTimer);
  render();
}
function tokenValid() {
  return state.token && Date.now() < state.tokenExp;
}
function loadStoredAuth() {
  const tok = localStorage.getItem(LS.TOKEN);
  const exp = parseInt(localStorage.getItem(LS.TOKEN_EXP) || "0", 10);
  if (tok && Date.now() < exp) {
    state.token = tok;
    state.tokenExp = exp;
    state.user = { email: localStorage.getItem(LS.USER) || "" };
    return true;
  }
  return false;
}

/* Silent re-auth via GIS `prompt: "none"`. Succeeds if the user's Google
   session is still active AND they previously granted this app access.
   Used to survive the 5-minute page reload past the 1-hour access-token
   expiry without kicking the user back to the sign-in screen. */
async function attemptSilentAuth() {
  const gisReady = await new Promise(res => {
    if (window.google?.accounts?.oauth2) return res(true);
    const start = Date.now();
    const iv = setInterval(() => {
      if (window.google?.accounts?.oauth2) { clearInterval(iv); res(true); }
      else if (Date.now() - start > 4000)  { clearInterval(iv); res(false); }
    }, 80);
  });
  if (!gisReady || CFG.OAUTH_CLIENT_ID.startsWith("PASTE_")) return false;
  return new Promise(resolve => {
    let done = false;
    const finish = ok => { if (done) return; done = true; resolve(ok); };
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CFG.OAUTH_CLIENT_ID,
      scope: CFG.SCOPES,
      callback: resp => {
        if (resp.error || !resp.access_token) { console.warn("[plecto] silent auth:", resp.error); return finish(false); }
        state.token = resp.access_token;
        state.tokenExp = Date.now() + (resp.expires_in - 60) * 1000;
        localStorage.setItem(LS.TOKEN, state.token);
        localStorage.setItem(LS.TOKEN_EXP, String(state.tokenExp));
        console.log("[plecto] silent auth succeeded");
        finish(true);
      },
      error_callback: err => { console.warn("[plecto] silent auth error:", err?.type || err); finish(false); },
    });
    state.tokenClient = client;   // reuse for signIn / signOut / switchAccount
    try { client.requestAccessToken({ prompt: "none" }); }
    catch (e) { console.warn("[plecto] silent auth threw:", e); finish(false); }
    setTimeout(() => finish(false), 6000); // safety timeout
  });
}

/* ════════════════════════════════════════════════════════════════════════
   Sheets API
   ════════════════════════════════════════════════════════════════════════ */
async function api(path, opts={}) {
  if (!tokenValid()) {
    toast("Session expired — sign in again", "err");
    signOut();
    throw new Error("token expired");
  }
  const r = await fetch(SHEETS_API + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + state.token,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Sheets API ${r.status}: ${txt.slice(0, 200)}`);
  }
  return r.status === 204 ? null : r.json();
}
function parseSheetId(input) {
  if (!input) return null;
  const s = input.trim();
  const m = s.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}
async function fetchSheetMeta(id) {
  const meta = await api(`/${id}?fields=properties(title),sheets(properties(sheetId,title,index))`);
  return {
    title: meta.properties.title,
    tabs: meta.sheets.map(s => ({
      title: s.properties.title,
      sheetId: s.properties.sheetId,
      index: s.properties.index,
    })).sort((a,b) => a.index - b.index),
  };
}
async function fetchTabValues(sheetId, tabName) {
  const range = `'${tabName.replace(/'/g, "''")}'`;
  const data = await api(`/${sheetId}/values/${encodeURIComponent(range)}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  return data.values || [];
}
/* Atomic "replace tab contents" via batchUpdate.
   The clear and the new-write are queued in a single request, so a
   network failure can't leave the tab cleared but un-rewritten (the
   data-loss scenario from a separate clear-then-PUT pair). */
async function writeTabValues(sheetId, tabName, values) {
  const tabMeta = state.tabs.find(t => t.title === tabName);
  if (!tabMeta || tabMeta.sheetId == null) {
    throw new Error(`Tab "${tabName}" not found — call ensureConfigTab first`);
  }
  const tabSheetId = tabMeta.sheetId;
  const rowsForUpdate = values.map(row => ({
    values: row.map(v => ({
      userEnteredValue: (v === null || v === undefined || v === "")
        ? { stringValue: "" }
        : (typeof v === "number" && isFinite(v))
          ? { numberValue: v }
          : { stringValue: String(v) }
    }))
  }));
  await api(`/${sheetId}:batchUpdate`, {
    method: "POST",
    body: JSON.stringify({
      requests: [
        // 1. Clear all existing cell values in this tab
        { updateCells: { range: { sheetId: tabSheetId }, fields: "userEnteredValue" } },
        // 2. Write the new content starting at A1
        { updateCells: {
            start: { sheetId: tabSheetId, rowIndex: 0, columnIndex: 0 },
            rows: rowsForUpdate,
            fields: "userEnteredValue",
        }},
      ],
    }),
  });
}
async function ensureConfigTab(sheetId) {
  const has = state.tabs.some(t => t.title === CFG.CONFIG_TAB);
  if (has) return;
  try {
    await api(`/${sheetId}:batchUpdate`, {
      method: "POST",
      body: JSON.stringify({
        requests: [{
          addSheet: {
            properties: {
              title: CFG.CONFIG_TAB,
              hidden: true,
              gridProperties: { rowCount: 200, columnCount: 4 },
            },
          },
        }],
      }),
    });
    const meta = await fetchSheetMeta(sheetId);
    state.tabs = meta.tabs;
  } catch (e) {
    // 403 → user has view-only access; continue, they'll just see existing dashboard
    if (String(e.message).includes("403")) { state.readOnly = true; return; }
    throw e;
  }
}

/* Resize a File (image) to a square JPEG data URL of the given pixel size.
   At 96px / quality 0.82 a typical face photo becomes ~5KB base64 — small
   enough to fit comfortably in a single Sheets cell. */
function resizeImageToDataUrl(file, size = 128, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const min = Math.min(img.width, img.height);
      const sx = (img.width  - min) / 2;
      const sy = (img.height - min) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image file")); };
    img.src = url;
  });
}

   ════════════════════════════════════════════════════════════════════════ */
async function loadData() {
  if (!state.sheetId || !state.dataTab) return;
  state.loading = true;
  renderTopbar();
  try {
    _uniqueValuesCache = null;             // any tab refresh invalidates the suggestion cache
    // Always load the dashboard default tab first
    await ensureTabLoaded(state.dataTab, true);
    // Then any tab referenced by widgets in any dashboard (so switching views is instant)
    const referenced = new Set();
    for (const d of (state.config?.dashboards || [])) {
      for (const w of (d.widgets || [])) {
        if (w.dataTab && w.dataTab !== state.dataTab) referenced.add(w.dataTab);
      }
    }
    if (referenced.size) {
      await Promise.all(Array.from(referenced).map(t => ensureTabLoaded(t, true).catch(() => null)));
    }
    state.lastFetched = new Date();
  } catch (e) {
    toast("Failed to load sheet: " + e.message, "err");
  } finally {
    state.loading = false;
    renderTopbar();
    renderDashboard();
  }
}

/* ════════════════════════════════════════════════════════════════════════
   Per-tab data loading. Each widget can pull from any tab in the sheet;
   data and column inference is cached in state.tabsData[tabName].
   ════════════════════════════════════════════════════════════════════════ */
function autoDetectColumns(columns) {
  const guess = re => columns.find(c => re.test(c));
  return {
    dateCol:  guess(/^date$|created|timestamp|^time$/i) || guess(/date|time/i) || null,
    emailCol: guess(/email|mail/i) || null,
    nameCol:  guess(/^name$|agent|rep|owner|user/i) || null,

async function ensureTabLoaded(tabName, force = false) {
  if (!tabName) return null;

  try {
    const values = await fetchTabValues(state.sheetId, tabName);
    const columns = (values[0] || []).map(c => String(c ?? "").trim());
    const rows = values.slice(1).map(r => {
      const obj = {};
      for (let i = 0; i < columns.length; i++) obj[columns[i]] = r[i];
      return obj;
    });
    const auto = autoDetectColumns(columns);
    // For the dashboard's default tab, the explicitly-configured columns win
    const isDefault = tabName === state.dataTab;
    const dateCol  = isDefault ? (state.config?.columns?.date  || auto.dateCol)  : auto.dateCol;
    const emailCol = isDefault ? (state.config?.columns?.email || auto.emailCol) : auto.emailCol;
    const nameCol  = isDefault ? (state.config?.columns?.name  || auto.nameCol)  : auto.nameCol;
    state.tabsData[tabName] = { columns, rows, dateCol, emailCol, nameCol, lastFetched: new Date() };
    if (isDefault) {                       // back-compat aliases

      state.rawValues = values;

  const tab = tabName || state.dataTab;
  if (!_uniqueValuesCache) _uniqueValuesCache = new Map();
  const cacheKey = tab + "\x00" + col;
  if (_uniqueValuesCache.has(cacheKey)) return _uniqueValuesCache.get(cacheKey);
  const td = state.tabsData[tab];
  const rows = td?.rows || (tab === state.dataTab ? state.rows : []);
  const set = new Set();
  for (const r of rows) {
    const v = r[col];
    if (v == null || v === "") continue;
    set.add(String(v).trim());
  }
  const arr = Array.from(set).filter(Boolean).sort((a, b) =>
    a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));
  _uniqueValuesCache.set(cacheKey, arr);
  return arr;

/* Convert a sheet cell to a JS Date that represents the same wall-clock day
   in the user's local timezone. Sheets stores dates as serial numbers
   (days since 1899-12-30) and they should be interpreted as local time —
   not UTC — otherwise a sale on May 1 CDT looks like Apr 30 in UTC and
   falls out of MTD/Today filters. */
function toDate(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return v;
  if (typeof v === "number") {
    const dayPart = Math.floor(v);
    const timePart = v - dayPart;
    // Build the calendar date at UTC midnight, then re-anchor to the SAME
    // Y/M/D at LOCAL midnight so the date isn't shifted by the user's TZ.
    const utcMs = (dayPart - 25569) * 86400000;
    const u = new Date(utcMs);
    const d = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
    if (timePart > 0) {
      const dayMs = Math.round(timePart * 86400000);
      d.setHours(0, 0, 0, 0);
      d.setTime(d.getTime() + dayMs);
    }
    return isNaN(d) ? null : d;
  }
  if (typeof v === "string") {
    const s = v.trim();
    // Bare ISO date like "2026-05-01" — force local midnight, not UTC
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
      const [y, m, day] = s.split("-").map(Number);
      return new Date(y, m - 1, day);
    }
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  return null;
}
function toNumber(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return v;
  const cleaned = String(v).replace(/[$,\s]/g, "").replace(/[()]/g, "");
  const neg = String(v).includes("(");
  const n = parseFloat(cleaned);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

/* ════════════════════════════════════════════════════════════════════════
   Time-period filtering
   ════════════════════════════════════════════════════════════════════════ */
const TIME_LABELS = {
  TODAY: "Today", YESTERDAY: "Yesterday", WEEK: "This Week", LAST_WEEK: "Last Week",
  MTD: "MTD", QTD: "QTD", YTD: "YTD", ALL: "All Time", CUSTOM: "Custom",
};
function timeFilterLabel(kind) { return TIME_LABELS[kind] || kind; }

function timeRange(kind, custom) {
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);
  const today = startOfDay(now);
  switch (kind) {
    case "TODAY":     return [today, endOfDay(now)];
    case "YESTERDAY": { const y = new Date(today); y.setDate(y.getDate()-1); return [y, endOfDay(y)]; }
    case "WEEK": {
      const s = new Date(today); s.setDate(s.getDate() - 6);
      return [s, endOfDay(now)];
    }
    case "LAST_WEEK": {
      const s = new Date(today); s.setDate(s.getDate() - 13);
      const e = new Date(today); e.setDate(e.getDate() - 7);
      return [s, endOfDay(e)];
    }
    case "MTD":  return [new Date(now.getFullYear(), now.getMonth(), 1), endOfDay(now)];
    case "QTD": {
      const q = Math.floor(now.getMonth()/3)*3;
      return [new Date(now.getFullYear(), q, 1), endOfDay(now)];
    }
    case "YTD":  return [new Date(now.getFullYear(), 0, 1), endOfDay(now)];
    case "ALL":  return [new Date(0), endOfDay(now)];
    case "CUSTOM": {
      const s = custom?.start ? new Date(custom.start) : new Date(0);
      const e = custom?.end   ? endOfDay(new Date(custom.end)) : endOfDay(now);
      return [s, e];
    }
    default: return [new Date(0), endOfDay(now)];
  }
}

/* ════════════════════════════════════════════════════════════════════════
   Formula engine
   ────────────────────────────────────────────────────────────────────────
   filterRow:    operators on a single column
   aggregateRows: SUM | COUNT | COUNT_DISTINCT | AVG | MIN | MAX
   evalWidget:   applies time filter + widget filters + groupBy as needed
   ════════════════════════════════════════════════════════════════════════ */
const OPERATORS = ["equals","not_equals","contains","not_contains","gt","lt","gte","lte","between","is_empty","not_empty"];

function applyFilter(value, op, target, target2) {
  switch (op) {
    case "equals":       return String(value ?? "") === String(target ?? "");
    case "not_equals":   return String(value ?? "") !== String(target ?? "");
    case "contains":     return String(value ?? "").toLowerCase().includes(String(target ?? "").toLowerCase());
    case "not_contains": return !String(value ?? "").toLowerCase().includes(String(target ?? "").toLowerCase());
    case "gt":           return toNumber(value) >  toNumber(target);
    case "lt":           return toNumber(value) <  toNumber(target);
    case "gte":          return toNumber(value) >= toNumber(target);
    case "lte":          return toNumber(value) <= toNumber(target);
    case "between": {
      const n = toNumber(value);
      return n != null && n >= toNumber(target) && n <= toNumber(target2);
    }
    case "is_empty":     return value == null || String(value).trim() === "";
    case "not_empty":    return value != null && String(value).trim() !== "";
    default: return true;
  }
}
/* Evaluate filters with AND/OR. Each filter (except the first) has a
   combinator: "AND" | "OR". AND binds tighter than OR (standard logic).
     A AND B OR C AND D  =>  (A AND B) OR (C AND D)
     A OR B              =>  A OR B
     A AND B AND C       =>  all required
   First filter's combinator is ignored. Filters with no `combinator`
   field default to AND (back-compat with the old all-must-match shape). */
function rowMatchesFilters(row, filters) {
  if (!filters || !filters.length) return true;
  const groups = [[filters[0]]];
  for (let i = 1; i < filters.length; i++) {
    const f = filters[i];
    if ((f.combinator || "AND") === "OR") groups.push([f]);
    else groups[groups.length - 1].push(f);
  }
  return groups.some(g => g.every(f => applyFilter(row[f.column], f.op, f.value, f.value2)));
}
// keep old name as alias so existing call sites don't break
const rowMatchesAll = rowMatchesFilters;
function rowsInTimeRange(rows, dateCol, range) {
  if (!dateCol) return rows;
  const [start, end] = range;
  return rows.filter(r => {
    const d = toDate(r[dateCol]);
    return d && d >= start && d <= end;
  });
}
/* ════════════════════════════════════════════════════════════════════════
   Business-day helpers + pacing math
   ════════════════════════════════════════════════════════════════════════ */
function isBusinessDay(d) {
  const day = d.getDay();        // 0 = Sunday, 6 = Saturday
  return day !== 0 && day !== 6;
}
function businessDaysBetween(start, end) {
  if (end < start) return 0;
  let count = 0;
  const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const stop = new Date(end.getFullYear(),  end.getMonth(),  end.getDate());
  while (cur <= stop) {
    if (isBusinessDay(cur)) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}
function pacingPeriodRange(period, today) {
  switch (period) {
    case "WTD": {
      const day = today.getDay();
      const offset = day === 0 ? 6 : day - 1; // week starts Monday
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - offset);
      const end   = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 23, 59, 59, 999);
      return [start, end];
    }
    case "QTD": {
      const q = Math.floor(today.getMonth() / 3) * 3;
      return [new Date(today.getFullYear(), q, 1), new Date(today.getFullYear(), q + 3, 0, 23, 59, 59, 999)];
    }
    case "YTD":
      return [new Date(today.getFullYear(), 0, 1), new Date(today.getFullYear(), 11, 31, 23, 59, 59, 999)];
    case "MTD":
    default:
      return [new Date(today.getFullYear(), today.getMonth(), 1),
              new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59, 999)];
  }
}
function pacingMetrics(w, today = new Date()) {
  const [periodStart, periodEnd] = pacingPeriodRange(w.period || "MTD", today);
  const elapsedEnd = today < periodEnd ? today : periodEnd;
  const businessOnly = w.businessDaysOnly !== false; // default true
  const totalDays   = businessOnly ? businessDaysBetween(periodStart, periodEnd)   : Math.round((periodEnd   - periodStart) / 86400000) + 1;
  const elapsedDays = businessOnly ? businessDaysBetween(periodStart, elapsedEnd)  : Math.round((elapsedEnd  - periodStart) / 86400000) + 1;
  return { periodStart, periodEnd, elapsedEnd, totalDays, elapsedDays, businessOnly };
}

function aggregate(rows, agg, column) {
  if (agg === "COUNT") return rows.length;
  if (agg === "COUNT_DISTINCT") {
    const s = new Set();
    rows.forEach(r => { const v = r[column]; if (v != null && v !== "") s.add(String(v)); });
    return s.size;
  }
  const nums = rows.map(r => toNumber(r[column])).filter(v => v != null);
  if (!nums.length) return 0;
  switch (agg) {
    case "SUM": return nums.reduce((a,b) => a+b, 0);
    case "AVG": return nums.reduce((a,b) => a+b, 0) / nums.length;
    case "MIN": return Math.min(...nums);
    case "MAX": return Math.max(...nums);
    default:    return 0;
  }
}

function render() {
  const app = $("#app");
  app.innerHTML = "";

  if (!tokenValid()) {
    app.append(renderLogin());
    return;
  }
  const shell = el("div", { class: "app-shell" });
  app.append(shell);

  if (!state.sheetId) {
    shell.append(renderTopbar(), renderSheetPicker());
    return;
  }
  if (!state.dataTab || !state.config) {
    shell.append(renderTopbar(), renderDataTabPicker());
    return;
  }

  // ensure activeDashboardId is set (per-user)
  if (!state.activeDashboardId) {
    const stored = localStorage.getItem(LS.ACTIVE_DASH(state.sheetId));
    state.activeDashboardId = (stored && state.config.dashboards.some(d => d.id === stored))
      ? stored : state.config.dashboards[0].id;
  } else if (!state.config.dashboards.some(d => d.id === state.activeDashboardId)) {
    state.activeDashboardId = state.config.dashboards[0].id;
  }

  if (state.tvMode) shell.classList.add("tv-mode");
  shell.append(renderTopbar());
  const body = el("div", { class: "app-body" });
  body.append(renderSidebar());
  // Mobile drawer backdrop — tap to close
  const backdrop = el("div", {
    class: "sidebar-backdrop" + (state.mobileSidebarOpen ? " show" : ""),
    onclick: () => { state.mobileSidebarOpen = false; render(); },
  });
  body.append(backdrop);
  const main = el("div", { class: "main" });
  main.append(renderFilterbar());
  const stage = el("div", { class: "stage", id: "stage" });
  main.append(stage);
  body.append(main);
  shell.append(body);

  renderDashboard();
  if (state.tvMode) requestAnimationFrame(fitTvGrid);
}

  }

  );
  if (state.sheetTitle) {

    else if (state.saveState === "saved") saveLabel = ` · <span style="color:var(--success)">✓ saved</span>`;

      saveLabel;

  }
  if (state.config) {

      bar.append(el("span", { class: "chip", style: "background:rgba(245,158,11,.15);color:var(--warn);border-color:rgba(245,158,11,.3)" }, "View only"));
    } else {

      bar.append(el("button", { class: "icon-btn", onclick: openPeopleModal }, "👤 People"));
      bar.append(el("button", { class: "icon-btn", onclick: openSettingsModal }, "⚙ Settings"));
    }
    bar.append(el("button", { class: "icon-btn", onclick: copyShareLink, title: "Copy a link other users can open to see this exact dashboard" }, "🔗 Share"));

  if (state.tvMode) {
    bar.append(el("span", { class: "tv-clock" }, new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })));
  }
  bar.append(
    el("button", {
      class: "icon-btn",
      onclick: openCastModal,
      title: "Cast this dashboard to an LG TV",
    }, "📡 Cast"),
    el("button", {
      class: "icon-btn" + (state.tvMode ? " primary" : ""),
      onclick: toggleTvMode,
      title: state.tvMode ? "Exit TV mode (Esc)" : "TV mode — fullscreen dashboard for the sales floor",
    }, state.tvMode ? "✕ Exit TV" : "📺 TV"),
    el("button", { class: "icon-btn", onclick: toggleTheme, title: "Toggle theme" }, currentTheme() === "dark" ? "☀" : "☾"),
    el("button", { class: "icon-btn", onclick: () => loadData(), title: "Refresh" }, "↻"),
    el("button", { class: "icon-btn danger", onclick: signOut }, "Sign out"),
  );
  // attach at top of the app shell (or fallback to #app)
  const shell = $(".app-shell");
  if (shell) shell.prepend(bar);
  else $("#app").prepend(bar);
  return bar;
}

function renderSheetPicker() {
  const cs = el("div", { class: "center-screen" });
  const p = el("div", { class: "panel" });
  p.append(
    el("h2", {}, "Connect a Google Sheet"),
    el("p", {}, "Paste the URL of the Google Sheet you want to read. The dashboard will read data from a tab you select, and store its config in a hidden tab in the same sheet."),
    el("label", {}, "Google Sheet URL or ID"),
  );
  const input = el("input", { type: "text", placeholder: "https://docs.google.com/spreadsheets/d/..." });
  p.append(input);
  const errEl = el("p", { class: "muted", style: "color:var(--danger);display:none;margin-top:8px;font-size:12px" });
  p.append(errEl);
  p.append(el("div", { class: "row" },
    el("button", { class: "icon-btn primary", onclick: async () => {
      const id = parseSheetId(input.value);
      if (!id) { errEl.textContent = "Couldn't read a sheet ID from that URL."; errEl.style.display = "block"; return; }
      errEl.style.display = "none";
      try {
        const meta = await fetchSheetMeta(id);
        state.sheetId = id; state.sheetTitle = meta.title; state.tabs = meta.tabs;
        localStorage.setItem(LS.SHEET_ID, id);
        await ensureConfigTab(id);
        // if config already exists, jump straight in
        const existing = await loadConfig();
        if (existing) {
          state.config = existing;
          state.dataTab = existing.dataTab;
          if (state.dataTab) {
            await loadData();
            startAutoRefresh();
            render();
            return;
          }
        }
        render();
      } catch (e) {
        errEl.textContent = "Failed: " + e.message;
        errEl.style.display = "block";
      }
    } }, "Connect"),
  ));
  cs.append(p);
  return cs;
}

function renderDataTabPicker() {
  const cs = el("div", { class: "center-screen" });
  const p = el("div", { class: "panel" });
  p.append(
    el("h2", {}, "Choose data tab & columns"),
    el("p", {}, "Pick the tab containing one row per event/transaction, then identify the date and email columns."),
  );
  p.append(el("label", {}, "Data tab"));
  const tabSel = el("select");
  state.tabs.filter(t => t.title !== CFG.CONFIG_TAB).forEach(t => {
    tabSel.append(el("option", { value: t.title }, t.title));
  });
  p.append(tabSel);

  const dateLabel = el("label", {}, "Date column");
  const dateSel = el("select");
  const emailLabel = el("label", {}, "Email column (for avatars)");
  const emailSel = el("select");
  const nameLabel = el("label", {}, "Name column (optional, for display)");
  const nameSel = el("select");
  p.append(dateLabel, dateSel, emailLabel, emailSel, nameLabel, nameSel);

  async function loadCols() {
    dateSel.innerHTML = ""; emailSel.innerHTML = ""; nameSel.innerHTML = "";
    nameSel.append(el("option", { value: "" }, "(none)"));
    try {
      const values = await fetchTabValues(state.sheetId, tabSel.value);
      const cols = (values[0] || []).map(c => String(c ?? "").trim());
      cols.forEach(c => {
        dateSel.append(el("option", { value: c }, c));
        emailSel.append(el("option", { value: c }, c));
        nameSel.append(el("option", { value: c }, c));
      });
      // best-effort defaults
      const guess = (re) => cols.find(c => re.test(c));
      const gd = guess(/date|created|timestamp|time/i); if (gd) dateSel.value = gd;
      const ge = guess(/email|mail/i); if (ge) emailSel.value = ge;
      const gn = guess(/^name$|agent|rep|owner|user/i); if (gn) nameSel.value = gn;
    } catch (e) {
      toast("Failed to read tab: " + e.message, "err");
    }
  }
  tabSel.addEventListener("change", loadCols);
  loadCols();

  p.append(el("div", { class: "row", style: "margin-top:18px;justify-content:flex-end" },
    el("button", { class: "icon-btn primary", onclick: async () => {
      state.dataTab = tabSel.value;
      // preserve any existing dashboards — only seed defaults on first connect
      const existingDashboards = state.config?.dashboards?.length ? state.config.dashboards : [defaultDashboard()];
      const cfg = {
        dataTab: tabSel.value,
        columns: { date: dateSel.value, email: emailSel.value, name: nameSel.value || null },
        dashboards: existingDashboards,
      };
      if (!state.activeDashboardId) state.activeDashboardId = existingDashboards[0].id;
      try {
        await saveConfig(cfg);
        await loadData();
        startAutoRefresh();
        render();
      } catch (e) {
        toast("Failed to save config: " + e.message, "err");
      }
    } }, "Save & build dashboard"),
  ));
  cs.append(p);
  return cs;
}

function defaultWidgets() {
  return [
    { id: uid(), kind: "leaderboard", title: "Leaderboard", cols: 6, rows: 6, agg: "COUNT", column: "", filters: [], limit: 10 },
  ];
}
function defaultDashboard(name = "Main Dashboard") {

}

function renderFilterbar() {
  const bar = el("div", { class: "filterbar" });

  // Auto chip — widgets use their own time period
  const autoChip = el("div", {
    class: "chip" + (state.timeFilter.kind === "AUTO" ? " active" : ""),
    title: "Each widget uses its own time period (set per widget in Edit)",
  }, "Auto (per widget)");
  autoChip.addEventListener("click", () => { state.timeFilter = { kind: "AUTO" }; renderDashboard(); render(); });
  bar.append(autoChip);
  bar.append(el("div", { class: "sep" }));

  const opts = [
    ["TODAY","Today"],["YESTERDAY","Yesterday"],["WEEK","This Week"],["LAST_WEEK","Last Week"],
    ["MTD","MTD"],["QTD","QTD"],["YTD","YTD"],["ALL","All Time"],
  ];
  opts.forEach(([k,l]) => {
    const c = el("div", {
      class: "chip" + (state.timeFilter.kind === k ? " active" : ""),
      title: state.timeFilter.kind === k ? "Overriding every widget's time period" : "Override all widgets to " + l,
    }, l);
    c.addEventListener("click", () => { state.timeFilter = { kind: k }; renderDashboard(); render(); });
    bar.append(c);
  });
  bar.append(el("div", { class: "sep" }));
  const customChip = el("div", { class: "chip" + (state.timeFilter.kind === "CUSTOM" ? " active" : "") }, "Custom");
  customChip.addEventListener("click", () => {
    state.timeFilter = { kind: "CUSTOM", customStart: state.timeFilter.customStart, customEnd: state.timeFilter.customEnd };
    render();
  });
  bar.append(customChip);
  if (state.timeFilter.kind === "CUSTOM") {
    const s = el("input", { type: "date", value: state.timeFilter.customStart || "" });
    const e = el("input", { type: "date", value: state.timeFilter.customEnd || "" });
    s.addEventListener("change", () => { state.timeFilter.customStart = s.value; renderDashboard(); });
    e.addEventListener("change", () => { state.timeFilter.customEnd = e.value; renderDashboard(); });
    bar.append(s, el("span", { class: "muted" }, "→"), e);
  }

  // small reminder of what mode we're in
  if (state.timeFilter.kind !== "AUTO") {
    bar.append(el("div", { class: "muted", style: "margin-left:auto;font-size:11px" },
      "Overriding all widgets — click 'Auto (per widget)' to restore individual settings"));
  }
  return bar;
}

function renderSidebar() {
  const collapsed = state.sidebarCollapsed;
  const sb = el("aside", {
    class: "sidebar" + (collapsed ? " collapsed" : "") + (state.mobileSidebarOpen ? " open" : ""),
  });

      onclick: addDashboard }, "+");
    hdrActions.append(addBtn);
  }

  toggle.addEventListener("click", () => {

  });
  hdrActions.append(toggle);

  const list = el("div", { class: "sidebar-list" });

      setActiveDashboard(d.id);
    });
    item.append(
      el("span", { class: "sb-icon" }, d.icon || "📊"),
      el("span", { class: "sb-name" }, d.name),
    );
    if (!state.readOnly) {
      const actions = el("div", { class: "sb-actions" });
      const editBtn = el("button", { title: "Rename / change icon", onclick: ev => { ev.stopPropagation(); renameDashboard(d.id); } }, "✎");
      const delBtn  = el("button", { title: "Delete dashboard",       onclick: ev => { ev.stopPropagation(); deleteDashboard(d.id); } }, "✕");
      actions.append(editBtn, delBtn);
      item.append(actions);
    }
