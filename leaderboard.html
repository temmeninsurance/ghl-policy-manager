  sb.append(list);

  if (!state.readOnly) {
    const newBtn = el("button", { class: "sb-new", onclick: addDashboard }, "+ New dashboard");
    sb.append(newBtn);
  }
  return sb;
}

async function addDashboard() {
  const name = prompt("Dashboard name:", "New Dashboard");
  if (!name) return;
  const d = { id: uid(), name: name.trim(), icon: "📊", widgets: [] };
  state.config.dashboards.push(d);
  state.activeDashboardId = d.id;
  if (state.sheetId) localStorage.setItem(LS.ACTIVE_DASH(state.sheetId), d.id);
  try {
    await saveConfig(state.config);
    render();
  } catch (e) { toast("Save failed: " + e.message, "err"); }
}
async function renameDashboard(id) {
  const d = state.config.dashboards.find(x => x.id === id);
  if (!d) return;
  const name = prompt("Rename dashboard:", d.name);
  if (name == null) return;
  d.name = name.trim() || d.name;
  const icon = prompt("Icon (single emoji, optional):", d.icon || "📊");
  if (icon != null && icon.trim()) d.icon = icon.trim();
  try {
    await saveConfig(state.config);
    render();
  } catch (e) { toast("Save failed: " + e.message, "err"); }
}
async function deleteDashboard(id) {
  if (state.config.dashboards.length <= 1) {
    toast("Can't delete the only dashboard — add another first", "err");
    return;
  }
  const d = state.config.dashboards.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`Delete "${d.name}"? Its widgets will be lost.`)) return;
  state.config.dashboards = state.config.dashboards.filter(x => x.id !== id);
  if (state.activeDashboardId === id) {
    state.activeDashboardId = state.config.dashboards[0].id;
    if (state.sheetId) localStorage.setItem(LS.ACTIVE_DASH(state.sheetId), state.activeDashboardId);
  }
  try {
    await saveConfig(state.config);
    render();
  } catch (e) { toast("Save failed: " + e.message, "err"); }
}

function renderDashboard() {
  // destroy old charts
  state.charts.forEach(c => c.destroy());
  state.charts.clear();

  const stage = $("#stage");
  if (!stage) return;
  stage.innerHTML = "";
  const dash = currentDashboard();
  if (!dash || !dash.widgets || !dash.widgets.length) {
    stage.append(el("div", { class: "empty" },
      el("h3", {}, "No widgets yet"),
      el("p", {}, "Click + Widget in the top bar to add your first KPI, leaderboard, goal, or chart."),
    ));
    return;
  }
  const grid = el("div", { class: "grid" });
  dash.widgets.forEach(w => grid.append(renderWidget(w)));
  stage.append(grid);
  if (state.tvMode) requestAnimationFrame(fitTvGrid);
}

/* Compute color tier for a numeric value against widget thresholds.
   direction: "higher" = bigger is better (sales, calls answered)
              "lower"  = smaller is better (missed calls, abandon rate)
   Returns "green" | "yellow" | "red" | null if no thresholds configured. */
function widgetColorTier(w, value) {
  if (value == null || isNaN(value)) return null;
  const good = w.thresholdGood, warn = w.thresholdWarn;
  if (good == null && warn == null) return null;
  const dir = w.direction || "higher";
  if (dir === "higher") {
    if (good != null && value >= good) return "green";
    if (warn != null && value >= warn) return "yellow";
    return "red";
  } else {
    if (good != null && value <= good) return "green";
    if (warn != null && value <= warn) return "yellow";
    return "red";
  }
}

/* default widget dimensions (grid cols × rows of 72px) */
function defaultSpan(kind) {
  switch (kind) {
    case "leaderboard": return { cols: 6, rows: 6 };
    case "chart":       return { cols: 8, rows: 4 };
    case "goal":        return { cols: 4, rows: 3 };
    case "pacing":      return { cols: 4, rows: 3 };
    case "kpi":         return { cols: 3, rows: 2 };
    default:            return { cols: 4, rows: 3 };
  }
}
/* migration: translate legacy `size` (1..5) to new cols/rows if needed */
function widgetSpan(w) {
  if (w.cols && w.rows) return { cols: w.cols, rows: w.rows };
  if (w.size) {
    const cols = ({1:3, 2:4, 3:6, 4:8, 5:12}[w.size]) || 4;
    const def = defaultSpan(w.kind);
    return { cols, rows: def.rows };
  }
  return defaultSpan(w.kind);
}

function renderWidget(w) {
  const span = widgetSpan(w);
  const node = el("div", { class: "widget kind-" + w.kind });
  // Explicit cell if dragged; otherwise auto-flow
  node.style.gridColumn = w.col ? `${w.col} / span ${span.cols}` : `span ${span.cols}`;
  node.style.gridRow    = w.row ? `${w.row} / span ${span.rows}` : `span ${span.rows}`;

  if (!state.readOnly) {
    node.append(el("div", { class: "w-actions" },
      el("button", { onclick: () => openWidgetModal(w.id) }, "Edit"),
      el("button", { onclick: () => deleteWidget(w.id) }, "✕"),
    ));
  }

  // Resolve effective time filter:
  //   pacing       -> always uses its own period (the whole point of the kind)
  //   global AUTO  -> widget's own setting (default "MTD")
  //   anything else -> global overrides
  const isPacing = w.kind === "pacing";
  const effective = isPacing
    ? { kind: (w.period || "MTD") + "*PACING" }   // marker, never used by timeRange
    : state.timeFilter.kind === "AUTO"
      ? { kind: w.timeFilter || "MTD" }
      : state.timeFilter;
  const range = !isPacing
    ? timeRange(effective.kind, { start: state.timeFilter.customStart, end: state.timeFilter.customEnd })
    : null;

  // Resolve tab + filtered rows FIRST so leaderboard widgets can show a
  // total-of-filter in the title bar.
  const tab = getWidgetTab(w);
  const widgetRows = tab?.rows || [];
  const dateCol = tab?.dateCol || state.config.columns.date;

  // If widget references a tab we haven't loaded yet, show a stub and bail
  if (w.dataTab && !state.tabsData[w.dataTab]) {
    node.append(el("div", { class: "w-title" }, w.title || w.kind));
    const body = el("div", { class: "w-body" });
    body.append(el("div", { class: "muted", style: "padding:18px" }, `Loading "${w.dataTab}"…`));
    node.append(body);
    ensureTabLoaded(w.dataTab).then(() => renderDashboard());
    return node;
  }

  const inRange = !isPacing
    ? rowsInTimeRange(widgetRows, dateCol, range).filter(r => rowMatchesAll(r, w.filters))
    : [];

  const titleRow = el("div", { class: "w-title", style: "display:flex;justify-content:space-between;align-items:center;gap:10px" });
  titleRow.append(el("span", { style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, w.title || w.kind));
  const periodLabel = isPacing
    ? "Pacing · " + timeFilterLabel(w.period || "MTD") + (w.businessDaysOnly !== false ? " (business days)" : "")
    : timeFilterLabel(effective.kind);

  const rightSide = el("div", { style: "display:flex;align-items:center;gap:10px;flex-shrink:0" });
  // Leaderboards: show the aggregate total of the filtered rows in the corner
  if (w.kind === "leaderboard") {
    const total = aggregate(inRange, w.agg, w.column);
    const totalLabel = w.format === "money" ? fmtMoney(total) : fmtNum(total);
    rightSide.append(el("span", {
      class: "lb-total",
      style: "font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.2px",
      title: `Total of the filter across ${inRange.length} row${inRange.length === 1 ? "" : "s"} (${w.agg || "COUNT"}${w.column ? " of " + w.column : ""})`,
    }, totalLabel));
  }
  rightSide.append(el("span", {
    style: "font-size:10px;color:" + (isPacing ? "var(--accent-2)" : (state.timeFilter.kind === "AUTO" ? "var(--text-faint)" : "var(--accent)")) + ";font-weight:600;letter-spacing:.4px",
    title: isPacing ? "Projects end-of-period based on current pace" : (state.timeFilter.kind === "AUTO" ? "This widget's saved time period" : "Overridden by global filter"),
  }, periodLabel));
  titleRow.append(rightSide);
  node.append(titleRow);

  const body = el("div", { class: "w-body" });
  node.append(body);

  // Apply threshold-based color tier
  if (w.kind === "kpi" || w.kind === "goal") {
    const value = aggregate(inRange, w.agg, w.column);
    const tier = widgetColorTier(w, value);
    if (tier) node.classList.add("tier-" + tier);
  } else if (isPacing) {
    // Pacing tier reflects the PROJECTED value vs thresholds
    const today = new Date();
    const m = pacingMetrics(w, today);
    const periodRows = rowsInTimeRange(widgetRows, dateCol, [m.periodStart, today])
      .filter(r => rowMatchesAll(r, w.filters));
    const current = aggregate(periodRows, w.agg, w.column);
    const projected = m.elapsedDays > 0 ? current * (m.totalDays / m.elapsedDays) : 0;
    const tier = widgetColorTier(w, projected);
    if (tier) node.classList.add("tier-" + tier);
  }

  try {
    if (w.kind === "kpi")         renderKpi(body, w, inRange);
    else if (w.kind === "goal")   renderGoal(body, w, inRange);
    else if (w.kind === "pacing") renderPacing(body, w);
    else if (w.kind === "leaderboard") renderLeaderboard(body, w, inRange);
    else if (w.kind === "chart")  renderChart(body, w, inRange, range);
  } catch (e) {
    console.error(e);
    body.append(el("div", { class: "muted" }, "Error: " + e.message));
  }

  // Drag-to-resize + drag-to-move (admins only)
  if (!state.readOnly) {
    const handle = el("div", { class: "resize-handle", title: "Drag to resize" });
    handle.addEventListener("mousedown", e => { e.stopPropagation(); startResize(e, node, w); });
    handle.addEventListener("touchstart", e => { e.stopPropagation(); startResize(e.touches[0], node, w, true); }, { passive: false });
    node.append(handle);

    node.addEventListener("mousedown", e => startMove(e, node, w));
  }
  return node;
}

/* Free drag-to-position. Sets w.col / w.row to an explicit grid cell.
   Threshold of 6px before treating it as a drag, so single clicks still
   feel responsive and don't accidentally reflow the layout. */
function startMove(e, widgetNode, w) {
  if (e.button !== 0) return;
  // Don't drag when interacting with buttons, inputs, the resize handle, etc.
  if (e.target.closest("button, input, select, a, .resize-handle, .w-actions")) return;

  const grid = widgetNode.parentElement;
  const span = widgetSpan(w);
  const startX = e.clientX, startY = e.clientY;
  const widgetRect = widgetNode.getBoundingClientRect();
  const offsetX = startX - widgetRect.left;
  const offsetY = startY - widgetRect.top;
  let dragMoved = false;
  let placeholder = null;
  let targetCol = w.col, targetRow = w.row;

  function gridMetrics() {
    const r = grid.getBoundingClientRect();
    const styles = getComputedStyle(grid);
    const gap = parseFloat(styles.rowGap) || parseFloat(styles.gap) || 14;
    const rowH = parseFloat(styles.gridAutoRows) || 72;
    const colW = (r.width - gap * 11) / 12;
    return { rect: r, gap, rowH, colW };
  }

  function onMove(ev) {
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (!dragMoved && Math.hypot(dx, dy) > 6) {
      dragMoved = true;
      widgetNode.classList.add("dragging");
      placeholder = el("div", { class: "drop-preview" });
      placeholder.style.gridColumn = `${w.col || 1} / span ${span.cols}`;
      placeholder.style.gridRow    = `${w.row || 1} / span ${span.rows}`;
      grid.append(placeholder);
    }
    if (!dragMoved) return;
    ev.preventDefault();
    const { rect, gap, rowH, colW } = gridMetrics();
    // mouse position relative to grid, anchored at where the user grabbed
    const localX = ev.clientX - rect.left - offsetX;
    const localY = ev.clientY - rect.top  - offsetY;
    targetCol = Math.max(1, Math.min(13 - span.cols, Math.round(localX / (colW + gap)) + 1));
    targetRow = Math.max(1, Math.round(localY / (rowH + gap)) + 1);
    placeholder.style.gridColumn = `${targetCol} / span ${span.cols}`;
    placeholder.style.gridRow    = `${targetRow} / span ${span.rows}`;
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    if (!dragMoved) return;
    widgetNode.classList.remove("dragging");
    placeholder?.remove();
    if (targetCol === w.col && targetRow === w.row) return;
    w.col = targetCol; w.row = targetRow;
    saveConfig(state.config).catch(e => toast("Save failed: " + e.message, "err"));
    renderDashboard();
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

let _resizeState = null;
function startResize(e, widgetNode, w, isTouch) {
  e.preventDefault?.();
  const grid = widgetNode.parentElement;
  const gridStyles = getComputedStyle(grid);
  const cols = 12;
  const gap = parseFloat(gridStyles.rowGap) || parseFloat(gridStyles.gap) || 14;
  const rowH = parseFloat(gridStyles.gridAutoRows) || 72;
  const colW = (grid.clientWidth - gap * (cols - 1)) / cols;
  const startSpan = widgetSpan(w);
  const startX = e.clientX, startY = e.clientY;
  widgetNode.classList.add("resizing");

  const preview = el("div", { class: "resize-preview" }, `${startSpan.cols}×${startSpan.rows}`);
  document.body.append(preview);
  function positionPreview(ev) {
    preview.style.left = (ev.clientX + 14) + "px";
    preview.style.top  = (ev.clientY + 14) + "px";
  }
  positionPreview(e);

  function getPoint(ev) {
    if (ev.touches?.[0]) return ev.touches[0];
    return ev;
  }
  function onMove(ev) {
    const pt = getPoint(ev);
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const newCols = Math.max(2, Math.min(12, Math.round(startSpan.cols + dx / (colW + gap))));
    const newRows = Math.max(2, Math.round(startSpan.rows + dy / (rowH + gap)));
    widgetNode.style.gridColumn = `span ${newCols}`;
    widgetNode.style.gridRow    = `span ${newRows}`;
    w.cols = newCols; w.rows = newRows;
    delete w.size; // legacy field — superseded by cols/rows
    preview.textContent = `${newCols}×${newRows}`;
    positionPreview(pt);
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
    widgetNode.classList.remove("resizing");
    preview.remove();
    saveConfig(state.config).catch(e => toast("Save failed: " + e.message, "err"));
    renderDashboard(); // re-render so chart canvases pick up the new size
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchmove", onMove, { passive: false });
  document.addEventListener("touchend", onUp);
}

function renderKpi(node, w, rows) {
  const v = aggregate(rows, w.agg, w.column);
  const pretty = w.format === "money" ? fmtMoney(v) : fmtNum(v);
  node.append(el("div", { class: "kpi-value" }, pretty));
  if (w.subtitle) node.append(el("div", { class: "kpi-sub" }, w.subtitle));
}

function renderGoal(node, w, rows) {
  const v = aggregate(rows, w.agg, w.column);
  const target = Number(w.target) || 0;
  const pct = target > 0 ? Math.min(100, (v / target) * 100) : 0;
  const meta = el("div", { class: "goal-meta" });
  meta.append(
    el("div", {}, el("div", { class: "goal-pct" }, pct.toFixed(0) + "%")),
    el("div", {}, (w.format === "money" ? fmtMoney(v) : fmtNum(v)) + " / " + (w.format === "money" ? fmtMoney(target) : fmtNum(target))),
  );
  node.append(meta);
  const bar = el("div", { class: "goal-bar" });
  const fill = el("div"); fill.style.width = pct + "%";
  bar.append(fill);
  node.append(bar);
}

function renderPacing(body, w) {
  const today = new Date();
  const m = pacingMetrics(w, today);
  const tab = getWidgetTab(w);
  const dateCol = tab?.dateCol || state.config.columns.date;
  // Pacing always reads its own period (ignores global time-filter chips)
  const periodRows = rowsInTimeRange(tab?.rows || [], dateCol, [m.periodStart, today])
    .filter(r => rowMatchesAll(r, w.filters));
  const current = aggregate(periodRows, w.agg, w.column);
  const projected = m.elapsedDays > 0 ? current * (m.totalDays / m.elapsedDays) : 0;
  const fmt = v => w.format === "money" ? fmtMoney(v) : fmtNum(v);

  const projLabel = el("div", { class: "kpi-value" }, fmt(projected));
  body.append(projLabel);

  // explanatory subtitle
  body.append(el("div", { class: "kpi-sub" },
    `Currently ${fmt(current)} · day ${m.elapsedDays} of ${m.totalDays}${m.businessOnly ? " business" : ""}`));

  // optional target line + progress bar
  if (w.target) {
    const pct = (projected / w.target) * 100;
    body.append(el("div", { class: "goal-meta", style: "margin-top:14px" },
      el("div", {}, el("div", { class: "goal-pct" }, pct.toFixed(0) + "%")),
      el("div", {}, fmt(projected) + " / " + fmt(w.target) + " target"),
    ));
    const bar = el("div", { class: "goal-bar" });
    const fill = el("div"); fill.style.width = Math.min(100, pct) + "%";
    bar.append(fill);
    body.append(bar);
  }
}

async function renderLeaderboard(node, w, rows) {
  const tab = getWidgetTab(w);
  const groupCol = w.groupBy || tab?.emailCol || state.config.columns.email;
  const nameCol  = tab?.nameCol || state.config.columns.name;
  const groups = new Map();
  for (const r of rows) {
    const key = r[groupCol]; if (key == null || key === "") continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const emailCol = tab?.emailCol || state.config.columns.email;
  const list = Array.from(groups.entries()).map(([key, grows]) => {
    const email = emailCol ? grows[0][emailCol] : null;
    const fallbackName = nameCol ? (grows[0][nameCol] || key) : key;
    return {
      key,
      name: userDisplayName(email, fallbackName),
      email,
      value: aggregate(grows, w.agg, w.column),
    };
  }).sort((a,b) => (b.value||0) - (a.value||0));
  const top = list.slice(0, w.limit || 10);
  const wrap = el("div");
  if (!top.length) {
    // diagnostic empty state — help the user figure out what's filtered out
    const totalRows = state.rows.length;
    const groupColLabel = groupCol || "(unset — set 'Email column' in Settings)";
    const dateCol = state.config.columns.date;
    const datesInRange = dateCol ? rowsInTimeRange(state.rows, dateCol, timeRange(state.timeFilter.kind, { start: state.timeFilter.customStart, end: state.timeFilter.customEnd })).length : totalRows;
    wrap.append(
      el("div", { class: "muted", style: "font-size:12px;line-height:1.7" },
        el("div", {}, `No matching rows.`),
        el("div", {}, `Sheet rows total: ${totalRows}`),
        el("div", {}, `Rows in time range: ${datesInRange} (date column: ${dateCol || "(unset)"})`),
        el("div", {}, `Group-by column: ${groupColLabel}`),
        totalRows > 0 && datesInRange === 0
          ? el("div", { style: "color:var(--warn);margin-top:6px" }, "→ All rows fell outside the time range. Check that the Date column in Settings points to the actual date column.")
          : null,
      ),
    );
    node.append(wrap); return;
  }
  for (let i = 0; i < top.length; i++) {
    const it = top[i];
    const row = el("div", { class: "lb-row" + (i<3 ? " r"+(i+1) : "") });
    const av = el("div", { class: "lb-avatar" }, initials(it.name || it.email));
    // priority: custom uploaded photo → Gravatar → initials
    const customPhoto = userPhotoUrl(it.email);
    if (customPhoto) {
      const im = new Image(); im.src = customPhoto;
      im.onload = () => { av.innerHTML = ""; av.append(im); };
    } else if (it.email) {
      gravatar(it.email).then(url => {
        if (!url) return;
        const im = new Image(); im.src = url;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      });
    }
    const valLabel = w.format === "money" ? fmtMoney(it.value) : fmtNum(it.value);
    row.append(
      el("div", { class: "lb-rank" }, "#" + (i+1)),
      av,
      el("div", { class: "lb-name" }, it.name),
      el("div", { class: "lb-value" }, valLabel),
    );
    wrap.append(row);
  }
  node.append(wrap);
}

function renderChart(node, w, rows, range) {
  const wrap = el("div", { class: "chart-wrap" });
  const cv = el("canvas");
  wrap.append(cv); node.append(wrap);
  const tab = getWidgetTab(w);
  const dateCol = tab?.dateCol || state.config.columns.date;
  if (!dateCol) { node.append(el("div", { class: "muted" }, "No date column found in this tab.")); return; }
  // bucket by day (or by month if range > 90 days)
  const days = (range[1] - range[0]) / 86400000;
  const bucketKind = days > 90 ? "month" : "day";
  const buckets = new Map();
  for (const r of rows) {
    const d = toDate(r[dateCol]); if (!d) continue;
    const key = bucketKind === "month"
      ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`
      : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(r);
  }
  const labels = Array.from(buckets.keys()).sort();
  const data = labels.map(k => aggregate(buckets.get(k), w.agg, w.column));
  const css = getComputedStyle(document.body);
  const accent = css.getPropertyValue("--accent").trim() || "#38e1c2";
  const txt = css.getPropertyValue("--text-dim").trim() || "#93a0c8";
  const grid = css.getPropertyValue("--border").trim() || "#243056";
  const ch = new Chart(cv, {
    type: w.chartType === "bar" ? "bar" : "line",
    data: { labels, datasets: [{
      label: w.title, data, borderColor: accent, backgroundColor: accent + "33",
      tension: 0.35, fill: true, pointRadius: 2, borderWidth: 2,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: txt }, grid: { color: grid } },
        y: { ticks: { color: txt }, grid: { color: grid }, beginAtZero: true },
      },
    },
  });
  state.charts.set(w.id, ch);
}

/* Searchable value combobox for filter rows. Suggestions = the unique
   values in the selected column, narrowed by what the user has typed. */
function makeSearchableValueInput(filter, getColumn, getTabName) {
  const wrap = el("div", { class: "value-combo" });
  const input = el("input", { type: "text", placeholder: "value", autocomplete: "off", value: filter.value ?? "" });
  const dropdown = el("div", { class: "value-dropdown", style: "display:none" });
  let activeIdx = -1, currentMatches = [];

  function renderMatches() {
    const col = getColumn();
    const tabName = getTabName ? getTabName() : null;
    dropdown.innerHTML = "";
    activeIdx = -1;
    if (!col) {
      dropdown.append(el("div", { class: "vd-empty" }, "Pick a column first to see suggestions."));
      dropdown.style.display = "block";
      return;
    }
    const all = uniqueValuesForColumn(col, tabName);
    if (!all.length) {
      dropdown.append(el("div", { class: "vd-empty" }, "No values found in this column yet."));
      dropdown.style.display = "block";
      return;
    }
    const q = (input.value || "").toLowerCase();
    const matches = q
      ? all.filter(v => v.toLowerCase().includes(q)).slice(0, 100)
      : all.slice(0, 100);
    currentMatches = matches;
    if (!matches.length) {
      dropdown.append(el("div", { class: "vd-empty" }, "No matches. Type a value above and press Enter to use it as-is."));
      dropdown.style.display = "block";
      return;
    }
    matches.forEach((v, i) => {
      const it = el("div", { class: "vd-item", "data-idx": i }, v);
      // optional: show occurrence count
      it.addEventListener("mousedown", e => {
        e.preventDefault(); // keep focus so blur doesn't fire first
        input.value = v;
        filter.value = v;
        dropdown.style.display = "none";
      });
      dropdown.append(it);
    });
    if (q && all.length > matches.length) {
      dropdown.append(el("div", { class: "vd-empty" }, `Showing ${matches.length} of ${all.length} values · keep typing to narrow`));
    } else if (all.length > matches.length) {
      dropdown.append(el("div", { class: "vd-empty" }, `${matches.length} of ${all.length} values · type to filter`));
    }
    dropdown.style.display = "block";
  }
  function setActive(idx) {
    $$(".vd-item", dropdown).forEach(n => n.classList.remove("active"));
    if (idx >= 0 && idx < currentMatches.length) {
      activeIdx = idx;
      const node = dropdown.querySelector(`.vd-item[data-idx="${idx}"]`);
      if (node) { node.classList.add("active"); node.scrollIntoView({ block: "nearest" }); }
    }
  }

  input.addEventListener("focus", renderMatches);
  input.addEventListener("input", () => { filter.value = input.value; renderMatches(); });
  input.addEventListener("blur",  () => setTimeout(() => { dropdown.style.display = "none"; }, 180));
  input.addEventListener("keydown", e => {
    if (dropdown.style.display === "none") return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(activeIdx + 1, currentMatches.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(activeIdx - 1, 0)); }
    else if (e.key === "Enter" && activeIdx >= 0) {
      e.preventDefault();
      const v = currentMatches[activeIdx];
      input.value = v; filter.value = v; dropdown.style.display = "none";
    } else if (e.key === "Escape") { dropdown.style.display = "none"; }
  });

  wrap.append(input, dropdown);
  return { wrap, input };
}

/* ════════════════════════════════════════════════════════════════════════
   Widget editor modal
   ════════════════════════════════════════════════════════════════════════ */
function openWidgetModal(widgetId) {
  const dash = currentDashboard();
  if (!dash) return;
  const isNew = !widgetId;
  const w = isNew
    ? { id: uid(), kind: "kpi", title: "New KPI", ...defaultSpan("kpi"), agg: "COUNT", column: "", filters: [] }
    : JSON.parse(JSON.stringify(dash.widgets.find(x => x.id === widgetId)));

  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const m = el("div", { class: "modal" });
  m.append(
    el("h3", {}, isNew ? "Add widget" : "Edit widget"),
    el("div", { class: "modal-sub" }, "Pick a widget type, then choose what to measure and how to filter it."),
  );

  // type
  m.append(el("label", {}, "Widget type"));
  const kindSel = el("select");
  [
    ["kpi","KPI tile"],
    ["goal","Goal / progress"],
    ["pacing","Pacing (projected end of period)"],
    ["leaderboard","Leaderboard"],
    ["chart","Trend chart"],
  ].forEach(([v,l]) => {
    kindSel.append(el("option", { value: v, selected: w.kind === v ? "selected" : null }, l));
  });
  m.append(kindSel);

  // body container — re-render when kind changes
  const body = el("div");
  m.append(body);

  function renderBody() {
    body.innerHTML = "";
    body.append((() => {
      const w1 = el("div");
      w1.append(el("label", {}, "Title"));
      const t = el("input", { type: "text", value: w.title || "" });
      t.addEventListener("input", () => w.title = t.value);
      w1.append(t);
      w1.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
        "💡 Drag the bottom-right corner of any widget to resize it after saving."));
      return w1;
    })());

    // Data source tab — defaults to dashboard's main data tab
    body.append(el("label", {}, "Data tab (which sheet tab this widget pulls from)"));
    const tabSel = el("select");
    tabSel.append(el("option", { value: "" }, `(dashboard default — ${state.dataTab || "none"})`));
    state.tabs
      .filter(t => t.title !== CFG.CONFIG_TAB && t.title !== CFG.USERS_TAB)
      .forEach(t => tabSel.append(el("option", { value: t.title, selected: w.dataTab === t.title ? "selected" : null }, t.title)));
    tabSel.addEventListener("change", async () => {
      w.dataTab = tabSel.value || null;
      if (w.dataTab && !state.tabsData[w.dataTab]) {
        // fetch the new tab's columns so the column dropdowns below populate
        const tip = el("div", { class: "muted", style: "font-size:11px;margin-top:6px" }, `Loading columns from "${w.dataTab}"…`);
        body.append(tip);
        await ensureTabLoaded(w.dataTab);
        tip.remove();
      }
      // reset column choices that may not exist on the new tab
      const cols = getColumnsForWidget(w);
      if (w.column && !cols.includes(w.column)) w.column = "";
      if (w.groupBy && !cols.includes(w.groupBy)) w.groupBy = "";
      (w.filters || []).forEach(f => { if (f.column && !cols.includes(f.column)) f.column = ""; });
      renderBody();
    });
    body.append(tabSel);
    body.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
      "Pick a different tab to read this widget's data from a separate sheet — e.g. one widget on Sales Data, another on Call Logs."));

    // Per-widget time period (not shown for pacing — pacing has its own period)
    if (w.kind !== "pacing") {
      body.append(el("label", {}, "Time period"));
      const timeSel = el("select");
      [
        ["TODAY","Today"],["YESTERDAY","Yesterday"],
        ["WEEK","This Week"],["LAST_WEEK","Last Week"],
        ["MTD","MTD"],["QTD","QTD"],["YTD","YTD"],
        ["ALL","All Time"],
      ].forEach(([v,l]) => {
        timeSel.append(el("option", { value: v, selected: (w.timeFilter || "MTD") === v ? "selected" : null }, l));
      });
      timeSel.addEventListener("change", () => w.timeFilter = timeSel.value);
      body.append(timeSel);
      body.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
        "💡 This applies when the top filter is set to 'Auto (per widget)'. Selecting Today/MTD/etc. up there overrides every widget."));
    }

    body.append(el("div", { class: "row2" },
      (() => { const c = el("div");
        c.append(el("label", {}, "Aggregation"));

        ["COUNT","COUNT_DISTINCT","SUM","AVG","MIN","MAX"].forEach(v => {
          a.append(el("option", { value: v, selected: w.agg === v ? "selected" : null }, v.replace("_"," ")));
        });
        a.addEventListener("change", () => w.agg = a.value);
        c.append(a); return c;
      })(),
      (() => { const c = el("div");
        c.append(el("label", {}, "Column" + (w.kind === "leaderboard" || w.kind === "kpi" || w.kind==="goal" || w.kind==="chart" ? " (numeric for SUM/AVG/MIN/MAX)" : "")));

        a.addEventListener("change", () => w.column = a.value);
        c.append(a); return c;
      })(),
    ));

    // format
    body.append(el("label", {}, "Number format"));

      fmt.append(el("option", { value: v, selected: (w.format||"number")===v ? "selected" : null }, l));
    });
    fmt.addEventListener("change", () => w.format = fmt.value);
    body.append(fmt);

      body.append(el("label", {}, "Target value"));

      body.append(t);

    if (w.kind === "pacing") {
      body.append(el("div", { class: "row2" },
        (() => { const c = el("div");
          c.append(el("label", { style: "margin-top:0" }, "Pacing period"));
          const a = el("select");
          [["WTD","Weekly (this week)"],["MTD","Monthly (this month)"],["QTD","Quarterly (this quarter)"],["YTD","Yearly (this year)"]]
            .forEach(([v,l]) => a.append(el("option", { value: v, selected: (w.period||"MTD")===v?"selected":null }, l)));
          a.addEventListener("change", () => w.period = a.value);
          c.append(a); return c;
        })(),
        (() => { const c = el("div");
          c.append(el("label", { style: "margin-top:0" }, "Working days"));
          const a = el("select");
          [["true","Business days only (Mon-Fri)"],["false","All calendar days"]]
            .forEach(([v,l]) => a.append(el("option", { value: v, selected: ((w.businessDaysOnly !== false) === (v === "true")) ? "selected" : null }, l)));
          a.addEventListener("change", () => w.businessDaysOnly = a.value === "true");
          c.append(a); return c;
        })(),
      ));
      body.append(el("label", {}, "Target (optional)"));
      const t = el("input", { type: "number", placeholder: "e.g. 1000000", value: w.target ?? "" });
      t.addEventListener("input", () => w.target = t.value === "" ? null : parseFloat(t.value));
      body.append(t);
      body.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
        "Projection = current value × (total days in period ÷ days elapsed). With business days on, weekends don't drag the projection down."));
    }

    // Color thresholds — KPI / goal / pacing widgets get a green/yellow/red tint
    if (w.kind === "kpi" || w.kind === "goal" || w.kind === "pacing") {
      body.append(el("label", {}, "Color thresholds (optional)"));
      const dirRow = el("div", { class: "row2" });
      const dirCell = el("div");
      dirCell.append(el("label", { style: "margin-top:0" }, "Direction"));
      const dirSel = el("select");
      [["higher","Higher is better (sales, calls)"], ["lower","Lower is better (missed, errors)"]].forEach(([v,l]) => {
        dirSel.append(el("option", { value: v, selected: (w.direction || "higher") === v ? "selected" : null }, l));
      });
      dirSel.addEventListener("change", () => w.direction = dirSel.value);
      dirCell.append(dirSel);
      dirRow.append(dirCell);
      // empty cell to balance the grid
      dirRow.append(el("div"));
      body.append(dirRow);

      const tRow = el("div", { class: "row2" });
      const goodCell = el("div");
      goodCell.append(el("label", { style: "margin-top:0" }, "🟢 Green at/beyond"));
      const goodIn = el("input", { type: "number", step: "any", placeholder: "e.g. 10", value: w.thresholdGood ?? "" });
      goodIn.addEventListener("input", () => w.thresholdGood = goodIn.value === "" ? null : parseFloat(goodIn.value));
      goodCell.append(goodIn);
      const warnCell = el("div");
      warnCell.append(el("label", { style: "margin-top:0" }, "🟡 Yellow at/beyond"));
      const warnIn = el("input", { type: "number", step: "any", placeholder: "e.g. 5", value: w.thresholdWarn ?? "" });
      warnIn.addEventListener("input", () => w.thresholdWarn = warnIn.value === "" ? null : parseFloat(warnIn.value));
      warnCell.append(warnIn);
      tRow.append(goodCell, warnCell);
      body.append(tRow);
      body.append(el("div", { class: "muted", style: "font-size:11px;margin-top:6px" },
        "Below the yellow threshold = 🔴 red. Leave both blank to disable color thresholds."));
    }
    if (w.kind === "leaderboard") {
      body.append(el("div", { class: "row2" },
        (() => { const c = el("div");
          c.append(el("label", {}, "Group by (default = email)"));
          const a = el("select");
          a.append(el("option", { value: "" }, "(default: email column)"));
          getColumnsForWidget(w).forEach(c2 => a.append(el("option", { value: c2, selected: w.groupBy===c2 ? "selected" : null }, c2)));
          a.addEventListener("change", () => w.groupBy = a.value);
          c.append(a); return c;
        })(),
        (() => { const c = el("div");
          c.append(el("label", {}, "Show top N"));
          const i = el("input", { type: "number", value: w.limit || 10, min: "1", max: "100" });
          i.addEventListener("input", () => w.limit = parseInt(i.value,10) || 10);
          c.append(i); return c;
        })(),
      ));
    }
    if (w.kind === "chart") {
      body.append(el("label", {}, "Chart type"));
      const a = el("select");
      [["line","Line"],["bar","Bar"]].forEach(([v,l]) => {
        a.append(el("option", { value: v, selected: (w.chartType||"line")===v ? "selected" : null }, l));
      });
      a.addEventListener("change", () => w.chartType = a.value);
      body.append(a);
    }

    // filters
    body.append(el("label", {}, "Filters (mix AND/OR — AND binds tighter than OR)"));
    const fwrap = el("div");
    body.append(fwrap);
    function renderFilters() {
      fwrap.innerHTML = "";
      (w.filters || []).forEach((f, idx) => {
        const row = el("div", { class: "filter-row" });

        // first row: "WHERE" label; subsequent rows: AND/OR selector
        const combo = el("div", { class: "combinator-cell" });
        if (idx === 0) {
          combo.append(el("span", {}, "WHERE"));
        } else {
          const sel = el("select");
          sel.append(el("option", { value: "AND", selected: (f.combinator || "AND") === "AND" ? "selected" : null }, "AND"));
          sel.append(el("option", { value: "OR",  selected: f.combinator === "OR"  ? "selected" : null }, "OR"));
          sel.addEventListener("change", () => { f.combinator = sel.value; });
          combo.append(sel);
        }

        const cs = el("select");
        cs.append(el("option", { value: "" }, "(column)"));
        getColumnsForWidget(w).forEach(c2 => cs.append(el("option", { value: c2, selected: f.column === c2 ? "selected" : null }, c2)));
        cs.addEventListener("change", () => { f.column = cs.value; });
        const os = el("select");
        OPERATORS.forEach(o => os.append(el("option", { value: o, selected: f.op === o ? "selected" : null }, o.replace(/_/g," "))));
        os.addEventListener("change", () => { f.op = os.value; renderFilters(); });

        // Searchable value input — pulls unique values from the widget's tab + selected column
        const valueBox = makeSearchableValueInput(f, () => f.column, () => w.dataTab || state.dataTab);
        if (["is_empty","not_empty"].includes(f.op)) valueBox.wrap.style.visibility = "hidden";

        const rm = el("button", { onclick: () => { w.filters.splice(idx,1); renderFilters(); } }, "✕");
        row.append(combo, cs, os, valueBox.wrap, rm);
        fwrap.append(row);
      });
      const add = el("button", { class: "add-filter-btn", onclick: () => {
        w.filters = w.filters || [];
        w.filters.push({ combinator: "AND", column: "", op: "equals", value: "" });
        renderFilters();
      } }, "+ Add filter");
      fwrap.append(add);
    }
    renderFilters();
  }
  kindSel.addEventListener("change", () => { w.kind = kindSel.value; renderBody(); });
  renderBody();

  m.append(el("div", { class: "actions" },
    isNew ? null : el("button", { class: "icon-btn danger", onclick: () => { deleteWidget(w.id); back.remove(); } }, "Delete"),
    (!isNew && (w.col || w.row)) ? el("button", { class: "icon-btn", title: "Clear the saved position so this widget auto-arranges with the others", onclick: async () => {
      delete w.col; delete w.row;
      const d = currentDashboard();
      const idx = d.widgets.findIndex(x => x.id === w.id);
      if (idx >= 0) d.widgets[idx] = w;
      try { await saveConfig(state.config); renderDashboard(); back.remove(); }
      catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "↺ Auto-position") : null,
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async (ev) => {
      const saveBtn = ev.currentTarget;
      const originalLabel = saveBtn.textContent;
      saveBtn.textContent = "Saving…"; saveBtn.disabled = true;
      const d = currentDashboard();
      // snapshot so we can roll back on failure
      const before = JSON.parse(JSON.stringify(d.widgets));
      if (isNew) d.widgets.push(w);
      else {
        const idx = d.widgets.findIndex(x => x.id === w.id);
        d.widgets[idx] = w;
      }
      try {
        await saveConfig(state.config);
        toast("Saved", "ok");
        renderDashboard();
        back.remove();
      } catch (e) {
        // keep modal open so the user can re-try without losing what they typed
        d.widgets = before;
        saveBtn.textContent = originalLabel; saveBtn.disabled = false;
        const err = el("div", { style: "background:rgba(239,68,68,.15);color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:12px;line-height:1.5" },
          "⚠ Save failed: " + e.message + " — your changes are kept on this screen. Click Save again to retry.");
        m.append(err);
      }
    } }, "Save"),
  ));
  back.append(m);
  document.body.append(back);
}

async function deleteWidget(id) {
  if (!confirm("Delete this widget?")) return;
  const d = currentDashboard();
  if (!d) return;
  d.widgets = d.widgets.filter(w => w.id !== id);
  try {
    await saveConfig(state.config);
    renderDashboard();
  } catch (e) { toast("Delete failed: " + e.message, "err"); }
}

function detectEmailsInRows() {
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const seen = new Map(); // lowercased email -> { email, name }
  const emailCol = state.config?.columns?.email;
  const nameCol  = state.config?.columns?.name;

  // 1. Configured email column — primary source
  if (emailCol) {
    for (const r of state.rows) {
      const e = r[emailCol]; if (!e) continue;
      const s = String(e).trim();
      if (!EMAIL_RE.test(s)) continue;
      const k = s.toLowerCase();
      if (!seen.has(k)) seen.set(k, { email: s, name: nameCol ? (r[nameCol] || "") : "" });
    }
  }
  // 2. Fallback — scan EVERY cell of EVERY row for anything that looks like an email.
  //    Catches cases where the email column was never configured in Settings.
  if (!seen.size) {
    for (const r of state.rows) {
      for (const col of state.columns) {
        const v = r[col]; if (!v) continue;
        const s = String(v).trim();
        if (!EMAIL_RE.test(s)) continue;
        const k = s.toLowerCase();
        if (!seen.has(k)) seen.set(k, { email: s, name: nameCol ? (r[nameCol] || "") : "" });
      }
    }
  }
  return seen;
}

function openPeopleModal() {
  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const m = el("div", { class: "modal", style: "max-width:720px" });
  m.append(
    el("h3", {}, "👤 People"),
    el("div", { class: "modal-sub" }, "Upload a headshot or paste an image URL for each person. Display name overrides the name shown in the leaderboard. Stored in a hidden __plecto_users tab in the sheet so all viewers see the same photos."),
  );

  // Add-person inline form (always available, even if detection fails)
  const addBox = el("div", { style: "background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px" });
  addBox.append(el("div", { style: "font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px" }, "Add a person"));
  const emailIn = el("input", { type: "email", placeholder: "alton@temmeninsurance.com", style: "width:100%;padding:7px 10px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:6px" });
  const nameIn  = el("input", { type: "text",  placeholder: "Display name (optional)",  style: "width:100%;padding:7px 10px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:6px" });
  const addBtn = el("button", { class: "icon-btn primary", style: "padding:7px 14px", onclick: () => {
    const e = (emailIn.value || "").trim().toLowerCase();
    if (!e || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { toast("Enter a valid email address", "err"); return; }
    state.users[e] = state.users[e] || { photoUrl: "", displayName: "" };
    if (nameIn.value.trim()) state.users[e].displayName = nameIn.value.trim();
    emailIn.value = ""; nameIn.value = "";
    refreshList();
    toast("Added — set a headshot below, then click Save", "ok");
  } }, "+ Add");
  addBox.append(emailIn, nameIn, addBtn);
  m.append(addBox);

  const search = el("input", { class: "people-search", type: "text", placeholder: "Search by name or email…" });
  m.append(search);

  const listWrap = el("div", { class: "people-list" });
  m.append(listWrap);

  // detected from data + already-saved profiles
  let people = [];
  function rebuildPeople() {
    const seen = detectEmailsInRows();
    for (const k of Object.keys(state.users)) {
      if (!seen.has(k)) seen.set(k, { email: k, name: state.users[k].displayName || "" });
    }
    people = Array.from(seen.values()).sort((a,b) => (a.name||a.email).localeCompare(b.name||b.email));
  }
  rebuildPeople();

  function makeRow(p) {
    const k = p.email.toLowerCase();
    const profile = state.users[k] || { photoUrl: "", displayName: "" };
    const row = el("div", { class: "people-row" });

    const av = el("div", { class: "pp-avatar" }, initials(profile.displayName || p.name || p.email));
    if (profile.photoUrl) {
      const im = new Image(); im.src = profile.photoUrl;
      im.onload = () => { av.innerHTML = ""; av.append(im); };
    } else if (p.email) {
      gravatar(p.email).then(url => {
        if (!url) return;
        const im = new Image(); im.src = url;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      });
    }

    const meta = el("div", { class: "pp-meta" });
    const nameInput = el("input", { type: "text", value: profile.displayName || p.name || "", placeholder: "Display name" });
    nameInput.addEventListener("input", () => {
      state.users[k] = state.users[k] || { photoUrl: "", displayName: "" };
      state.users[k].displayName = nameInput.value;
    });
    meta.append(nameInput, el("div", { class: "pp-email" }, p.email));

    const actions = el("div", { class: "pp-actions" });

    const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
    fileInput.addEventListener("change", async () => {
      const f = fileInput.files?.[0]; if (!f) return;
      try {
        const dataUrl = await resizeImageToDataUrl(f, 128, 0.82);
        state.users[k] = state.users[k] || { displayName: "" };
        state.users[k].photoUrl = dataUrl;
        // refresh avatar
        const im = new Image(); im.src = dataUrl;
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      } catch (e) { toast("Couldn't read image: " + e.message, "err"); }
    });
    const uploadBtn = el("button", { onclick: () => fileInput.click() }, "📤 Upload");
    const urlBtn = el("button", { onclick: () => {
      const url = prompt("Paste an image URL (must allow hotlinking):", profile.photoUrl || "");
      if (url == null) return;
      state.users[k] = state.users[k] || { displayName: "" };
      state.users[k].photoUrl = url.trim();
      if (url.trim()) {
        const im = new Image(); im.src = url.trim();
        im.onload = () => { av.innerHTML = ""; av.append(im); };
      } else {
        av.innerHTML = ""; av.textContent = initials(profile.displayName || p.name || p.email);
      }
    } }, "🔗 URL");
    const clearBtn = el("button", { class: "danger", onclick: () => {
      if (state.users[k]) {
        state.users[k].photoUrl = "";
        av.innerHTML = ""; av.textContent = initials(profile.displayName || p.name || p.email);
        // re-try Gravatar
        gravatar(p.email).then(url => {
          if (!url) return;
          const im = new Image(); im.src = url;
          im.onload = () => { av.innerHTML = ""; av.append(im); };
        });
      }
    } }, "Clear");
    actions.append(uploadBtn, urlBtn, clearBtn, fileInput);

    row.append(av, meta, actions);
    return row;
  }

  function refreshList() {
    rebuildPeople();
    listWrap.innerHTML = "";
    const q = search.value.toLowerCase().trim();
    const filtered = q ? people.filter(p => (p.email + " " + p.name + " " + (state.users[p.email.toLowerCase()]?.displayName || "")).toLowerCase().includes(q)) : people;
    if (!filtered.length) {
      const msg = people.length
        ? "No matches."
        : (state.rows.length
            ? `No emails detected in your sheet's data (scanned ${state.rows.length} rows). Use the "Add a person" box above to add people manually, or check that your Email column is set in Settings → Email column.`
            : "Sheet data hasn't loaded yet. Use the Add a person box above to add people manually.");
      listWrap.append(el("div", { class: "muted", style: "padding:20px;text-align:center;line-height:1.6" }, msg));
      return;
    }
    filtered.forEach(p => listWrap.append(makeRow(p)));
  }
  search.addEventListener("input", refreshList);
  refreshList();

  m.append(el("div", { class: "actions" },
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async () => {
      try {
        await ensureUsersTab(state.sheetId);
        await saveUsers();
        toast("People saved", "ok");
        renderDashboard();
        back.remove();
      } catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "Save"),
  ));

  back.append(m);
  document.body.append(back);
}

function openSettingsModal() {
  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const m = el("div", { class: "modal" });
  m.append(

  );

  state.tabs.filter(t => t.title !== CFG.CONFIG_TAB).forEach(t =>
    tabSel.append(el("option", { value: t.title, selected: state.dataTab === t.title ? "selected" : null }, t.title)));
  m.append(tabSel);

  const cols = state.columns;

  const emailSel = el("select");

  m.append(emailSel);

    el("button", { class: "icon-btn", onclick: () => { back.remove(); state.sheetId = null; localStorage.removeItem(LS.SHEET_ID); render(); } }, "Switch sheet"),
    el("button", { class: "icon-btn", onclick: () => back.remove() }, "Cancel"),
    el("button", { class: "icon-btn primary", onclick: async () => {
      const tabChanged = tabSel.value !== state.dataTab;
      state.dataTab = tabSel.value;
      state.config.dataTab = tabSel.value;
      state.config.columns = { date: dateSel.value, email: emailSel.value, name: nameSel.value || null };
      try {
        await saveConfig(state.config);
        if (tabChanged) await loadData(); else renderDashboard();
        toast("Saved", "ok");
        back.remove();
      } catch (e) { toast("Save failed: " + e.message, "err"); }
    } }, "Save"),
  ));
  back.append(m);
  document.body.append(back);
}

/* ════════════════════════════════════════════════════════════════════════
   Manual Save button
   ════════════════════════════════════════════════════════════════════════ */
function renderSaveButton() {
  const s = state.saveState;
  let label, cls;
  if (s === "saving") { label = "Saving…";          cls = "s-saving"; }
  else if (s === "saved")  { label = "✓ Saved";    cls = "s-saved"; }
  else if (s === "error")  { label = "⚠ Save failed — click to retry"; cls = "s-error"; }
  else { label = "💾 Save"; cls = "s-idle"; }
  const btn = el("button", {
    class: "save-btn " + cls,
    title: s === "error"
      ? "Last save failed — your changes are kept locally. Click to retry writing to the sheet."
      : "Force-save the dashboard to the Google Sheet right now.",
  }, label);
  btn.addEventListener("click", () => forceSave());
  return btn;
}
async function forceSave() {
  if (!state.config) return;
  if (state.saveState === "saving") return;  // already in flight
  try {
    await saveConfig(state.config);
    toast("Dashboard saved", "ok");
  } catch (e) {
    toast("Save failed: " + e.message, "err");
  }
}

// Block tab close / refresh while a save is in flight or just failed
window.addEventListener("beforeunload", e => {
  if (state.saveState === "saving" || state.saveState === "error") {
    e.preventDefault();
    e.returnValue = "";
    return "";
  }
});

/* ════════════════════════════════════════════════════════════════════════
   Share link
   ════════════════════════════════════════════════════════════════════════ */
function copyShareLink() {
  if (!state.sheetId) return;
  let url = `${location.origin}${location.pathname}?sheet=${state.sheetId}`;
  if (state.activeDashboardId) url += `&dashboard=${state.activeDashboardId}`;
  navigator.clipboard.writeText(url).then(() => {
    toast("Share link copied — opens this exact dashboard for anyone with Sheet access", "ok");
  }).catch(() => {
    prompt("Copy this URL:", url);
  });
}

function currentTheme() { return document.body.getAttribute("data-theme") || "dark"; }
function setTheme(t) {
  document.body.setAttribute("data-theme", t);
  localStorage.setItem(LS.THEME, t);
}
function toggleTheme() {
  setTheme(currentTheme() === "dark" ? "light" : "dark");

async function startChromecast() {
  if (!("PresentationRequest" in window)) {
    toast("Chrome Cast isn't available in this browser. Use Chrome or Edge, or fall back to Screen Share (option 1).", "err");
    return;
  }
  const url = `${location.origin}${location.pathname}?sheet=${state.sheetId || ""}${state.activeDashboardId ? "&dashboard=" + state.activeDashboardId : ""}`;
  const req = new PresentationRequest([url]);
  try {
    const conn = await req.start();
    toast("Casting started — the TV will need to sign in with Google. Consider Miracast instead for zero-config.", "ok");
    conn.addEventListener("close", () => toast("Cast ended", ""));
  } catch (e) {
    if (e.name === "NotFoundError") {
      toast("No Chromecast device found on this network. Try Screen Share (option 1).", "err");
    } else if (e.name === "NotAllowedError") {
      /* user closed the picker — silent */
    } else {
      toast("Cast failed: " + e.message, "err");
    }
  }
}

/* ════════════════════════════════════════════════════════════════════════
   TV mode — fullscreen, hide chrome, scale grid to fit viewport
   ════════════════════════════════════════════════════════════════════════ */
async function toggleTvMode() {
  state.tvMode = !state.tvMode;
  if (state.tvMode) {
    try { await document.documentElement.requestFullscreen(); }
    catch (e) { /* browser blocked — still show TV layout even without native fullscreen */ }
    startTvClock();
  } else {
    if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch {} }
    stopTvClock();
  }
  render();
  requestAnimationFrame(fitTvGrid);
}
function fitTvGrid() {
  if (!state.tvMode) return;
  const grid  = document.querySelector(".app-shell.tv-mode .grid");
  const stage = document.querySelector(".app-shell.tv-mode .stage");
  if (!grid || !stage) return;
  // Reset before measuring so we get the natural size
  grid.style.transform = "";
  grid.style.width = "";
  const naturalW = grid.scrollWidth  || 1;
  const naturalH = grid.scrollHeight || 1;
  const availW = stage.clientWidth  - 4;
  const availH = stage.clientHeight - 4;
  const scale = Math.min(availW / naturalW, availH / naturalH);
  grid.style.transform = `scale(${scale})`;
  // Compensate width so the scaled element still occupies its box's flex slot cleanly
  grid.style.width = (100 / scale) + "%";
}
window.addEventListener("resize", () => { if (state.tvMode) fitTvGrid(); });
document.addEventListener("fullscreenchange", () => {
  // If the user pressed Esc, browser drops fullscreen — mirror that to state
  if (!document.fullscreenElement && state.tvMode) {
    state.tvMode = false;
    stopTvClock();
    render();
  }
});
function startTvClock() {
  stopTvClock();
  state.tvClockTimer = setInterval(() => {
    const c = document.querySelector(".tv-clock");
    if (c) c.textContent = new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }, 15000);
}
function stopTvClock() {
  clearInterval(state.tvClockTimer);
  state.tvClockTimer = null;
}

/* ════════════════════════════════════════════════════════════════════════
   Boot / refresh loop
   ════════════════════════════════════════════════════════════════════════ */
function startAutoRefresh() {
  clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(() => {
    if (tokenValid() && state.sheetId && state.dataTab) loadData();
  }, CFG.REFRESH_MS);
  startPageReloadTimer();
}

/* Full-page reload every PAGE_RELOAD_MS. Skipped while an editing UI is
   open so we never nuke half-finished work. Also skips if the user has
   interacted with the page in the last 30s. */
let _lastInteractionAt = Date.now();
["mousedown","keydown","touchstart"].forEach(ev =>
  window.addEventListener(ev, () => { _lastInteractionAt = Date.now(); }, { capture: true, passive: true }));

function startPageReloadTimer() {
  clearInterval(state.pageReloadTimer);
  state.pageReloadTimer = setInterval(() => {
    // Defer if the user is clearly mid-task
    if (document.querySelector(".modal-back"))                   return;
    if (state.saveState === "saving" || state.saveState === "error") return;
    if (document.querySelector(".widget.dragging, .widget.resizing")) return;
    if (Date.now() - _lastInteractionAt < 30_000)                 return;
    console.log("[plecto] scheduled full-page reload");
    location.reload();
  }, CFG.PAGE_RELOAD_MS);
}

async function boot() {
  setTheme(localStorage.getItem(LS.THEME) || "dark");
  state.sidebarCollapsed = localStorage.getItem(LS.SIDEBAR) === "1";

  // ?sheet=<id>&dashboard=<id> URL params
  const params = new URLSearchParams(location.search);
  const urlDashId = params.get("dashboard");
  const urlSheetId = parseSheetId(params.get("sheet") || "");
  const savedSheetId = urlSheetId || localStorage.getItem(LS.SHEET_ID);
  if (urlSheetId) localStorage.setItem(LS.SHEET_ID, urlSheetId);

  // STEP 1 — restore from cache IMMEDIATELY (no network) so the dashboard appears instantly
  // even before sign-in. We only need a token to fetch fresh data, not to show the layout.
  if (savedSheetId) {
    state.sheetId = savedSheetId;
    state.sheetTitle = readCachedSheetTitle(savedSheetId);
    const cached = readCachedConfig(savedSheetId);
    if (cached) {
      state.config = cached;
      state.dataTab = cached.dataTab;
    }
    // active dashboard preference: URL param > localStorage > first
    const stored = localStorage.getItem(LS.ACTIVE_DASH(savedSheetId));
    state.activeDashboardId = urlDashId || stored || null;
  }

  // STEP 2 — auth. Try stored token → silent GIS re-auth → login screen.
  // Silent re-auth is what lets the 5-minute page reload survive past the
  // 1-hour access-token expiry without kicking the user back to sign-in.
  if (!loadStoredAuth()) {
    if (savedSheetId) {
      const silent = await attemptSilentAuth();
      if (!silent) { render(); return; }
    } else {
      render(); return;
    }
  }
  if (!state.user?.email) await fetchUserEmail();

  // Render the cached dashboard NOW so the user sees something while we fetch live data
  render();

  // STEP 3 — sync with the sheet in the background (won't blow away cached state on errors)
  if (savedSheetId) {
    try {
      const meta = await fetchSheetMeta(savedSheetId);
      state.sheetTitle = meta.title;
      state.tabs = meta.tabs;
      writeCachedSheetTitle(savedSheetId, meta.title);
      await ensureConfigTab(savedSheetId);
      const cfg = await loadConfig();
      if (cfg) {
        state.config = cfg;
        state.dataTab = cfg.dataTab;
      }
      // Load user profiles in parallel with data — non-fatal if it fails
      loadUsers().catch(e => console.warn("[plecto] loadUsers:", e.message));
      if (state.dataTab) {
        await loadData();
        startAutoRefresh();
      }
      render();
    } catch (e) {
      console.warn("[plecto] background sync failed:", e.message);
      // 401 → token expired during refresh. Don't sign out / wipe state.
      // Just clear the token so the user can sign in again, KEEPING cached config visible.
      if (String(e.message).includes("401")) {
        state.token = null; state.tokenExp = 0;
        localStorage.removeItem(LS.TOKEN);
        localStorage.removeItem(LS.TOKEN_EXP);
        toast("Session expired — sign in again to refresh data", "err");
        renderTopbar();
      }
    }
  }
}

window.addEventListener("DOMContentLoaded", boot);
// Re-init token client once GIS script has loaded
const gsiPoll = setInterval(() => {
  if (window.google?.accounts?.oauth2) { clearInterval(gsiPoll); initTokenClient(); }
}, 200);
</script>
