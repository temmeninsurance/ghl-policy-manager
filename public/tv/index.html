/* ── Celebrations ─────────────────────────────────────────────────────────
   Each data sync is diffed against the previous one (per agent, today's
   rows, company-wide). New sales trigger a full-screen takeover with the
   rep's photo and amount; personal-best days and career-app milestones
   upgrade the headline. First snapshot only sets the baseline. */
const CELEB_HEADLINES = {
  race: "🏁 FULL THROTTLE!", opoly: "🎩 PAYDAY!", madness: "🏀 BUCKETS!",
  golf: "⛳ BIRDIE!", cup: "⚽ GOOOOAL!", deal: "💼 DEAL!",
  xmas: "🎄 HO HO SOLD!", hallow: "🎃 TRICK OR TREAT!",
  mueller: "💜 NEW SALE!", temmen: "🛡️ NEW SALE!", default: "🎉 NEW SALE!",
};
const MILESTONE_STEP = 250; // career apps
let celebBaseline = null;
const celebQueue = [];
let celebShowing = false;

function celebStats() {
  const t = ymd(new Date());
  const m = new Map();
  for (const r of latest.rows || []) {
    const a = r[CFG.agentField];
    if (!a) continue;
    let s = m.get(a);
    if (!s) { s = { todayApps: 0, todayRev: 0, careerApps: 0, bestPrev: 0, days: new Map() }; m.set(a, s); }
    const apps = Number(r[CFG.appsField]) || 0;
    const rev = Number(r[CFG.revenueField]) || 0;
    s.careerApps += apps;
    const d = r[CFG.dateField];
    if (d === t) { s.todayApps += apps; s.todayRev += rev; }
    else s.days.set(d, (s.days.get(d) || 0) + rev);
  }
  for (const s of m.values()) {
    for (const v of s.days.values()) if (v > s.bestPrev) s.bestPrev = v;
    s.days = null; // free
  }
  return m;
}

function detectCelebrations() {
  const stats = celebStats();
  if (celebBaseline && state.celebrate !== false) {
    for (const [agent, s] of stats) {
      const b = celebBaseline.get(agent);
      const prevApps = b ? b.todayApps : 0;
      const prevRev = b ? b.todayRev : 0;
      if (s.todayApps <= prevApps && s.todayRev <= prevRev + 0.5) continue;
      const e = { agent, apps: Math.max(0, s.todayApps - prevApps), rev: Math.max(0, s.todayRev - prevRev), tag: "" };
      if (s.bestPrev > 0 && s.todayRev > s.bestPrev && prevRev <= s.bestPrev) e.tag = "PERSONAL BEST DAY! 🏅";
      const prevCareer = b ? b.careerApps : s.careerApps - e.apps;
      if (Math.floor(s.careerApps / MILESTONE_STEP) > Math.floor(prevCareer / MILESTONE_STEP)) {
        e.tag = `${(Math.floor(s.careerApps / MILESTONE_STEP) * MILESTONE_STEP).toLocaleString()} CAREER APPS! 🏆`;
      }
      if (celebQueue.length < 6) celebQueue.push(e);
    }
    showNextCeleb();
  }
  celebBaseline = stats;
}

function showNextCeleb() {
  if (celebShowing || !celebQueue.length) return;
  celebShowing = true;
  const e = celebQueue.shift();
  const el = document.getElementById("celebrate");
  const av = document.getElementById("cAvatar");
  av.innerHTML = "";
  const photo = photoOf(e.agent);
  if (photo) {
    const img = document.createElement("img");
    img.src = photo;
    av.appendChild(img);
  } else {
    av.textContent = initialsOf(displayNameOf(e.agent));
  }
  document.getElementById("cName").textContent = displayNameOf(e.agent);
  document.getElementById("cAmount").textContent = e.rev > 0 ? fmtMoney(e.rev) : `${fmt(e.apps)} app${e.apps === 1 ? "" : "s"}`;
  document.getElementById("cSub").textContent = e.rev > 0 && e.apps > 0 ? `${fmt(e.apps)} app${e.apps === 1 ? "" : "s"}` : "";
  document.getElementById("cTag").textContent = e.tag || CELEB_HEADLINES[state.theme] || CELEB_HEADLINES.default;
  el.classList.remove("hidden");
  setTimeout(() => {
    el.classList.add("hidden");
    celebShowing = false;
    showNextCeleb();
  }, 8000);
}

/* ── Aggregation ── */
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Inclusive [start, end] (yyyy-mm-dd) of the selected date frame.
function periodRange(v) {
  const now = new Date();
  const y = now.getFullYear();
  if (v === "today") { const t = ymd(now); return [t, t]; }
  if (v === "week") {
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return [ymd(monday), "9999"];
  }
  if (v === "ytd") return [`${y}-01-01`, "9999"];
  if (v === "last_month") {
    return [ymd(new Date(y, now.getMonth() - 1, 1)), ymd(new Date(y, now.getMonth(), 0))];
  }
  if (v === "last_year") return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (v === "all") return ["0000", "9999"];
  return [ymd(new Date(y, now.getMonth(), 1)), "9999"]; // mtd
}

// Ad-hoc date filter from the header picker — a per-screen viewing control
// that overrides everything else until cleared. Remembered per device.
let dateOverride = null;
try { dateOverride = JSON.parse(localStorage.getItem("tvDateOverride")); } catch { /* ignore */ }

// Active range: header date picker > contest dates > date frame.
function currentRange() {
  if (dateOverride) return [dateOverride.start || "0000", dateOverride.end || "9999"];
  if (state.contestStart && state.contestEnd) return [state.contestStart, state.contestEnd];
  return periodRange(state.view);
}

// Concrete [start, end] for pace math (null when unbounded, e.g. All Time).
function concreteBounds() {
  if (dateOverride) {
    return dateOverride.start && dateOverride.end ? [dateOverride.start, dateOverride.end] : null;
  }
  if (state.contestStart && state.contestEnd) return [state.contestStart, state.contestEnd];
  const now = new Date();
  const y = now.getFullYear();
  const v = state.view;
  if (v === "today") { const t = ymd(now); return [t, t]; }
  if (v === "week") {
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return [ymd(monday), ymd(sunday)];
  }
  if (v === "mtd") return [ymd(new Date(y, now.getMonth(), 1)), ymd(new Date(y, now.getMonth() + 1, 0))];
  if (v === "ytd") return [`${y}-01-01`, `${y}-12-31`];
  if (v === "last_month" || v === "last_year") return periodRange(v);
  return null; // all time — pace is meaningless
}

/* ── Business-day pacing (the floor works Mon–Fri) ── */
function bizDaysBetween(startS, endS) { // inclusive yyyy-mm-dd range
  let n = 0;
  const d = new Date(startS + "T12:00");
  const end = new Date(endS + "T12:00");
  while (d <= end) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}

// Elapsed/total business days for the active bounded period; null when
// the period is unbounded (All Time).
function paceFraction() {
  const b = concreteBounds();
  if (!b) return null;
  const today = ymd(new Date());
  const upTo = today > b[1] ? b[1] : today;
  const total = Math.max(1, bizDaysBetween(b[0], b[1]));
  const elapsed = today < b[0] ? 1 : Math.max(1, bizDaysBetween(b[0], upTo));
  return { elapsed, total, frac: Math.min(1, elapsed / total) };
}

// value may be a single string or an array (any-of).
function matchesFilter(r, field, value) {
  const rv = String(r[field] || "").trim().toLowerCase();
  if (Array.isArray(value)) return value.some((v) => rv === String(v).trim().toLowerCase());
  return rv === String(value).trim().toLowerCase();
}

// Rows within the dashboard's date frame + filters, plus the widget's own
// optional filter.
function rowsFor(widget, range) {
  const [start, end] = range || currentRange();
  const fields = latest.filterFields || [];
  const out = [];
  for (const r of latest.rows || []) {
    const d = r[CFG.dateField] || "";
    if (d < start || d > end) continue;
    let keep = true;
    for (const [k, v] of Object.entries(state.filters)) {
      if (k !== CFG.agentField && fields.length && !fields.includes(k)) continue; // stale filter key
      if (!matchesFilter(r, k, v)) { keep = false; break; }
    }
    if (keep && widget?.ffield && widget?.fvalue && !matchesFilter(r, widget.ffield, widget.fvalue)) keep = false;
    if (keep) out.push(r);
  }
  return out;
}

function sumsOf(rows) {
  let apps = 0, revenue = 0;
  for (const r of rows) {
    apps += Number(r[CFG.appsField]) || 0;
    revenue += Number(r[CFG.revenueField]) || 0;
  }
  return { apps, revenue };
}

function aggBy(rows, keyFn) {
  const map = new Map();
  for (const r of rows) {
    const key = keyFn(r) || "—";
    const acc = map.get(key) || { apps: 0, revenue: 0 };
    acc.apps += Number(r[CFG.appsField]) || 0;
    acc.revenue += Number(r[CFG.revenueField]) || 0;
    map.set(key, acc);
  }
  return map;
}

function fmt(n) {
  return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}
function fmtMoney(n) {
  return "$" + Math.round(n).toLocaleString();
}
function fmtBy(metric, n) {
  return metric === "apps" ? fmt(n) : fmtMoney(n);
}

function metricValue(rows, metric) {
  if (metric === "reps") {
    const s = new Set();
    for (const r of rows) if (r[CFG.agentField]) s.add(r[CFG.agentField]);
    return s.size;
  }
  const sums = sumsOf(rows);
  if (metric === "apps") return sums.apps;
  if (metric === "avg") return sums.revenue / Math.max(1, sums.apps);
  return sums.revenue;
}

function fmtKpi(metric, v) {
  return metric === "apps" || metric === "reps" ? fmt(Math.round(v)) : fmtMoney(v);
}

function fmtShort(metric, n) {
  if (metric === "apps") return fmt(Math.round(n));
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
}

// % change vs the prior equivalent window, compared at the same point for
// in-progress periods (day 18 vs day 18 of the previous window).
function kpiDelta(w, cur) {
  const b = concreteBounds();
  if (!b) return null;
  const sD = new Date(b[0] + "T12:00");
  const eD = new Date(b[1] + "T12:00");
  const len = Math.round((eD - sD) / 864e5) + 1;
  const ps = new Date(sD);
  ps.setDate(ps.getDate() - len);
  let pe = new Date(sD);
  pe.setDate(pe.getDate() - 1);
  const today = ymd(new Date());
  if (today < b[1]) {
    const off = Math.max(0, Math.round((new Date(today + "T12:00") - sD) / 864e5));
    pe = new Date(ps);
    pe.setDate(pe.getDate() + off);
  }
  const prev = metricValue(rowsFor(w, [ymd(ps), ymd(pe)]), w.metric);
  if (!(prev > 0)) return null;
  return ((cur - prev) / prev) * 100;
}

function widgetLabel(w) {
  if (w.label) return w.label;
  const suffix = w.fvalue ? ` — ${w.fvalue}` : "";
  if (w.type === "kpi") return METRICS[w.metric] + suffix;
  if (w.type === "breakdown") return `${METRICS[w.metric]} by ${String(w.field || "").replace(/_/g, " ")}` + suffix;
  if (w.type === "rookies") return "Rookie Leaderboard" + suffix;
  if (w.type === "pace") return "Goal Pace — MTD" + suffix;
  if (w.type === "trend") return `${METRICS[w.metric]} Trend` + suffix;
  return "Leaderboard" + (w.metric === "apps" ? " — Apps" : "") + suffix;
}

function nameChip(cls, text) {
  const s = document.createElement("span");
  s.className = "nchip " + cls;
  s.textContent = text;
  return s;
}

// Company-wide per-agent career facts, recomputed per render: first sale
// date (rookie window) and selling-day streaks (consecutive company-active
// days with at least one sale).
let firstSale = new Map();
let streakMap = new Map();
function computeCareerFacts() {
  firstSale = new Map();
  streakMap = new Map();
  const agentDays = new Map();
  const allDays = new Set();
  for (const r of latest.rows || []) {
    const a = r[CFG.agentField], d = r[CFG.dateField];
    if (!a || !d) continue;
    if (d < (firstSale.get(a) || "9999")) firstSale.set(a, d);
    allDays.add(d);
    let s = agentDays.get(a);
    if (!s) { s = new Set(); agentDays.set(a, s); }
    s.add(d);
  }
  const active = [...allDays].sort().reverse().slice(0, 60);
  for (const [a, days] of agentDays) {
    let n = 0;
    for (const d of active) { if (days.has(d)) n++; else break; }
    streakMap.set(a, n);
  }
}

/* ── Rendering ── */
function render() {
  if (!latest) return;
  computeCareerFacts();

  // Date-frame badge doubles as the contest countdown clock.
  const badge = document.getElementById("viewBadge");
  if (dateOverride) {
    const short = (d) => d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : "…";
    badge.textContent = `📅 ${short(dateOverride.start)} – ${short(dateOverride.end)}`;
  } else if (state.contestStart && state.contestEnd) {
    const left = new Date(state.contestEnd + "T23:59:59").getTime() - Date.now();
    if (left <= 0) badge.textContent = "🏁 FINAL";
    else {
      const d = Math.floor(left / 86400e3), h = Math.floor((left % 86400e3) / 3600e3), m = Math.floor((left % 3600e3) / 60e3);
      badge.textContent = "⏱ " + (d > 0 ? `${d}d ${h}h` : `${h}h ${m}m`) + " left";
    }
  } else {
    badge.textContent = (VIEWS[state.view] || state.view).toUpperCase();
  }

  // Goal bar with on/behind-pace math.
  const goalBar = document.getElementById("goalBar");
  if (state.goal > 0) {
    const rev = sumsOf(rowsFor(null)).revenue;
    const pctG = Math.min(100, (rev / state.goal) * 100);
    document.getElementById("goalLabel").textContent = `${fmtMoney(rev)} / ${fmtMoney(state.goal)} (${Math.round(pctG)}%)`;
    document.getElementById("goalFill").style.width = pctG + "%";
    const paceEl = document.getElementById("goalPace");
    const pfG = paceFraction();
    if (pfG) {
      const diff = rev - state.goal * pfG.frac;
      paceEl.textContent = diff >= 0 ? `▲ ${fmtMoney(diff)} ahead of pace` : `▼ ${fmtMoney(-diff)} behind pace`;
      paceEl.className = diff >= 0 ? "pace-up" : "pace-down";
    } else {
      paceEl.textContent = "";
    }
    goalBar.classList.remove("hidden");
  } else {
    goalBar.classList.add("hidden");
  }

  const kpis = state.widgets.filter((w) => w.type === "kpi");
  const boards = state.widgets.filter((w) => w.type !== "kpi");

  const kpiRow = document.getElementById("kpiRow");
  kpiRow.innerHTML = "";
  let headerSet = false;
  for (const w of kpis) {
    const cur = metricValue(rowsFor(w), w.metric);
    const value = fmtKpi(w.metric, cur);
    if (!headerSet) {
      document.getElementById("totalNum").textContent = value;
      document.getElementById("totalLbl").textContent = widgetLabel(w);
      headerSet = true;
    }
    const tile = document.createElement("div");
    tile.className = "kpi-tile";
    const num = document.createElement("div");
    num.className = "kpi-num";
    num.textContent = value;
    const lbl = document.createElement("div");
    lbl.className = "kpi-lbl";
    lbl.textContent = widgetLabel(w);
    tile.append(num, lbl);
    const d = kpiDelta(w, cur);
    if (d !== null) {
      const dl = document.createElement("div");
      dl.className = "kpi-delta " + (d >= 0 ? "up" : "down");
      dl.textContent = `${d >= 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(0)}% vs prior`;
      tile.appendChild(dl);
    }
    kpiRow.appendChild(tile);
  }

  const widgetsEl = document.getElementById("widgets");
  const scrollPos = [...widgetsEl.querySelectorAll(".wboard")].map((el) => el.scrollTop);
  widgetsEl.innerHTML = "";
  widgetsEl.style.gridTemplateColumns = `repeat(${Math.max(1, boards.length)}, 1fr)`;
  const todayS = ymd(new Date());
  for (let bi = 0; bi < boards.length; bi++) {
    const w = boards[bi];
    // Trend chart: buckets by day (short periods) or month (long/unbounded),
    // colored bars with the current bucket in gold.
    if (w.type === "trend") {
      const rows = rowsFor(w);
      const b = concreteBounds();
      const monthly = !b || (new Date(b[1] + "T12:00") - new Date(b[0] + "T12:00")) / 864e5 > 62;
      const agg = new Map();
      for (const r of rows) {
        const d = r[CFG.dateField] || "";
        if (!d) continue;
        const key = monthly ? d.slice(0, 7) : d;
        const acc = agg.get(key) || { apps: 0, revenue: 0 };
        acc.apps += Number(r[CFG.appsField]) || 0;
        acc.revenue += Number(r[CFG.revenueField]) || 0;
        agg.set(key, acc);
      }
      const keys = [...agg.keys()].sort().slice(monthly ? -24 : -31);
      const maxV = Math.max(1, ...keys.map((k) => agg.get(k)[w.metric]));
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      const panel = document.createElement("div");
      panel.className = "widget";
      const h = document.createElement("h3");
      h.textContent = widgetLabel(w);
      const boardEl = document.createElement("div");
      boardEl.className = "wboard trend";
      panel.append(h, boardEl);

      const dense = keys.length > 16; // label every other column when crowded
      for (let ki = 0; ki < keys.length; ki++) {
        const key = keys[ki];
        const isLast = ki === keys.length - 1;
        const labeled2 = !dense || ki % 2 === keys.length % 2 || isLast;
        const v = agg.get(key)[w.metric];
        const col = document.createElement("div");
        col.className = "tcol" + (isLast ? " now" : "");
        const tv = document.createElement("div");
        tv.className = "tval";
        tv.textContent = labeled2 ? fmtShort(w.metric, v) : " ";
        const bar = document.createElement("div");
        bar.className = "tbar";
        bar.style.height = Math.max(2, (v / maxV) * 100) + "%";
        bar.title = key + " — " + fmtBy(w.metric, v);
        const tl = document.createElement("div");
        tl.className = "tlbl";
        tl.textContent = labeled2
          ? (monthly
            ? MONTHS[Number(key.slice(5, 7)) - 1] + (key.slice(5, 7) === "01" || key === keys[0] ? " '" + key.slice(2, 4) : "")
            : String(Number(key.slice(8, 10))))
          : " ";
        col.append(tv, bar, tl);
        boardEl.appendChild(col);
      }
      if (!keys.length) {
        const empty = document.createElement("div");
        empty.className = "more";
        empty.textContent = "No data in this period yet.";
        boardEl.appendChild(empty);
      }
      widgetsEl.appendChild(panel);
      continue;
    }

    // Pace board: each rep against their own monthly goal (set in the
    // Agents editor), ranked by attainment, always MTD.
    if (w.type === "pace") {
      const now = new Date();
      const mtdStart = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
      const mEnd = ymd(new Date(now.getFullYear(), now.getMonth() + 1, 0));
      const frac = Math.min(1, Math.max(1, bizDaysBetween(mtdStart, ymd(now))) / Math.max(1, bizDaysBetween(mtdStart, mEnd)));
      const agg = aggBy(rowsFor(w, [mtdStart, "9999"]), (r) => r[CFG.agentField]);
      const bySlug = new Map();
      for (const [agent, m] of agg) {
        const goal = goalOf(agent);
        if (goal > 0) bySlug.set(slugOf(agent), { agent, rev: m.revenue, goal });
      }
      for (const [slug, p] of profiles) {
        if (Number(p.goal) > 0 && !bySlug.has(slug) && p.agent) {
          bySlug.set(slug, { agent: p.agent, rev: 0, goal: Number(p.goal) });
        }
      }
      const ranked = [...bySlug.values()]
        .map((e) => ({ ...e, pct: (e.rev / e.goal) * 100, diff: e.rev - e.goal * frac }))
        .sort((a, b) => b.pct - a.pct);

      const panel = document.createElement("div");
      panel.className = "widget";
      const h = document.createElement("h3");
      h.textContent = widgetLabel(w);
      const boardEl = document.createElement("div");
      boardEl.className = "wboard";
      panel.append(h, boardEl);

      for (let i = 0; i < ranked.length; i++) {
        const e = ranked[i];
        const cls = e.pct >= 100 ? "pdone" : e.diff >= 0 ? "pahead" : "pbehind";
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div class="rank r${i + 1}">${i + 1}</div>
          <div class="avatar"></div>
          <div class="bar-wrap">
            <div class="bar ${cls}" style="width:${Math.max(2, Math.min(100, e.pct))}%"></div>
            <div class="pace-mark" style="left:${(frac * 100).toFixed(1)}%"></div>
            <div class="name"></div>
          </div>
          <div><div class="apps">${Math.round(e.pct)}%</div><div class="sub">${fmtMoney(e.rev)} / ${fmtMoney(e.goal)}</div></div>`;
        const nameEl = row.querySelector(".name");
        nameEl.textContent = displayNameOf(e.agent);
        nameEl.appendChild(nameChip(e.diff >= 0 ? "up" : "down",
          (e.diff >= 0 ? "▲" : "▼") + fmtMoney(Math.abs(e.diff))));
        const av = row.querySelector(".avatar");
        const photo = photoOf(e.agent);
        if (photo) {
          const img = document.createElement("img");
          img.src = photo;
          img.alt = "";
          av.appendChild(img);
        } else {
          av.textContent = initialsOf(displayNameOf(e.agent));
        }
        boardEl.appendChild(row);
      }
      if (!ranked.length) {
        const empty = document.createElement("div");
        empty.className = "more";
        empty.textContent = "No rep goals set yet — add them under Agents → Edit names & photos.";
        boardEl.appendChild(empty);
      }
      widgetsEl.appendChild(panel);
      continue;
    }

    const rows = rowsFor(w);
    const isAgents = w.type === "leaderboard" || w.type === "rookies";
    const keyFn = isAgents ? (r) => r[CFG.agentField] : (r) => r[w.field];
    const map = aggBy(rows, keyFn);
    let ranked = [...map.entries()]
      .map(([key, m]) => ({ key, ...m }))
      .sort((a, b) => b[w.metric] - a[w.metric] || String(a.key).localeCompare(String(b.key)));

    if (w.type === "rookies") {
      const cut = new Date();
      cut.setMonth(cut.getMonth() - ROOKIE_MONTHS);
      const cutS = ymd(cut);
      ranked = ranked.filter((e) => (firstSale.get(e.key) || "0000") >= cutS);
    }

    // Rank movement vs. yesterday's standings (same period minus today).
    let prevRank = null;
    if (isAgents && state.view !== "today") {
      const prev = [...aggBy(rows.filter((r) => (r[CFG.dateField] || "") < todayS), keyFn).entries()]
        .map(([key, m]) => ({ key, ...m }))
        .sort((a, b) => b[w.metric] - a[w.metric] || String(a.key).localeCompare(String(b.key)));
      prevRank = new Map(prev.map((e, idx) => [e.key, idx]));
    }

    if (!headerSet) {
      const sums = sumsOf(rows);
      document.getElementById("totalNum").textContent = fmtBy(w.metric, sums[w.metric]);
      document.getElementById("totalLbl").textContent = METRICS[w.metric];
      headerSet = true;
    }

    const race = state.theme === "race" && isAgents;
    const panel = document.createElement("div");
    panel.className = "widget";
    const h = document.createElement("h3");
    h.textContent = (race ? "🏁 " : "") + widgetLabel(w);
    const boardEl = document.createElement("div");
    boardEl.className = "wboard";
    panel.append(h, boardEl);

    const ITEMS = ["👑", "🚀", "🍄", "⭐", "🐢", "🍌"];
    const max = ranked.length ? ranked[0][w.metric] : 1;
    const shown = ranked; // every matching entry — the board scrolls
    for (let i = 0; i < shown.length; i++) {
      const e = shown[i];
      const main = e[w.metric];
      const sub = w.metric === "apps" ? fmtMoney(e.revenue) : `${fmt(e.apps)} apps`;
      const row = document.createElement("div");
      const valueCell = `<div><div class="apps">${fmtBy(w.metric, main)}</div><div class="sub">${sub}</div></div>`;
      if (race) {
        row.className = "row race";
        const pct = max > 0 ? Math.max(2, (main / max) * 76) : 2;
        row.innerHTML = `
          <div class="rank r${i + 1}">${i + 1}</div>
          <div class="track">
            <div class="lane-name"></div>
            <div class="finish"></div>
            <div class="kart" style="left:${pct}%">
              <span class="item">${ITEMS[Math.min(i, ITEMS.length - 1)]}</span>
              <div class="avatar"></div>
              <span class="kart-svg">${KART_SVG}</span>
            </div>
          </div>
          ${valueCell}`;
      } else {
        // Pacing strip under each rep's line: projection from business-day
        // run rate; if they have a goal it becomes progress-to-goal with
        // an expected-today marker.
        const pf = isAgents ? paceFraction() : null;
        let pstrip = "";
        if (pf) {
          const proj = (main / pf.elapsed) * pf.total;
          const goal = w.metric === "revenue" ? goalOf(e.key) : 0;
          if (goal > 0) {
            const gp = Math.max(2, Math.min(100, (main / goal) * 100));
            const cls = main >= goal ? "pdone" : main >= goal * pf.frac ? "pahead" : "pbehind";
            pstrip = `<div class="pstrip"><div class="pfill ${cls}" style="width:${gp}%"></div>` +
              `<div class="pace-mark" style="left:${(pf.frac * 100).toFixed(1)}%"></div>` +
              `<span class="ptext">pacing ${fmtBy(w.metric, proj)} · goal ${fmtMoney(goal)}</span></div>`;
          } else {
            pstrip = `<div class="pstrip"><div class="pfill" style="width:${(pf.frac * 100).toFixed(1)}%"></div>` +
              `<span class="ptext">pacing ${fmtBy(w.metric, proj)}</span></div>`;
          }
        }
        row.className = "row" + (isAgents ? "" : " noav") + (pstrip ? " paced" : "");
        const pct = max > 0 ? Math.max(4, (main / max) * 100) : 4;
        // Theme trinkets: Temmenopoly builds houses toward the hotel;
        // Temmen Madness racks up baskets toward the trophy.
        let houses = "";
        if (isAgents && state.theme === "opoly") {
          houses = `<div class="houses">${i === 0 ? "🏨" : "🏠".repeat(Math.min(4, Math.floor(pct / 25)))}</div>`;
        } else if (isAgents && state.theme === "madness") {
          houses = `<div class="houses">${i === 0 ? "🏆" : "🏀".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        } else if (isAgents && state.theme === "golf") {
          // birdies on the card; the leader wears the green jacket
          houses = `<div class="houses">${i === 0 ? `<span class="jacket">${JACKET_SVG}</span>` : "⛳".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        } else if (isAgents && state.theme === "cup") {
          // goals scored; the leader lifts the trophy
          houses = `<div class="houses">${i === 0 ? "🏆" : "⚽".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        } else if (isAgents && state.theme === "deal") {
          // money bags stack up; the leader holds the big case
          houses = `<div class="houses">${i === 0 ? "💼" : "💰".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        } else if (isAgents && state.theme === "xmas") {
          // presents pile up under the tree; Santa rides with the leader
          houses = `<div class="houses">${i === 0 ? "🎅" : "🎁".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        } else if (isAgents && state.theme === "hallow") {
          // pumpkins collect on the porch; the leader is the ghost with the most
          houses = `<div class="houses">${i === 0 ? "👻" : "🎃".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        }
        row.innerHTML = `
          <div class="rank r${i + 1}">${i + 1}</div>
          ${isAgents ? '<div class="avatar"></div>' : ""}
          <div class="bcell"><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div><div class="name"></div>${houses}</div>${pstrip}</div>
          ${valueCell}`;
      }
      const nameEl = row.querySelector(".name, .lane-name");
      nameEl.textContent = isAgents ? displayNameOf(e.key) : e.key;
      if (isAgents) {
        if (prevRank && prevRank.has(e.key)) {
          const moved = prevRank.get(e.key) - i;
          if (moved > 0) nameEl.appendChild(nameChip("up", "▲" + moved));
          else if (moved < 0) nameEl.appendChild(nameChip("down", "▼" + Math.abs(moved)));
        }
        const st = streakMap.get(e.key) || 0;
        if (st >= 2) nameEl.appendChild(nameChip("fire", "🔥" + st));
      }
      if (isAgents) {
        const av = row.querySelector(".avatar");
        const photo = photoOf(e.key);
        if (photo) {
          const img = document.createElement("img");
          img.src = photo;
          img.alt = "";
          av.appendChild(img);
        } else {
          av.textContent = initialsOf(displayNameOf(e.key));
        }
      }
      boardEl.appendChild(row);
    }
    if (!ranked.length) {
      const empty = document.createElement("div");
      empty.className = "more";
      empty.textContent = "No apps in this period yet.";
      boardEl.appendChild(empty);
    }
    widgetsEl.appendChild(panel);
  }
  // Keep each board's scroll position across live refreshes.
  [...widgetsEl.querySelectorAll(".wboard")].forEach((el, i) => {
    if (scrollPos[i]) el.scrollTop = scrollPos[i];
  });

  // Admin-chosen frame size: stretch/shrink rows so exactly N reps fill
  // each board before scrolling. (Phones keep natural sizing.)
  if (state.rowsShown > 0 && !window.matchMedia("(max-width: 700px)").matches) {
    requestAnimationFrame(() => {
      for (const boardEl of widgetsEl.querySelectorAll(".wboard")) {
        const gap = parseFloat(getComputedStyle(boardEl).rowGap) || 0;
        const rowH = Math.max(34, (boardEl.clientHeight - gap * (state.rowsShown - 1)) / state.rowsShown);
        boardEl.querySelectorAll(".row").forEach((r) => { r.style.height = rowH + "px"; });
      }
    });
  }

  if (!headerSet) {
    document.getElementById("totalNum").textContent = "—";
    document.getElementById("totalLbl").textContent = "";
  }

  updateStatus();
}

function updateStatus() {
  const dot = document.getElementById("liveDot");
  const timeEl = document.getElementById("syncTime");
  const rowsEl = document.getElementById("syncRows");
  if (latest?.updatedAt?.toDate) {
    const t = latest.updatedAt.toDate();
    timeEl.textContent = "Synced " + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    // Sync runs every 2 min — flag if the data is > 20 min old.
    dot.classList.toggle("stale", Date.now() - t.getTime() > 20 * 60_000);
  }
  const warn = latest?.warnings?.length ? latest.warnings[0] : "";
  rowsEl.textContent =
    (latest?.rowCount != null ? latest.rowCount.toLocaleString() + " rows" : "live data") +
    (warn ? " ⚠" : "");
  document.getElementById("syncChip").title = warn;
}

/* ── Sidebar ── */
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
document.getElementById("menuBtn").addEventListener("click", openSidebar);
document.getElementById("brand").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
backdrop.addEventListener("click", () => { closeSidebar(); closeEditor(); });

function openSidebar() {
  renderSidebar();
  sidebar.classList.remove("hidden");
  backdrop.classList.remove("hidden");
}
function closeSidebar() {
  sidebar.classList.add("hidden");
  if (picker.classList.contains("hidden")) backdrop.classList.add("hidden");
}

function sideItem(it, isChild) {
  const el = document.createElement("div");
  el.className = "side-item" + (isChild ? " side-child" : "") +
    ((state.title || CFG.TITLE) === it.name ? " active" : "");

  const nameBtn = document.createElement("button");
  nameBtn.className = "side-name";
  nameBtn.textContent = (isChild ? "↳ " : "") + it.name;
  nameBtn.addEventListener("click", () => { switchTo(it.state); closeSidebar(); });
  el.appendChild(nameBtn);

  if (editMode) {
    const edit = document.createElement("button");
    edit.className = "side-act";
    edit.textContent = "✎";
    edit.title = it.idx == null ? "Customize (saves as a new dashboard)" : "Edit dashboard";
    edit.addEventListener("click", () => { closeSidebar(); openEditor(it.state, it.idx); });
    el.appendChild(edit);
  }

  if (editMode && it.idx != null) {
    const del = document.createElement("button");
    del.className = "side-act del";
    del.textContent = "✕";
    del.title = "Delete dashboard";
    del.addEventListener("click", () => {
      const ds = getDashboards();
      ds.splice(it.idx, 1);
      setDashboards(ds);
      renderSidebar();
    });
    el.appendChild(del);
  }
  return el;
}

function renderSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  const ds = getDashboards().map((d, idx) => ({ name: d.title, state: d, idx, id: d.id, parentId: d.parentId }));
  const topIds = new Set(ds.filter((d) => !d.parentId).map((d) => d.id));
  // Orphans (parent was deleted) surface at top level rather than vanish.
  const tops = ds.filter((d) => !d.parentId || !topIds.has(d.parentId));
  list.appendChild(sideItem({ name: CFG.TITLE, state: structuredClone(DEFAULT_STATE), idx: null }, false));
  for (const top of tops) {
    list.appendChild(sideItem(top, false));
    for (const child of ds.filter((d) => d.parentId && d.parentId === top.id)) {
      list.appendChild(sideItem(child, true));
    }
  }
}

document.getElementById("newDashBtn").addEventListener("click", () => {
  closeSidebar();
  openEditor({ ...structuredClone(DEFAULT_STATE), title: "" }, null);
});

/* ── Edit unlock (bottom of sidebar) ── */
let editMode = false;
const sideKey = document.getElementById("sideKey");
const unlockBtn = document.getElementById("editUnlockBtn");

async function verifyAdminKey(key) {
  // Posting the current list back is a no-op write that doubles as a key
  // check (and migrates any local-only dashboards up on first unlock).
  const resp = await fetch(CFG.DASH_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, dashboards: getDashboards() }),
  });
  return (await resp.json()).ok === true;
}

async function tryUnlock(key) {
  unlockBtn.textContent = "Checking…";
  let ok = false;
  try { ok = await verifyAdminKey(key); } catch { ok = false; }
  if (ok) {
    editMode = true;
    localStorage.setItem("tvAdminKey", key);
    sideKey.classList.add("hidden");
    unlockBtn.textContent = "🔓 Editing unlocked";
    unlockBtn.disabled = true;
    document.getElementById("newDashBtn").classList.remove("hidden");
    document.getElementById("gearBtn").classList.remove("hidden");
    renderSidebar();
  } else {
    unlockBtn.textContent = "🔒 Wrong key — try again";
    sideKey.classList.remove("hidden");
    sideKey.focus();
  }
}

unlockBtn.addEventListener("click", () => {
  if (editMode) return;
  const typed = sideKey.value.trim();
  const stored = (localStorage.getItem("tvAdminKey") || "").trim();
  if (typed) tryUnlock(typed);
  else if (sideKey.classList.contains("hidden") && stored) tryUnlock(stored);
  else {
    sideKey.classList.remove("hidden");
    sideKey.focus();
  }
});
sideKey.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && sideKey.value.trim()) tryUnlock(sideKey.value.trim());
});

/* ── Dashboard editor ── */
const picker = document.getElementById("picker");
let editorIdx = null; // index into saved dashboards, or null = save as new
document.getElementById("gearBtn").addEventListener("click", () => {
  const ds = getDashboards();
  let idx = state.id ? ds.findIndex((d) => d.id === state.id) : -1;
  if (idx === -1) idx = ds.findIndex((d) => d.title === state.title);
  openEditor(state, idx === -1 ? null : idx);
});
document.getElementById("pickerClose").addEventListener("click", closeEditor);

function closeEditor() {
  picker.classList.add("hidden");
  if (sidebar.classList.contains("hidden")) backdrop.classList.add("hidden");
}

function uniqueValues(field) {
  const seen = new Map();
  for (const r of latest?.rows || []) {
    const v = String(r[field] ?? "").trim();
    if (v) seen.set(v.toLowerCase(), v);
  }
  return [...seen.values()].sort((a, b) => a.localeCompare(b)).slice(0, 300);
}

function makeSelect(options, value, allLabel) {
  const sel = document.createElement("select");
  if (allLabel != null) {
    const o = document.createElement("option");
    o.value = "";
    o.textContent = allLabel;
    sel.appendChild(o);
  }
  const entries = Array.isArray(options) ? options.map((v) => [v, v]) : Object.entries(options);
  for (const [val, text] of entries) {
    const o = document.createElement("option");
    o.value = val;
    o.textContent = String(text).replace(/_/g, " ");
    sel.appendChild(o);
  }
  if (value != null) {
    sel.value = value;
    if (sel.value !== value && value !== "") { // preserve values missing from options
      const o = document.createElement("option");
      o.value = value;
      o.textContent = value;
      sel.appendChild(o);
      sel.value = value;
    }
  }
  return sel;
}

function labeled(text, el) {
  const label = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = text;
  label.append(span, el);
  return label;
}

// Checkbox dropdown for dashboard filters — pick any number of values
// (none checked = All).
function makeMultiSelect(field, values, selected) {
  const wrap = document.createElement("div");
  wrap.className = "msel";
  wrap.dataset.field = field;
  const sel = new Set((Array.isArray(selected) ? selected : selected ? [selected] : []).map(String));

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "msel-btn";
  const drop = document.createElement("div");
  drop.className = "msel-drop hidden";
  drop.addEventListener("click", (e) => e.stopPropagation());

  const summary = () => {
    const arr = [...sel];
    btn.textContent = arr.length === 0 ? "All"
      : arr.length === 1 ? arr[0]
      : `${arr[0]} +${arr.length - 1} more`;
  };

  const allCb = document.createElement("input");
  allCb.type = "checkbox";
  allCb.checked = sel.size === 0;
  const allOpt = document.createElement("label");
  allOpt.className = "msel-opt";
  allOpt.append(allCb, document.createTextNode(" All"));
  allCb.addEventListener("change", () => {
    sel.clear();
    drop.querySelectorAll("input").forEach((c) => { if (c !== allCb) c.checked = false; });
    allCb.checked = true;
    summary();
  });
  drop.appendChild(allOpt);

  for (const v of values) {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = sel.has(v);
    const opt = document.createElement("label");
    opt.className = "msel-opt";
    opt.append(cb, document.createTextNode(" " + v));
    cb.addEventListener("change", () => {
      if (cb.checked) sel.add(v); else sel.delete(v);
      allCb.checked = sel.size === 0;
      summary();
    });
    drop.appendChild(opt);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".msel-drop").forEach((d) => { if (d !== drop) d.classList.add("hidden"); });
    drop.classList.toggle("hidden");
  });

  wrap._read = () => [...sel];
  wrap.append(btn, drop);
  summary();
  return wrap;
}
document.addEventListener("click", () =>
  document.querySelectorAll(".msel-drop").forEach((d) => d.classList.add("hidden")));

function openEditor(source, idx) {
  editorIdx = idx;
  const s = normalizeState(structuredClone(source));
  document.getElementById("editorTitle").textContent = idx == null ? "New dashboard" : "Edit dashboard";
  document.getElementById("saveName").value = idx == null ? (source.title === CFG.TITLE ? "" : source.title || "") : s.title;
  document.getElementById("selView").value = s.view;
  document.getElementById("selScroll").value = s.autoScroll ? "on" : "off";
  document.getElementById("selTheme").value = s.theme || "default";
  document.getElementById("selGoal").value = s.goal || "";
  document.getElementById("selCStart").value = s.contestStart || "";
  document.getElementById("selCEnd").value = s.contestEnd || "";
  document.getElementById("selCele").value = s.celebrate === false ? "off" : "on";
  document.getElementById("selRows").value = String(s.rowsShown || 0);

  // Parent choices: top-level saved dashboards (by id), excluding itself.
  const parentSel = document.getElementById("selParent");
  parentSel.replaceChildren();
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "None (top level)";
  parentSel.appendChild(none);
  for (const d of getDashboards()) {
    if (d.parentId || d.id === source.id) continue;
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = d.title;
    parentSel.appendChild(o);
  }
  parentSel.value = source.parentId || "";
  if (parentSel.value !== (source.parentId || "")) parentSel.value = "";

  // Dashboard-level filters — multi-select (any-of within a field)
  const grid = document.getElementById("pickerGrid");
  grid.querySelectorAll("label.dyn").forEach((el) => el.remove());
  for (const f of [CFG.agentField, ...(latest?.filterFields || [])]) {
    const cur = s.filters[f];
    const base = uniqueValues(f);
    const extras = (Array.isArray(cur) ? cur : cur ? [cur] : []).filter((v) => !base.includes(v));
    const ms = makeMultiSelect(f, [...base, ...extras], cur);
    const label = labeled(f.replace(/_/g, " "), ms);
    label.className = "dyn";
    grid.appendChild(label);
  }

  // Widgets
  const list = document.getElementById("widgetsList");
  list.innerHTML = "";
  for (const w of s.widgets) list.appendChild(widgetRow(w));

  document.getElementById("agentsEditor").classList.add("hidden");
  picker.classList.remove("hidden");
  backdrop.classList.remove("hidden");
}

function widgetRow(w) {
  const row = document.createElement("div");
  row.className = "wrow";

  const fields = latest?.filterFields || [];
  const typeSel = makeSelect(WIDGET_TYPES, w.type);
  const metricSel = makeSelect(METRICS, METRICS[w.metric] ? w.metric : "revenue");
  const fieldSel = makeSelect(fields, w.field || (fields[0] || ""));
  const fFieldSel = makeSelect(fields, w.ffield || "", "No widget filter");
  const fValueSel = makeSelect(w.ffield ? uniqueValues(w.ffield) : [], w.fvalue || "", "All");
  const labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.placeholder = "Label (optional)";
  labelInput.value = w.label || "";
  const del = document.createElement("button");
  del.className = "w-del";
  del.textContent = "✕";
  del.title = "Remove widget";
  del.addEventListener("click", () => row.remove());

  function syncVisibility() {
    // Avg $/App and Active Reps only make sense for KPI tiles.
    for (const m of KPI_ONLY_METRICS) {
      metricSel.querySelector(`option[value="${m}"]`).hidden = typeSel.value !== "kpi";
    }
    if (typeSel.value !== "kpi" && KPI_ONLY_METRICS.includes(metricSel.value)) metricSel.value = "revenue";
    fieldSel.parentElement.style.visibility = typeSel.value === "breakdown" ? "visible" : "hidden";
  }
  typeSel.addEventListener("change", syncVisibility);
  fFieldSel.addEventListener("change", () => {
    const fresh = makeSelect(fFieldSel.value ? uniqueValues(fFieldSel.value) : [], "", "All");
    fresh.className = fValueSel.className;
    fValueSel.replaceChildren(...fresh.childNodes);
    fValueSel.value = "";
  });

  row.append(
    labeled("Widget", typeSel),
    labeled("KPI", metricSel),
    labeled("Break down by", fieldSel),
    labeled("Widget filter", fFieldSel),
    labeled("Filter value", fValueSel),
    labeled("Label", labelInput),
    del,
  );
  row._read = () => {
    const out = { type: typeSel.value, metric: metricSel.value };
    if (out.type === "breakdown") out.field = fieldSel.value;
    if (fFieldSel.value && fValueSel.value) { out.ffield = fFieldSel.value; out.fvalue = fValueSel.value; }
    if (labelInput.value.trim()) out.label = labelInput.value.trim();
    return out;
  };
  syncVisibility();
  return row;
}

document.getElementById("addWidgetBtn").addEventListener("click", () => {
  document.getElementById("widgetsList").appendChild(widgetRow({ type: "leaderboard", metric: "revenue" }));
});

function editorToState(title) {
  const filters = {};
  document.querySelectorAll("#pickerGrid .msel").forEach((m) => {
    const vals = m._read();
    if (vals.length) filters[m.dataset.field] = vals.length === 1 ? vals[0] : vals;
  });
  const widgets = [...document.querySelectorAll("#widgetsList .wrow")].map((r) => r._read());
  const out = normalizeState({
    title: title || CFG.TITLE,
    view: document.getElementById("selView").value,
    autoScroll: document.getElementById("selScroll").value === "on",
    theme: document.getElementById("selTheme").value,
    goal: Number(document.getElementById("selGoal").value) || 0,
    contestStart: document.getElementById("selCStart").value || "",
    contestEnd: document.getElementById("selCEnd").value || "",
    celebrate: document.getElementById("selCele").value !== "off",
    rowsShown: Number(document.getElementById("selRows").value) || 0,
    filters,
    widgets,
  });
  const parentId = document.getElementById("selParent").value;
  if (parentId) out.parentId = parentId;
  else delete out.parentId;
  return out;
}

document.getElementById("applyBtn").addEventListener("click", () => {
  switchTo(editorToState(document.getElementById("saveName").value.trim() || state.title));
  closeEditor();
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const nameInput = document.getElementById("saveName");
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  const d = editorToState(name);
  const ds = getDashboards();
  // Keep the stable id across edits; new dashboards mint one.
  d.id = (editorIdx != null && ds[editorIdx]?.id) || crypto.randomUUID();
  if (editorIdx != null && ds[editorIdx]) ds[editorIdx] = d;
  else ds.push(d);
  setDashboards(ds);
  switchTo(d);
  closeEditor();
});

/* ── Agent editor (names + photos, saved to Firestore via the admin
      endpoint) ── */
const adminKeyInput = document.getElementById("adminKey");
adminKeyInput.value = localStorage.getItem("tvAdminKey") || "";
adminKeyInput.addEventListener("change", () => localStorage.setItem("tvAdminKey", adminKeyInput.value.trim()));

document.getElementById("agentsToggle").addEventListener("click", () => {
  const ed = document.getElementById("agentsEditor");
  ed.classList.toggle("hidden");
  if (!ed.classList.contains("hidden")) renderAgentsEditor();
});

function agentKeys() {
  const set = new Map();
  for (const r of latest?.rows || []) {
    const a = r[CFG.agentField];
    if (a) set.set(slugOf(a), a);
  }
  return [...set.values()].sort((a, b) => a.localeCompare(b));
}

const agentSearch = document.getElementById("agentSearch");
agentSearch.addEventListener("input", renderAgentsEditor);

// Downscale to a small square JPEG data URI so profiles stay tiny.
function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S = 160;
      const canvas = document.createElement("canvas");
      canvas.width = S; canvas.height = S;
      const scale = Math.max(S / img.width, S / img.height);
      const w = img.width * scale, h = img.height * scale;
      canvas.getContext("2d").drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("Could not read that image file."));
    img.src = URL.createObjectURL(file);
  });
}

async function saveProfile(agent, name, photo, goal, btn) {
  const key = adminKeyInput.value.trim();
  if (!key) { adminKeyInput.focus(); return; }
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    const resp = await fetch(CFG.PROFILE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, agent, name, photo, goal }),
    });
    const out = await resp.json();
    if (!out.ok) throw new Error(out.error || "Save failed");
    btn.textContent = "Saved ✓";
  } catch (e) {
    btn.textContent = "Error";
    alert("Save failed: " + e.message);
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = "Save"; }, 2000);
  }
}

function renderAgentsEditor() {
  const list = document.getElementById("agentsList");
  list.innerHTML = "";
  const q = agentSearch.value.trim().toLowerCase();
  const matches = agentKeys().filter((a) =>
    !q || a.toLowerCase().includes(q) || displayNameOf(a).toLowerCase().includes(q));
  for (const agent of matches) {
    const rowEl = document.createElement("div");
    rowEl.className = "agent-row";

    const av = document.createElement("div");
    av.className = "avatar";
    const photo = photoOf(agent);
    if (photo) {
      const img = document.createElement("img");
      img.src = photo;
      av.appendChild(img);
    } else {
      av.textContent = initialsOf(displayNameOf(agent));
    }

    const orig = document.createElement("div");
    orig.className = "orig";
    orig.title = agent;
    orig.textContent = agent;

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Display name / nickname";
    nameInput.value = profiles.get(slugOf(agent))?.name || "";

    const goalInput = document.createElement("input");
    goalInput.type = "number";
    goalInput.min = "0";
    goalInput.placeholder = "Goal $/mo (optional)";
    goalInput.value = profiles.get(slugOf(agent))?.goal || "";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    let pendingPhoto = null;
    fileInput.addEventListener("change", async () => {
      if (!fileInput.files[0]) return;
      try {
        pendingPhoto = await resizePhoto(fileInput.files[0]);
        av.textContent = "";
        av.innerHTML = "";
        const img = document.createElement("img");
        img.src = pendingPhoto;
        av.appendChild(img);
      } catch (e) { alert(e.message); }
    });

    const btn = document.createElement("button");
    btn.textContent = "Save";
    btn.addEventListener("click", () =>
      saveProfile(agent, nameInput.value.trim(), pendingPhoto, Number(goalInput.value) || 0, btn));

    rowEl.append(av, orig, nameInput, goalInput, fileInput, btn);
    list.appendChild(rowEl);
  }
}

/* ── Gentle auto-scroll (per-dashboard toggle) ──────────────────────────────
   Pause at the top, drift down through the full list, pause at the bottom,
   snap back, repeat. Any manual wheel/touch input pauses it briefly. */
const scrollMemo = new WeakMap(); // board element → {pauseUntil, atBottom}
let manualPauseUntil = 0;
const SCROLL_STEP = 1.4;        // px per 50ms tick ≈ 28 px/s
const TOP_PAUSE_MS = 6000;
const BOTTOM_PAUSE_MS = 5000;
const MANUAL_PAUSE_MS = 20_000;

document.getElementById("widgets").addEventListener("wheel", () => { manualPauseUntil = Date.now() + MANUAL_PAUSE_MS; }, { passive: true });
document.getElementById("widgets").addEventListener("touchstart", () => { manualPauseUntil = Date.now() + MANUAL_PAUSE_MS; }, { passive: true });

setInterval(() => {
  if (!state.autoScroll) return;
  const now = Date.now();
  if (now < manualPauseUntil) return;
  for (const el of document.querySelectorAll(".wboard")) {
    if (el.scrollHeight <= el.clientHeight + 4) continue; // everything fits
    let st = scrollMemo.get(el);
    if (!st) { st = { pauseUntil: now + TOP_PAUSE_MS, atBottom: false }; scrollMemo.set(el, st); }
    if (now < st.pauseUntil) continue;
    const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
    if (atEnd) {
      if (!st.atBottom) {
        st.atBottom = true;
        st.pauseUntil = now + BOTTOM_PAUSE_MS;
      } else {
        el.scrollTop = 0;
        st.atBottom = false;
        st.pauseUntil = now + TOP_PAUSE_MS;
      }
    } else {
      el.scrollTop += SCROLL_STEP;
    }
  }
}, 50);

/* ── Header date picker ── */
const drFrom = document.getElementById("drFrom");
const drTo = document.getElementById("drTo");
const drClear = document.getElementById("drClear");

function syncDatePicker() {
  drFrom.value = dateOverride?.start || "";
  drTo.value = dateOverride?.end || "";
  drClear.classList.toggle("hidden", !dateOverride);
}

function onDateInput() {
  const start = drFrom.value || "";
  const end = drTo.value || "";
  if (!start && !end) dateOverride = null;
  else if (start && end && start > end) return; // wait for a sane range
  else dateOverride = { start, end };
  if (dateOverride) localStorage.setItem("tvDateOverride", JSON.stringify(dateOverride));
  else localStorage.removeItem("tvDateOverride");
  syncDatePicker();
  render();
}
drFrom.addEventListener("change", onDateInput);
drTo.addEventListener("change", onDateInput);
drClear.addEventListener("click", () => {
  drFrom.value = "";
  drTo.value = "";
  onDateInput();
});
syncDatePicker();

/* ── Init ── */
applyState();

// Refresh date-frame boundary / staleness even when no new snapshot arrives.
setInterval(render, 60_000);

// Periodic hard reload for always-on TVs.
setTimeout(() => location.reload(), CFG.PAGE_RELOAD_MS);
</script>
