<style>
:root {
  --bg: #0b1220;
  --panel: #111a2e;
  --line: #1f2b45;
  --text: #f1f5f9;
  --dim: #8ea0bd;
  --accent: #2dd4bf;
  --accent-dim: #14b8a6;
  --gold: #fbbf24;
  --silver: #cbd5e1;
  --bronze: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  gap: 1.2vw;
  padding: 1.6vh 2.2vw;
  border-bottom: 1px solid var(--line);
}
.menu-btn, .gear {
  background: none; border: 1px solid var(--line); border-radius: .8vh;
  color: var(--dim); font-size: 2.2vh; cursor: pointer; padding: .4vh 1vw;
  white-space: nowrap;
}
.menu-btn:hover, .gear:hover { color: var(--accent); border-color: var(--accent-dim); }
.brand { font-size: 2.4vh; font-weight: 800; letter-spacing: .14em; color: var(--dim); cursor: pointer; }
.view-badge {
  font-size: 2.4vh; font-weight: 800; letter-spacing: .06em;
  color: var(--accent);
  padding: .4vh 1.2vw;
  border: 1px solid var(--accent-dim);
  border-radius: 999px;
  text-align: center;
}
.spacer { flex: 1; }
.total-box { text-align: right; }
.total-num { font-size: 5vh; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.total-lbl { font-size: 1.6vh; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; margin-top: .4vh; }

main { flex: 1; padding: 1.4vh 2.2vw; display: flex; flex-direction: column; gap: 1.4vh; min-height: 0; }

/* KPI tiles */
.kpi-row { display: flex; gap: 1.2vw; }
.kpi-row:empty { display: none; }
.kpi-tile {
  flex: 1;
  background: var(--panel); border: 1px solid var(--line); border-radius: 1.2vh;
  padding: 1.6vh 1.5vw;
  display: flex; flex-direction: column; gap: .6vh;
}
.kpi-num { font-size: 5vh; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-lbl { font-size: 1.7vh; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }

/* Board widgets */
.widgets { flex: 1; display: grid; gap: 1.4vw; min-height: 0; }
.widget { display: flex; flex-direction: column; gap: 1vh; min-height: 0; }
.widget h3 { font-size: 2vh; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; font-weight: 700; }
.widget .wboard {
  flex: 1; display: flex; flex-direction: column; gap: 1vh;
  min-height: 0; overflow-y: auto; padding-right: .4vw;
}
.wboard::-webkit-scrollbar { width: .6vh; }
.wboard::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
.wboard::-webkit-scrollbar-track { background: transparent; }

.row {
  display: grid;
  grid-template-columns: 3.2vw 6vh 1fr minmax(9vw, auto);
  align-items: center;
  gap: .9vw;
  flex: 0 0 auto;
  height: 7.2vh;
}
.row.noav { grid-template-columns: 3.2vw 1fr minmax(9vw, auto); }
.rank { font-size: 2.7vh; font-weight: 800; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); } .rank.r3 { color: var(--bronze); }
.avatar {
  width: 6vh; height: 6vh;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2vh; font-weight: 800; color: var(--dim);
  overflow: hidden; position: relative;
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bar-wrap { position: relative; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 1.2vh; overflow: hidden; }
.bar {
  position: absolute; inset: 0 auto 0 0;
  background: linear-gradient(90deg, rgba(20,184,166,.55), rgba(45,212,191,.25));
  border-right: 2px solid var(--accent);
  transition: width .9s cubic-bezier(.2,.8,.2,1);
}
.row:first-child .bar { background: linear-gradient(90deg, rgba(251,191,36,.45), rgba(251,191,36,.15)); border-right-color: var(--gold); }
.name {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding-left: 1.2vw;
  font-size: 2.7vh; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.apps { font-size: 2.9vh; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.sub { font-size: 1.5vh; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.more { text-align: center; color: var(--dim); font-size: 1.9vh; padding: .5vh 0; }

/* ── Kart Race theme (leaderboard widgets) ── */
.row.race { grid-template-columns: 3.2vw 1fr minmax(9vw, auto); }
.track {
  position: relative; height: 100%;
  background: linear-gradient(180deg, #141c30, #0e1526);
  border: 1px solid var(--line); border-radius: 1.2vh;
  overflow: hidden;
}
.track::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%;
  border-top: .4vh dashed rgba(255, 255, 255, .14);
}
.track .finish {
  position: absolute; right: 0; top: 0; bottom: 0; width: 1.8vw;
  background: repeating-conic-gradient(#e2e8f0 0% 25%, #0b1220 0% 50%) 0 0 / 1.5vh 1.5vh;
  opacity: .9;
}
.kart {
  position: absolute; top: 50%; transform: translateY(-54%);
  display: flex; flex-direction: column; align-items: center;
  transition: left 1.2s cubic-bezier(.2, .8, .2, 1);
  z-index: 2;
}
.kart .avatar { width: 4.2vh; height: 4.2vh; font-size: 1.6vh; border-color: var(--accent-dim); z-index: 1; }
.kart-emoji { font-size: 2.8vh; line-height: 1; margin-top: -1.4vh; transform: scaleX(-1); }
.kart .item { position: absolute; top: -1.9vh; font-size: 1.9vh; }
.lane-name {
  position: absolute; left: .8vw; top: 50%; transform: translateY(-50%);
  z-index: 1;
  color: var(--text);
  background: rgba(11, 18, 32, .92);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: .5vh 1.2vw;
  font-size: 2.1vh; font-weight: 800; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
}
.row.race:first-child .track { border-color: var(--gold); }
.row.race:first-child .lane-name { color: var(--gold); border-color: rgba(251, 191, 36, .5); }

/* ── TemmenKart full-page theme (active while a race dashboard shows) ── */
.tk-letter {
  display: inline-block;

/* ── Temmen Madness full-page theme — tournament broadcast look ─────────────
   Charcoal shield + teal from the logo, bracket-blue accents, scoreboard
   KPI tiles, seed badges, and baskets that build toward the trophy. */
body.temmenmadness {
  --bg: #171c23;
  --panel: #232a34;
  --line: #3a4553;
  --text: #f0f4f8;
  --dim: #8fa0b3;
  --accent: #2dd4bf;
  --accent-dim: #14b8a6;
  background:
    radial-gradient(70vw 40vh at 50% -12%, rgba(45, 212, 191, .14), transparent),
    repeating-linear-gradient(135deg, transparent 0 3.2vh, rgba(255, 255, 255, .018) 3.2vh 6.4vh),
    var(--bg);
}
body.temmenmadness header {
  position: relative;
  background: linear-gradient(180deg, #262e39, #1d242d);
  border-bottom: .45vh solid #2dd4bf;
  box-shadow: 0 .5vh 1.4vh rgba(0, 0, 0, .5);
}
body.temmenmadness header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -.95vh; height: .5vh;
  background: repeating-linear-gradient(90deg, #1d6fd1 0 4vw, transparent 4vw 5.2vw);
}
body.temmenmadness .brand {
  color: #fff;
  font-size: 3.2vh; font-weight: 900; font-style: italic;
  letter-spacing: .06em; text-transform: uppercase;
  text-shadow: .25vh .35vh 0 rgba(0, 0, 0, .6), 0 0 2.4vh rgba(45, 212, 191, .35);
}
body.temmenmadness .brand::before { content: "🏀 "; font-style: normal; text-shadow: none; }
body.temmenmadness .menu-btn, body.temmenmadness .gear {
  background: #1d242d; border: 1px solid #3a4553; color: #8fa0b3; border-radius: .6vh;
}
body.temmenmadness .view-badge {
  background: #1d6fd1; color: #fff; border: none;
  font-style: italic; font-weight: 900;
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
  border-radius: 0; padding: .6vh 1.6vw;
}
body.temmenmadness .total-num { color: #fff; text-shadow: 0 0 2.4vh rgba(45, 212, 191, .5); }

/* scoreboard tiles */
body.temmenmadness .kpi-tile {
  background: linear-gradient(180deg, #10151b, #171d25);
  border: 2px solid #2dd4bf; border-radius: .8vh;
  box-shadow: 0 0 1.6vh rgba(45, 212, 191, .18), inset 0 .3vh 0 rgba(255, 255, 255, .06);
}
body.temmenmadness .kpi-num {
  color: #fff; text-shadow: 0 0 2vh rgba(45, 212, 191, .55);
}
body.temmenmadness .kpi-lbl { color: #2dd4bf; font-style: italic; font-weight: 800; }

body.temmenmadness .widget h3 {
  color: #fff; font-style: italic; transform: skewX(-6deg); transform-origin: left;
  border-bottom: .35vh solid #1d6fd1; padding-bottom: .5vh; align-self: flex-start;
}
body.temmenmadness .widget h3::before { content: "🏀 "; font-style: normal; }

/* seed badges */
body.temmenmadness .rank {
  background: #10151b; color: #8fa0b3; border: 1px solid #3a4553;
  border-radius: .5vh; width: 4.4vh; height: 4.4vh; line-height: 4.2vh;
  font-size: 2.1vh; font-style: italic; justify-self: center;
}
body.temmenmadness .rank.r1 { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 1.2vh rgba(251, 191, 36, .4); }
body.temmenmadness .rank.r2 { color: var(--silver); border-color: var(--silver); }
body.temmenmadness .rank.r3 { color: var(--bronze); border-color: var(--bronze); }

body.temmenmadness .avatar { border-color: #2dd4bf; background: #10151b; }
body.temmenmadness .bar-wrap {
  background: #10151b; border: 1px solid #3a4553; border-radius: .6vh;
}
body.temmenmadness .bar {
  background: linear-gradient(90deg, rgba(45, 212, 191, .5), rgba(29, 111, 209, .3));
  border-right: 2px solid #2dd4bf;
}
body.temmenmadness .row:first-child .bar {
  background: linear-gradient(90deg, rgba(251, 191, 36, .45), rgba(29, 111, 209, .25));
  border-right-color: var(--gold);
}
body.temmenmadness .row:first-child .bar-wrap { border-color: rgba(251, 191, 36, .55); }
body.temmenmadness .name { font-style: italic; font-weight: 800; padding-right: 13vw; }
body.temmenmadness .houses {
  position: absolute; right: 1vw; top: 50%; transform: translateY(-50%);
  font-size: 2.3vh; letter-spacing: .15vw;
  filter: drop-shadow(0 0 .8vh rgba(45, 212, 191, .4));
}
body.temmenmadness footer {
  background: #1d242d; border-top: 1px solid #3a4553;
}
body.temmenmadness .dot { box-shadow: 0 0 1vh rgba(45, 212, 191, .8); }

footer {
  display: flex; align-items: center; gap: 1vw;
  padding: 1.2vh 2.2vw;
  border-top: 1px solid var(--line);
  color: var(--dim); font-size: 1.7vh;
}
.dot { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--accent); }
.dot.stale { background: #ef4444; }

.overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 2vh;
  background: var(--bg);
  text-align: center; padding: 4vw;
  z-index: 5;
}
.overlay h1 { font-size: 4vh; }
.overlay p { color: var(--dim); font-size: 2.2vh; max-width: 70vw; line-height: 1.5; }
.hidden { display: none !important; }

/* ── Sidebar ── */
.backdrop { position: fixed; inset: 0; background: rgba(4,8,18,.7); z-index: 15; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 16;
  width: min(28vw, 420px);
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1.6vh;
  padding: 2.4vh 1.4vw;
  overflow-y: auto;
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; }
.sidebar-head h2 { font-size: 2.6vh; letter-spacing: .08em; }
.sidebar-head button { background: none; border: none; color: var(--dim); font-size: 3vh; cursor: pointer; }
.side-item {
  display: flex; align-items: center; gap: .6vw;
  background: var(--bg); border: 1px solid var(--line); border-radius: 1vh;
  padding: 1.4vh 1vw;
}
.side-item.active { border-color: var(--accent-dim); }
.side-item .side-name {
  flex: 1; text-align: left;
  background: none; border: none; color: var(--text);
  font-size: 2.2vh; font-weight: 700; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.side-item.active .side-name { color: var(--accent); }
.side-item .side-act { background: none; border: none; color: var(--dim); font-size: 2.2vh; cursor: pointer; padding: 0 .4vw; }
.side-item .side-act:hover { color: var(--accent); }
.side-item .side-act.del:hover { color: #ef4444; }
.side-child { margin-left: 2vw; }
.side-child .side-name { font-size: 2vh; font-weight: 600; }
.side-new {
  background: var(--accent-dim); border: none; border-radius: 1vh; color: #04121a;
  font-size: 2.2vh; font-weight: 800; padding: 1.4vh; cursor: pointer;
}
.side-lock {
  background: none; border: 1px solid var(--line); border-radius: 1vh;
  color: var(--dim); font-size: 2vh; font-weight: 700; padding: 1.2vh; cursor: pointer;
}
.side-lock:hover { color: var(--accent); border-color: var(--accent-dim); }
.sidebar input#sideKey {
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: .8vh; padding: 1vh; font-size: 2vh;
}

/* ── Dashboard editor ── */
.picker {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(4, 8, 18, .8);
  display: flex; align-items: center; justify-content: center;
}
.picker-panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 1.6vh;
  padding: 3vh 2vw; width: min(88vw, 1300px); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 2vh;
}
.picker-head { display: flex; align-items: center; justify-content: space-between; }
.picker-head h2 { font-size: 2.6vh; letter-spacing: .06em; }
.picker-head button { background: none; border: none; color: var(--dim); font-size: 3vh; cursor: pointer; }
.picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.4vh 1.2vw; }
.picker-grid label, .wrow label { display: flex; flex-direction: column; gap: .5vh; font-size: 1.7vh; color: var(--dim); text-transform: capitalize; }
.picker select, .picker input[type="text"], .picker input[type="password"] {
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: .8vh; padding: .9vh 1vw; font-size: 1.9vh; width: 100%;
}
.picker-actions { display: flex; gap: 1vw; align-items: center; border-top: 1px solid var(--line); padding-top: 1.8vh; }
.picker-actions input { flex: 1; }
.picker-actions button {
  background: var(--accent-dim); border: none; border-radius: .8vh; color: #04121a;
  font-size: 2vh; font-weight: 700; padding: 1vh 1.8vw; cursor: pointer; white-space: nowrap;
}
.picker-actions button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.section-title { font-size: 2vh; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; font-weight: 700; }

.wrow {
  display: grid;
  grid-template-columns: 1.2fr 1.2fr 1.4fr 1.4fr 1.4fr 1.6fr auto;
  gap: .8vw; align-items: end;
  padding: 1vh 0; border-bottom: 1px solid var(--line);
}
.wrow .w-del { background: none; border: none; color: var(--dim); font-size: 2.4vh; cursor: pointer; padding-bottom: .8vh; }
.wrow .w-del:hover { color: #ef4444; }
.add-widget {
  align-self: flex-start;
  background: var(--bg); color: var(--accent); border: 1px dashed var(--accent-dim);
  border-radius: .8vh; font-size: 1.9vh; font-weight: 700; padding: .9vh 1.5vw; cursor: pointer;
}

#agentsList { display: flex; flex-direction: column; }
.agent-row {
  display: grid; grid-template-columns: 6vh 1fr 1fr auto auto; gap: 1vw;
  align-items: center; padding: 1vh 0; border-bottom: 1px solid var(--line); font-size: 2vh;
}
.agent-row .avatar { width: 5.5vh; height: 5.5vh; font-size: 1.8vh; }
.agent-row .orig { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-row input[type="file"] { color: var(--dim); font-size: 1.6vh; max-width: 16vw; }
.agent-row button {
  background: var(--accent-dim); border: none; border-radius: .8vh; color: #04121a;
  font-weight: 700; font-size: 1.8vh; padding: .9vh 1.4vw; cursor: pointer;
}
.agent-row button:disabled { opacity: .5; cursor: default; }

/* ── Mobile (phones) — px-based compact layout instead of TV vh/vw ── */
@media (max-width: 700px) {
  body { overflow-y: auto; }
  header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
  .menu-btn, .gear { font-size: 15px; padding: 6px 10px; border-radius: 8px; }
  .brand { font-size: 16px; letter-spacing: .06em; flex: 1; min-width: 55%; }
  .view-badge { font-size: 12px; padding: 4px 10px; min-width: 0; }
  .total-box { display: none; } /* the KPI tiles carry the totals on phones */

  main { flex: 1 0 auto; height: auto; padding: 10px 12px; gap: 12px; }
  .kpi-row { flex-wrap: wrap; gap: 8px; }
  .kpi-tile { padding: 12px 14px; border-radius: 12px; flex: 1 1 40%; gap: 4px; }
  .kpi-num { font-size: 27px; }
  .kpi-lbl { font-size: 11px; letter-spacing: .08em; }

  .widgets { grid-template-columns: 1fr !important; gap: 16px; min-height: auto; }
  .widget { gap: 8px; }
  .widget h3 { font-size: 12px; }
  .widget .wboard { overflow: visible; padding-right: 0; gap: 8px; } /* page scrolls instead */

  .row { grid-template-columns: 24px 42px 1fr auto; height: 52px; gap: 8px; }
  .row.noav { grid-template-columns: 24px 1fr auto; }
  .row.race { grid-template-columns: 24px 1fr auto; }
  .kart .avatar { width: 26px; height: 26px; font-size: 10px; }
  .kart-emoji { font-size: 17px; margin-top: -8px; }
  .kart .item { top: -12px; font-size: 12px; }
  .lane-name { font-size: 12px; left: 6px; padding: 3px 10px; }
  .track .finish { width: 14px; background-size: 10px 10px; }
  body.temmenkart .brand { font-size: 17px; }
  body.temmenkart .rank { width: 26px; height: 26px; line-height: 22px; font-size: 12px; }
  body.temmenkart .track::after { width: 8px; }
  body.temmenkart .lane-name { left: 14px; }
  body.temmenmadness .brand { font-size: 15px; }
  body.temmenmadness .rank { width: 26px; height: 26px; line-height: 24px; font-size: 12px; }
  body.temmenmadness .houses { font-size: 13px; right: 8px; }
  body.temmenmadness .name { padding-right: 80px; }
  body.temmenopoly .brand { font-size: 15px; }
  body.temmenopoly .houses { font-size: 13px; right: 8px; letter-spacing: 1px; }
  body.temmenopoly .name { padding-right: 80px; }
  body.temmenopoly .rank { font-size: 13px; padding: 3px 0; }
  body.temmenopoly .kpi-tile::before { margin: 0 -14px 6px; height: 12px; }
  .rank { font-size: 16px; }
  .avatar { width: 42px; height: 42px; font-size: 14px; }
  .bar-wrap { border-radius: 10px; }
  .name { font-size: 15px; padding-left: 10px; }
  .apps { font-size: 16px; }
  .sub { font-size: 10px; }
  .more { font-size: 13px; }
  footer { font-size: 11px; padding: 8px 12px; }
  .dot { width: 8px; height: 8px; }

  .sidebar { width: 86vw; padding: 16px 14px; }
  .sidebar-head h2 { font-size: 19px; }
  .side-item { padding: 12px 10px; }
  .side-item .side-name { font-size: 16px; }
  .side-child .side-name { font-size: 14px; }
  .side-new, .side-lock { font-size: 15px; padding: 12px; }
  .sidebar input#sideKey { font-size: 15px; padding: 10px; }

  .picker { align-items: flex-start; }
  .picker-panel { width: 94vw; max-height: 92vh; padding: 16px 14px; margin-top: 4vh; gap: 14px; }
  .picker-head h2 { font-size: 18px; }
  .picker-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .picker-grid label, .wrow label { font-size: 12px; }
  .picker select, .picker input[type="text"], .picker input[type="password"] { font-size: 14px; padding: 8px; }
  .picker-actions { flex-wrap: wrap; gap: 8px; padding-top: 12px; }
  .picker-actions button { font-size: 14px; padding: 9px 14px; }
  .section-title { font-size: 13px; }
  .wrow { grid-template-columns: 1fr 1fr; gap: 8px; }
  .wrow .w-del { font-size: 18px; justify-self: end; }
  .add-widget { font-size: 14px; padding: 8px 12px; }
  .agent-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .agent-row .avatar { width: 40px; height: 40px; }
  .agent-row .orig { flex: 1 1 100%; }
  .agent-row input[type="text"] { flex: 1 1 55%; font-size: 14px; padding: 8px; }
  .agent-row input[type="file"] { max-width: none; flex: 1 1 100%; font-size: 12px; }
  .agent-row button { font-size: 14px; padding: 8px 14px; }
}
</style>
</head>
<body>

<main>

</main>

<footer>

</footer>

<div class="overlay" id="overlay">
  <h1>Sales Leaderboard</h1>

</div>

<div class="backdrop hidden" id="backdrop"></div>
<aside class="sidebar hidden" id="sidebar">
  <div class="sidebar-head"><h2>Dashboards</h2><button id="sidebarClose" title="Close">✕</button></div>
  <div id="sidebarList" style="display:flex;flex-direction:column;gap:1vh"></div>

  <div id="editLock" style="display:flex;flex-direction:column;gap:1vh">

    <button class="side-lock" id="editUnlockBtn">🔒 Edit dashboards</button>
  </div>
</aside>

<div class="picker hidden" id="picker">
  <div class="picker-panel">
    <div class="picker-head"><h2 id="editorTitle">Edit dashboard</h2><button id="pickerClose" title="Close">✕</button></div>

    <div class="section-title">Dashboard</div>
    <div class="picker-grid" id="pickerGrid">
      <label><span>Date frame</span>
        <select id="selView">
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="mtd">MTD</option>
          <option value="ytd">YTD</option>

        </select>

        <select id="selTheme">

        <input id="agentSearch" type="text" placeholder="🔍 Search agents…">

      <div id="agentsList"></div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const CFG = window.TV_CONFIG;
const FB = window.FIREBASE_CONFIG;

const overlay = document.getElementById("overlay");
const overlayMsg = document.getElementById("overlayMsg");

if (FB.apiKey.startsWith("REPLACE_")) {
  overlayMsg.textContent = "firebaseConfig is not filled in yet — edit the CONFIG block in tv/index.html.";
  throw new Error("firebaseConfig placeholder");
}

/* ── Dashboard state ──────────────────────────────────────────────────────
   A dashboard is {title, view, filters, widgets[]}. Widgets:
     {type:"leaderboard", metric:"revenue"|"apps", label?, ffield?, fvalue?}
     {type:"kpi",        metric:"revenue"|"apps"|"avg", label?, ffield?, fvalue?}
     {type:"breakdown",  metric:"revenue"|"apps", field:<column>, label?, ffield?, fvalue?}
   ffield/fvalue are an optional widget-level filter on top of the
   dashboard-level filters. Active dashboard + saved list live in
   localStorage (per device); ?d=<json> makes a shareable link. */
const params = new URLSearchParams(location.search);
const NON_FILTER_PARAMS = ["title", "metric", "view", "retry", "d"];
const VIEWS = {
  today: "Today", week: "This Week", mtd: "MTD", ytd: "YTD",
  last_month: "Last Month", last_year: "Last Year", all: "All Time",
};
const WIDGET_TYPES = { leaderboard: "Leaderboard", kpi: "KPI tile", breakdown: "Breakdown" };
const METRICS = { revenue: "Revenue", apps: "Apps", avg: "Avg $ / App" };
const DEFAULT_STATE = {
  title: CFG.TITLE,
  view: "mtd",
  filters: {},
  widgets: [{ type: "kpi", metric: "revenue" }, { type: "kpi", metric: "apps" }, { type: "leaderboard", metric: "revenue" }],
};

function normalizeState(s) {
  const out = { ...structuredClone(DEFAULT_STATE), ...s };
  out.autoScroll = !!out.autoScroll;
  out.theme = ["race", "opoly", "madness"].includes(out.theme) ? out.theme : "default";
  if (!VIEWS[out.view]) out.view = "mtd";
  if (!Array.isArray(out.widgets) || !out.widgets.length) {
    out.widgets = structuredClone(DEFAULT_STATE.widgets);
  }
  out.widgets = out.widgets
    .filter((w) => WIDGET_TYPES[w?.type])
    .map((w) => ({ ...w, metric: METRICS[w.metric] ? w.metric : "revenue" }));
  if (typeof out.filters !== "object" || !out.filters) out.filters = {};
  return out;
}

function stateFromURL() {
  const d = params.get("d");
  if (d) {
    try { return normalizeState(JSON.parse(d)); } catch { /* bad link — ignore */ }
  }
  if (![...params.keys()].filter((k) => k !== "retry").length) return null;
  // Legacy simple links: ?metric=&view=&title=&<field>=<value>
  const s = structuredClone(DEFAULT_STATE);
  if (params.get("title")) s.title = params.get("title");
  const m = (params.get("metric") || "").toLowerCase();
  const v = (params.get("view") || "").toLowerCase();
  if (VIEWS[v]) s.view = v;
  s.widgets = [{ type: "leaderboard", metric: m === "apps" ? "apps" : "revenue" }];
  for (const [k, val] of params.entries()) {
    if (NON_FILTER_PARAMS.includes(k) || !val) continue;
    s.filters[k] = val;
  }
  return s;
}

function loadState() {
  const fromUrl = stateFromURL();
  if (fromUrl) return fromUrl;
  try {
    const saved = JSON.parse(localStorage.getItem("tvState"));
    if (saved) return normalizeState(saved);
  } catch { /* corrupted state — fall through to default */ }
  return structuredClone(DEFAULT_STATE);
}

let state = loadState();

function persistState() {
  localStorage.setItem("tvState", JSON.stringify(state));
  const link = JSON.stringify(state) === JSON.stringify(DEFAULT_STATE)
    ? location.pathname
    : location.pathname + "?d=" + encodeURIComponent(JSON.stringify(state));
  history.replaceState(null, "", link);
}

// Dashboards are shared across all screens via Firestore
// (tvDashboards/config). Until the first shared save happens, any
// dashboards saved on this device (pre-sharing) act as a local fallback —
// the next save migrates them up for everyone.
let sharedDashboards = null;

// Every dashboard gets a stable id, and sub-dashboards link to their parent
// by id — never by title, so renames can't break the nesting. Legacy
// title-based `parent` links migrate here (persisted on the next save).
function ensureIds(ds) {
  const byTitle = new Map(ds.map((d) => [d.title, d]));
  for (const d of ds) if (!d.id) d.id = crypto.randomUUID();
  for (const d of ds) {
    if (d.parent && !d.parentId) {
      const p = byTitle.get(d.parent);
      if (p && p !== d) d.parentId = p.id;
    }
    delete d.parent;
  }
  return ds;
}

function getDashboards() {
  if (sharedDashboards !== null) return ensureIds(structuredClone(sharedDashboards));
  try { return ensureIds(JSON.parse(localStorage.getItem("tvDashboards")) || []); } catch { return []; }
}

async function setDashboards(ds) {
  sharedDashboards = ds; // optimistic — every other screen updates via the snapshot
  localStorage.setItem("tvDashboards", JSON.stringify(ds));
  let key = (localStorage.getItem("tvAdminKey") || "").trim();
  if (!key) key = (prompt("Admin key (needed to save dashboards for all screens):") || "").trim();
  if (!key) {
    alert("Saved on this device only — enter the admin key to share dashboards with every screen.");
    return;
  }
  try {
    const resp = await fetch(CFG.DASH_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, dashboards: ds }),
    });
    const out = await resp.json();
    if (!out.ok) throw new Error(out.error || "Save failed");
    localStorage.setItem("tvAdminKey", key);
  } catch (e) {
    alert("Dashboards not synced to other screens: " + e.message);
  }
}

/* ── Agent profiles (names + photos, edited in-app) ── */
function slugOf(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function initialsOf(name) {
  return String(name).split(/\s+/).slice(0, 2).map((w) => (w[0] || "").toUpperCase()).join("").replace(/[^A-Z]/g, "");
}
let profiles = new Map(); // slug → {name, photo}
function displayNameOf(agent) { return profiles.get(slugOf(agent))?.name || agent; }
function photoOf(agent) { return profiles.get(slugOf(agent))?.photo || null; }

onSnapshot(collection(db, "tvProfiles"), (snap) => {

onSnapshot(doc(db, "tvDashboards", "config"), (snap) => {

// Data is split across docs: tvLeaderboard/current holds metadata, and
// tvLeaderboard/<yyyy-mm> docs each hold one month of rows. Merge them.
onSnapshot(collection(db, "tvLeaderboard"),
  (snap) => {
    let meta = null;
    const rows = [];
    snap.forEach((d) => {
      const data = d.data();
      if (d.id === "current") meta = data;
      else if (Array.isArray(data.rows)) rows.push(...data.rows);
    });
    if (!meta && !rows.length) {
      overlay.classList.remove("hidden");
      overlayMsg.textContent = "No leaderboard data yet — run the sync function once, then this page updates automatically.";
      return;
    }
    latest = { ...(meta || {}), rows };
    overlay.classList.add("hidden");
    render();
  },
  (err) => {
    overlay.classList.remove("hidden");
    overlayMsg.textContent = "Connection error: " + err.message;
  }
);

/* ── Aggregation ── */
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Inclusive [start, end] (yyyy-mm-dd) of the selected date frame.
function periodRange(v) {
  const now = new Date();
  const y = now.getFullYear();
  if (v === "today") { const t = ymd(now); return [t, t]; }
  if (v === "week") {
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return [ymd(monday), "9999"];
  }
  if (v === "ytd") return [`${y}-01-01`, "9999"];
  if (v === "last_month") {
    return [ymd(new Date(y, now.getMonth() - 1, 1)), ymd(new Date(y, now.getMonth(), 0))];
  }
  if (v === "last_year") return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (v === "all") return ["0000", "9999"];
  return [ymd(new Date(y, now.getMonth(), 1)), "9999"]; // mtd
}

function matchesFilter(r, field, value) {
  return String(r[field] || "").trim().toLowerCase() === String(value).trim().toLowerCase();
}

// Rows within the dashboard's date frame + filters, plus the widget's own
// optional filter.
function rowsFor(widget) {
  const [start, end] = periodRange(state.view);
  const fields = latest.filterFields || [];
  const out = [];
  for (const r of latest.rows || []) {
    const d = r[CFG.dateField] || "";
    if (d < start || d > end) continue;
    let keep = true;
    for (const [k, v] of Object.entries(state.filters)) {
      if (fields.length && !fields.includes(k)) continue; // stale filter key
      if (!matchesFilter(r, k, v)) { keep = false; break; }
    }
    if (keep && widget?.ffield && widget?.fvalue && !matchesFilter(r, widget.ffield, widget.fvalue)) keep = false;
    if (keep) out.push(r);
  }
  return out;
}

function sumsOf(rows) {
  let apps = 0, revenue = 0;
  for (const r of rows) {
    apps += Number(r[CFG.appsField]) || 0;
    revenue += Number(r[CFG.revenueField]) || 0;
  }
  return { apps, revenue };
}

function aggBy(rows, keyFn) {
  const map = new Map();
  for (const r of rows) {
    const key = keyFn(r) || "—";
    const acc = map.get(key) || { apps: 0, revenue: 0 };
    acc.apps += Number(r[CFG.appsField]) || 0;
    acc.revenue += Number(r[CFG.revenueField]) || 0;
    map.set(key, acc);
  }
  return map;
}

function fmt(n) {
  return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}
function fmtMoney(n) {
  return "$" + Math.round(n).toLocaleString();
}
function fmtBy(metric, n) {
  return metric === "apps" ? fmt(n) : fmtMoney(n);
}

function widgetLabel(w) {
  if (w.label) return w.label;
  const suffix = w.fvalue ? ` — ${w.fvalue}` : "";
  if (w.type === "kpi") return METRICS[w.metric] + suffix;
  if (w.type === "breakdown") return `${METRICS[w.metric]} by ${String(w.field || "").replace(/_/g, " ")}` + suffix;
  return "Leaderboard" + (w.metric === "apps" ? " — Apps" : "") + suffix;
}

/* ── Rendering ── */
function render() {
  if (!latest) return;

  const kpis = state.widgets.filter((w) => w.type === "kpi");
  const boards = state.widgets.filter((w) => w.type !== "kpi");

  const kpiRow = document.getElementById("kpiRow");
  kpiRow.innerHTML = "";
  let headerSet = false;
  for (const w of kpis) {
    const sums = sumsOf(rowsFor(w));
    const value = w.metric === "apps" ? fmt(sums.apps)
      : w.metric === "avg" ? fmtMoney(sums.revenue / Math.max(1, sums.apps))
      : fmtMoney(sums.revenue);
    if (!headerSet) {
      document.getElementById("totalNum").textContent = value;
      document.getElementById("totalLbl").textContent = widgetLabel(w);
      headerSet = true;
    }
    const tile = document.createElement("div");
    tile.className = "kpi-tile";
    const num = document.createElement("div");
    num.className = "kpi-num";
    num.textContent = value;
    const lbl = document.createElement("div");
    lbl.className = "kpi-lbl";
    lbl.textContent = widgetLabel(w);
    tile.append(num, lbl);
    kpiRow.appendChild(tile);
  }

  const widgetsEl = document.getElementById("widgets");
  const scrollPos = [...widgetsEl.querySelectorAll(".wboard")].map((el) => el.scrollTop);
  widgetsEl.innerHTML = "";
  widgetsEl.style.gridTemplateColumns = `repeat(${Math.max(1, boards.length)}, 1fr)`;
  for (const w of boards) {
    const rows = rowsFor(w);
    const isAgents = w.type === "leaderboard";
    const map = aggBy(rows, isAgents ? (r) => r[CFG.agentField] : (r) => r[w.field]);
    const ranked = [...map.entries()]
      .map(([key, m]) => ({ key, ...m }))
      .sort((a, b) => b[w.metric] - a[w.metric] || String(a.key).localeCompare(String(b.key)));

    if (!headerSet) {
      const sums = sumsOf(rows);
      document.getElementById("totalNum").textContent = fmtBy(w.metric, sums[w.metric]);
      document.getElementById("totalLbl").textContent = METRICS[w.metric];
      headerSet = true;
    }

    const race = state.theme === "race" && isAgents;
    const panel = document.createElement("div");
    panel.className = "widget";
    const h = document.createElement("h3");
    h.textContent = (race ? "🏁 " : "") + widgetLabel(w);
    const boardEl = document.createElement("div");
    boardEl.className = "wboard";
    panel.append(h, boardEl);

    const ITEMS = ["👑", "🚀", "🍄", "⭐", "🐢", "🍌"];
    const max = ranked.length ? ranked[0][w.metric] : 1;
    const shown = ranked; // every matching entry — the board scrolls
    for (let i = 0; i < shown.length; i++) {
      const e = shown[i];
      const main = e[w.metric];
      const sub = w.metric === "apps" ? fmtMoney(e.revenue) : `${fmt(e.apps)} apps`;
      const row = document.createElement("div");
      const valueCell = `<div><div class="apps">${fmtBy(w.metric, main)}</div><div class="sub">${sub}</div></div>`;
      if (race) {
        row.className = "row race";
        const pct = max > 0 ? Math.max(2, (main / max) * 76) : 2;
        row.innerHTML = `
          <div class="rank r${i + 1}">${i + 1}</div>
          <div class="track">
            <div class="lane-name"></div>
            <div class="finish"></div>
            <div class="kart" style="left:${pct}%">
              <span class="item">${ITEMS[Math.min(i, ITEMS.length - 1)]}</span>
              <div class="avatar"></div>
              <span class="kart-emoji">🏎️</span>
            </div>
          </div>
          ${valueCell}`;
      } else {
        row.className = "row" + (isAgents ? "" : " noav");
        const pct = max > 0 ? Math.max(4, (main / max) * 100) : 4;
        // Theme trinkets: Temmenopoly builds houses toward the hotel;
        // Temmen Madness racks up baskets toward the trophy.
        let houses = "";
        if (isAgents && state.theme === "opoly") {
          houses = `<div class="houses">${i === 0 ? "🏨" : "🏠".repeat(Math.min(4, Math.floor(pct / 25)))}</div>`;
        } else if (isAgents && state.theme === "madness") {
          houses = `<div class="houses">${i === 0 ? "🏆" : "🏀".repeat(Math.min(3, Math.floor(pct / 33)))}</div>`;
        }
        row.innerHTML = `
          <div class="rank r${i + 1}">${i + 1}</div>
          ${isAgents ? '<div class="avatar"></div>' : ""}
          <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div><div class="name"></div>${houses}</div>
          ${valueCell}`;
      }
      row.querySelector(".name, .lane-name").textContent = isAgents ? displayNameOf(e.key) : e.key;
      if (isAgents) {
        const av = row.querySelector(".avatar");
        const photo = photoOf(e.key);
        if (photo) {
          const img = document.createElement("img");
          img.src = photo;
          img.alt = "";
          av.appendChild(img);
        } else {
          av.textContent = initialsOf(displayNameOf(e.key));
        }
      }
      boardEl.appendChild(row);
    }
    if (!ranked.length) {
      const empty = document.createElement("div");
      empty.className = "more";
      empty.textContent = "No apps in this period yet.";
      boardEl.appendChild(empty);
    }
    widgetsEl.appendChild(panel);
  }
  // Keep each board's scroll position across live refreshes.
  [...widgetsEl.querySelectorAll(".wboard")].forEach((el, i) => {
    if (scrollPos[i]) el.scrollTop = scrollPos[i];
  });

  if (!headerSet) {
    document.getElementById("totalNum").textContent = "—";
    document.getElementById("totalLbl").textContent = "";
  }

  updateStatus();
}

function updateStatus() {
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  const parts = [];
  if (latest?.updatedAt?.toDate) {
    const t = latest.updatedAt.toDate();
    parts.push(`Data synced ${t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`);
    // Sync runs every 5 min — flag if the doc is > 20 min old.
    dot.classList.toggle("stale", Date.now() - t.getTime() > 20 * 60_000);
  }
  if (latest?.rowCount != null) parts.push(`${latest.rowCount.toLocaleString()} rows`);
  if (latest?.warnings?.length) parts.push("⚠ " + latest.warnings[0]);
  txt.textContent = parts.join(" · ") || "Live";
}

}

  if (picker.classList.contains("hidden")) backdrop.classList.add("hidden");

function sideItem(it, isChild) {
  const el = document.createElement("div");
  el.className = "side-item" + (isChild ? " side-child" : "") +
    ((state.title || CFG.TITLE) === it.name ? " active" : "");

  const nameBtn = document.createElement("button");
  nameBtn.className = "side-name";
  nameBtn.textContent = (isChild ? "↳ " : "") + it.name;
  nameBtn.addEventListener("click", () => { switchTo(it.state); closeSidebar(); });
  el.appendChild(nameBtn);

  if (editMode) {
    const edit = document.createElement("button");
    edit.className = "side-act";
    edit.textContent = "✎";
    edit.title = it.idx == null ? "Customize (saves as a new dashboard)" : "Edit dashboard";
    edit.addEventListener("click", () => { closeSidebar(); openEditor(it.state, it.idx); });
    el.appendChild(edit);
  }

  if (editMode && it.idx != null) {
    const del = document.createElement("button");
    del.className = "side-act del";
    del.textContent = "✕";
    del.title = "Delete dashboard";
    del.addEventListener("click", () => {
      const ds = getDashboards();
      ds.splice(it.idx, 1);
      setDashboards(ds);
      renderSidebar();
    });
    el.appendChild(del);
  }
  return el;
}

function renderSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  const ds = getDashboards().map((d, idx) => ({ name: d.title, state: d, idx, id: d.id, parentId: d.parentId }));
  const topIds = new Set(ds.filter((d) => !d.parentId).map((d) => d.id));
  // Orphans (parent was deleted) surface at top level rather than vanish.
  const tops = ds.filter((d) => !d.parentId || !topIds.has(d.parentId));
  list.appendChild(sideItem({ name: CFG.TITLE, state: structuredClone(DEFAULT_STATE), idx: null }, false));
  for (const top of tops) {
    list.appendChild(sideItem(top, false));
    for (const child of ds.filter((d) => d.parentId && d.parentId === top.id)) {
      list.appendChild(sideItem(child, true));
    }
  }
}

document.getElementById("newDashBtn").addEventListener("click", () => {
  closeSidebar();
  openEditor({ ...structuredClone(DEFAULT_STATE), title: "" }, null);
});

/* ── Edit unlock (bottom of sidebar) ── */
let editMode = false;
const sideKey = document.getElementById("sideKey");
const unlockBtn = document.getElementById("editUnlockBtn");

async function verifyAdminKey(key) {
  // Posting the current list back is a no-op write that doubles as a key
  // check (and migrates any local-only dashboards up on first unlock).
  const resp = await fetch(CFG.DASH_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, dashboards: getDashboards() }),
  });
  return (await resp.json()).ok === true;
}

async function tryUnlock(key) {
  unlockBtn.textContent = "Checking…";
  let ok = false;
  try { ok = await verifyAdminKey(key); } catch { ok = false; }
  if (ok) {
    editMode = true;
    localStorage.setItem("tvAdminKey", key);
    sideKey.classList.add("hidden");
    unlockBtn.textContent = "🔓 Editing unlocked";
    unlockBtn.disabled = true;
    document.getElementById("newDashBtn").classList.remove("hidden");
    document.getElementById("gearBtn").classList.remove("hidden");
    renderSidebar();
  } else {
    unlockBtn.textContent = "🔒 Wrong key — try again";
    sideKey.classList.remove("hidden");
    sideKey.focus();
  }
}

unlockBtn.addEventListener("click", () => {
  if (editMode) return;
  const typed = sideKey.value.trim();
  const stored = (localStorage.getItem("tvAdminKey") || "").trim();
  if (typed) tryUnlock(typed);
  else if (sideKey.classList.contains("hidden") && stored) tryUnlock(stored);
  else {
    sideKey.classList.remove("hidden");
    sideKey.focus();
  }
});
sideKey.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && sideKey.value.trim()) tryUnlock(sideKey.value.trim());
});

/* ── Dashboard editor ── */
const picker = document.getElementById("picker");
let editorIdx = null; // index into saved dashboards, or null = save as new
document.getElementById("gearBtn").addEventListener("click", () => {
  const ds = getDashboards();
  let idx = state.id ? ds.findIndex((d) => d.id === state.id) : -1;
  if (idx === -1) idx = ds.findIndex((d) => d.title === state.title);
  openEditor(state, idx === -1 ? null : idx);
});
document.getElementById("pickerClose").addEventListener("click", closeEditor);

function closeEditor() {
  picker.classList.add("hidden");
  if (sidebar.classList.contains("hidden")) backdrop.classList.add("hidden");
}

function uniqueValues(field) {
  const seen = new Map();
  for (const r of latest?.rows || []) {
    const v = String(r[field] ?? "").trim();
    if (v) seen.set(v.toLowerCase(), v);
  }
  return [...seen.values()].sort((a, b) => a.localeCompare(b)).slice(0, 300);
}

function makeSelect(options, value, allLabel) {
  const sel = document.createElement("select");
  if (allLabel != null) {
    const o = document.createElement("option");
    o.value = "";
    o.textContent = allLabel;
    sel.appendChild(o);
  }
  const entries = Array.isArray(options) ? options.map((v) => [v, v]) : Object.entries(options);
  for (const [val, text] of entries) {
    const o = document.createElement("option");
    o.value = val;
    o.textContent = String(text).replace(/_/g, " ");
    sel.appendChild(o);
  }
  if (value != null) {
    sel.value = value;
    if (sel.value !== value && value !== "") { // preserve values missing from options
      const o = document.createElement("option");
      o.value = value;
      o.textContent = value;
      sel.appendChild(o);
      sel.value = value;
    }
  }
  return sel;
}

function labeled(text, el) {
  const label = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = text;
  label.append(span, el);
  return label;
}

function openEditor(source, idx) {
  editorIdx = idx;
  const s = normalizeState(structuredClone(source));
  document.getElementById("editorTitle").textContent = idx == null ? "New dashboard" : "Edit dashboard";
  document.getElementById("saveName").value = idx == null ? (source.title === CFG.TITLE ? "" : source.title || "") : s.title;
  document.getElementById("selView").value = s.view;
  document.getElementById("selScroll").value = s.autoScroll ? "on" : "off";
  document.getElementById("selTheme").value = s.theme || "default";

  // Parent choices: top-level saved dashboards (by id), excluding itself.
  const parentSel = document.getElementById("selParent");
  parentSel.replaceChildren();
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "None (top level)";
  parentSel.appendChild(none);
  for (const d of getDashboards()) {
    if (d.parentId || d.id === source.id) continue;
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = d.title;
    parentSel.appendChild(o);
  }
  parentSel.value = source.parentId || "";
  if (parentSel.value !== (source.parentId || "")) parentSel.value = "";

  // Dashboard-level filters
  const grid = document.getElementById("pickerGrid");
  grid.querySelectorAll("label.dyn").forEach((el) => el.remove());
  for (const f of latest?.filterFields || []) {
    const sel = makeSelect(uniqueValues(f), s.filters[f] || "", "All");
    sel.dataset.field = f;
    const label = labeled(f.replace(/_/g, " "), sel);
    label.className = "dyn";
    grid.appendChild(label);
  }

  // Widgets
  const list = document.getElementById("widgetsList");
  list.innerHTML = "";
  for (const w of s.widgets) list.appendChild(widgetRow(w));

  document.getElementById("agentsEditor").classList.add("hidden");
  picker.classList.remove("hidden");
  backdrop.classList.remove("hidden");
}

function widgetRow(w) {
  const row = document.createElement("div");
  row.className = "wrow";

  const fields = latest?.filterFields || [];
  const typeSel = makeSelect(WIDGET_TYPES, w.type);
  const metricSel = makeSelect(METRICS, METRICS[w.metric] ? w.metric : "revenue");
  const fieldSel = makeSelect(fields, w.field || (fields[0] || ""));
  const fFieldSel = makeSelect(fields, w.ffield || "", "No widget filter");
  const fValueSel = makeSelect(w.ffield ? uniqueValues(w.ffield) : [], w.fvalue || "", "All");
  const labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.placeholder = "Label (optional)";
  labelInput.value = w.label || "";
  const del = document.createElement("button");
  del.className = "w-del";
  del.textContent = "✕";
  del.title = "Remove widget";
  del.addEventListener("click", () => row.remove());

  function syncVisibility() {
    // "Avg $ / App" only makes sense for KPI tiles.
    metricSel.querySelector('option[value="avg"]').hidden = typeSel.value !== "kpi";
    if (typeSel.value !== "kpi" && metricSel.value === "avg") metricSel.value = "revenue";
    fieldSel.parentElement.style.visibility = typeSel.value === "breakdown" ? "visible" : "hidden";
  }
  typeSel.addEventListener("change", syncVisibility);
  fFieldSel.addEventListener("change", () => {
    const fresh = makeSelect(fFieldSel.value ? uniqueValues(fFieldSel.value) : [], "", "All");
    fresh.className = fValueSel.className;
    fValueSel.replaceChildren(...fresh.childNodes);
    fValueSel.value = "";
  });

  row.append(
    labeled("Widget", typeSel),
    labeled("KPI", metricSel),
    labeled("Break down by", fieldSel),
    labeled("Widget filter", fFieldSel),
    labeled("Filter value", fValueSel),
    labeled("Label", labelInput),
    del,
  );
  row._read = () => {
    const out = { type: typeSel.value, metric: metricSel.value };
    if (out.type === "breakdown") out.field = fieldSel.value;
    if (fFieldSel.value && fValueSel.value) { out.ffield = fFieldSel.value; out.fvalue = fValueSel.value; }
    if (labelInput.value.trim()) out.label = labelInput.value.trim();
    return out;
  };
  syncVisibility();
  return row;
}

document.getElementById("addWidgetBtn").addEventListener("click", () => {
  document.getElementById("widgetsList").appendChild(widgetRow({ type: "leaderboard", metric: "revenue" }));
});

function editorToState(title) {
  const filters = {};
  document.querySelectorAll("#pickerGrid select[data-field]").forEach((s) => {
    if (s.value) filters[s.dataset.field] = s.value;
  });
  const widgets = [...document.querySelectorAll("#widgetsList .wrow")].map((r) => r._read());
  const out = normalizeState({
    title: title || CFG.TITLE,
    view: document.getElementById("selView").value,
    autoScroll: document.getElementById("selScroll").value === "on",
    theme: document.getElementById("selTheme").value,
    filters,
    widgets,
  });
  const parentId = document.getElementById("selParent").value;
  if (parentId) out.parentId = parentId;
  else delete out.parentId;
  return out;
}

document.getElementById("applyBtn").addEventListener("click", () => {
  switchTo(editorToState(document.getElementById("saveName").value.trim() || state.title));
  closeEditor();
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const nameInput = document.getElementById("saveName");
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  const d = editorToState(name);
  const ds = getDashboards();
  // Keep the stable id across edits; new dashboards mint one.
  d.id = (editorIdx != null && ds[editorIdx]?.id) || crypto.randomUUID();
  if (editorIdx != null && ds[editorIdx]) ds[editorIdx] = d;
  else ds.push(d);
  setDashboards(ds);
  switchTo(d);
  closeEditor();
});

/* ── Agent editor (names + photos, saved to Firestore via the admin
      endpoint) ── */
const adminKeyInput = document.getElementById("adminKey");
adminKeyInput.value = localStorage.getItem("tvAdminKey") || "";
adminKeyInput.addEventListener("change", () => localStorage.setItem("tvAdminKey", adminKeyInput.value.trim()));

document.getElementById("agentsToggle").addEventListener("click", () => {
  const ed = document.getElementById("agentsEditor");
  ed.classList.toggle("hidden");
  if (!ed.classList.contains("hidden")) renderAgentsEditor();
});

function agentKeys() {
  const set = new Map();
  for (const r of latest?.rows || []) {
    const a = r[CFG.agentField];
    if (a) set.set(slugOf(a), a);
  }
  return [...set.values()].sort((a, b) => a.localeCompare(b));
}

const agentSearch = document.getElementById("agentSearch");
agentSearch.addEventListener("input", renderAgentsEditor);

// Downscale to a small square JPEG data URI so profiles stay tiny.
function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S = 160;
      const canvas = document.createElement("canvas");
      canvas.width = S; canvas.height = S;
      const scale = Math.max(S / img.width, S / img.height);
      const w = img.width * scale, h = img.height * scale;
      canvas.getContext("2d").drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("Could not read that image file."));
    img.src = URL.createObjectURL(file);
  });
}

async function saveProfile(agent, name, photo, btn) {
  const key = adminKeyInput.value.trim();
  if (!key) { adminKeyInput.focus(); return; }
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    const resp = await fetch(CFG.PROFILE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, agent, name, photo }),
    });
    const out = await resp.json();
    if (!out.ok) throw new Error(out.error || "Save failed");
    btn.textContent = "Saved ✓";
  } catch (e) {
    btn.textContent = "Error";
    alert("Save failed: " + e.message);
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = "Save"; }, 2000);
  }
}

function renderAgentsEditor() {
  const list = document.getElementById("agentsList");
  list.innerHTML = "";
  const q = agentSearch.value.trim().toLowerCase();
  const matches = agentKeys().filter((a) =>
    !q || a.toLowerCase().includes(q) || displayNameOf(a).toLowerCase().includes(q));
  for (const agent of matches) {
    const rowEl = document.createElement("div");
    rowEl.className = "agent-row";

    const av = document.createElement("div");
    av.className = "avatar";
    const photo = photoOf(agent);
    if (photo) {
      const img = document.createElement("img");
      img.src = photo;
      av.appendChild(img);
    } else {
      av.textContent = initialsOf(displayNameOf(agent));
    }

    const orig = document.createElement("div");
    orig.className = "orig";
    orig.title = agent;
    orig.textContent = agent;

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Display name / nickname";
    nameInput.value = profiles.get(slugOf(agent))?.name || "";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    let pendingPhoto = null;
    fileInput.addEventListener("change", async () => {
      if (!fileInput.files[0]) return;
      try {
        pendingPhoto = await resizePhoto(fileInput.files[0]);
        av.textContent = "";
        av.innerHTML = "";
        const img = document.createElement("img");
        img.src = pendingPhoto;
        av.appendChild(img);
      } catch (e) { alert(e.message); }
    });

    const btn = document.createElement("button");
    btn.textContent = "Save";
    btn.addEventListener("click", () =>
      saveProfile(agent, nameInput.value.trim(), pendingPhoto, btn));

    rowEl.append(av, orig, nameInput, fileInput, btn);
    list.appendChild(rowEl);
  }
}

/* ── Gentle auto-scroll (per-dashboard toggle) ──────────────────────────────
   Pause at the top, drift down through the full list, pause at the bottom,
   snap back, repeat. Any manual wheel/touch input pauses it briefly. */
const scrollMemo = new WeakMap(); // board element → {pauseUntil, atBottom}
let manualPauseUntil = 0;
const SCROLL_STEP = 1.4;        // px per 50ms tick ≈ 28 px/s
const TOP_PAUSE_MS = 6000;
const BOTTOM_PAUSE_MS = 5000;
const MANUAL_PAUSE_MS = 20_000;

document.getElementById("widgets").addEventListener("wheel", () => { manualPauseUntil = Date.now() + MANUAL_PAUSE_MS; }, { passive: true });
document.getElementById("widgets").addEventListener("touchstart", () => { manualPauseUntil = Date.now() + MANUAL_PAUSE_MS; }, { passive: true });

setInterval(() => {
  if (!state.autoScroll) return;
  const now = Date.now();
  if (now < manualPauseUntil) return;
  for (const el of document.querySelectorAll(".wboard")) {
    if (el.scrollHeight <= el.clientHeight + 4) continue; // everything fits
    let st = scrollMemo.get(el);
    if (!st) { st = { pauseUntil: now + TOP_PAUSE_MS, atBottom: false }; scrollMemo.set(el, st); }
    if (now < st.pauseUntil) continue;
    const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
    if (atEnd) {
      if (!st.atBottom) {
        st.atBottom = true;
        st.pauseUntil = now + BOTTOM_PAUSE_MS;
      } else {
        el.scrollTop = 0;
        st.atBottom = false;
        st.pauseUntil = now + TOP_PAUSE_MS;
      }
    } else {
      el.scrollTop += SCROLL_STEP;
    }
  }
}, 50);

/* ── Init ── */
applyState();

// Refresh date-frame boundary / staleness even when no new snapshot arrives.
setInterval(render, 60_000);

// Periodic hard reload for always-on TVs.
setTimeout(() => location.reload(), CFG.PAGE_RELOAD_MS);
</script>
